<script>
(function () {
  'use strict';
  const P = Poker, { h, money, signed, sfx } = Casino;
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const MIN = 5, MAX = 500, FORT = 5;
  const S = { ps: [], active: 0, chip: 25, bets: [], fort: [], last: [], lastF: [], phase: 'setup', deal: null, dealerSet: null, sets: [], pick: [], turn: -1, msg: null, results: null, seen: new Set(), pushAll: false };
  const CPU_UNIT = [10, 25, 5, 50, 15, 100];

  /* ---------- cards ---------- */
  const SUIT = { S: 'spades', H: 'hearts', D: 'diamonds', C: 'clubs' };
  function cardEl(c, delay) {
    const fresh = !S.seen.has(c.id + ':' + S.handNo); S.seen.add(c.id + ':' + S.handNo);
    if (c.joker) return h('div', { class: 'card joker' + (fresh ? ' fresh' : ''), style: fresh ? { '--d': (delay || 0) + 's' } : null, role: 'img', 'aria-label': 'Joker', html: '<span class="r">JOKER</span><svg class="b" viewBox="0 0 24 24"><use href="#sJ"/></svg>' });
    const red = c.s === 'H' || c.s === 'D', rk = P.rankName(c.r);
    return h('div', { class: 'card' + (red ? ' red' : '') + (fresh ? ' fresh' : ''), style: fresh ? { '--d': (delay || 0) + 's' } : null, role: 'img', 'aria-label': rk + ' of ' + SUIT[c.s],
      html: '<span class="r">' + (rk === '10' ? '10' : rk) + '</span><svg class="s" viewBox="0 0 24 24"><use href="#s' + c.s + '"/></svg><svg class="b" viewBox="0 0 24 24"><use href="#s' + c.s + '"/></svg>' });
  }
  const sortCards = cs => cs.slice().sort((a, b) => (b.joker ? 15 : b.r) - (a.joker ? 15 : a.r) || a.s.localeCompare(b.s));
  const chipFor = b => b >= 500 ? 500 : b >= 100 ? 100 : b >= 25 ? 25 : b >= 5 ? 5 : 1;

  /* ---------- flow ---------- */
  function start(players) {
    S.ps = players; S.bets = players.map(() => 0); S.fort = players.map(() => 0); S.last = players.map(() => 0); S.lastF = players.map(() => 0); S.handNo = 0;
    const first = players.findIndex(p => p.human); S.active = first < 0 ? 0 : first;
    $('setup').hidden = true; $('game').hidden = false; $('dock').hidden = false;
    try { if (!localStorage.getItem('luckyseven.paigow.seen')) { localStorage.setItem('luckyseven.paigow.seen', '1'); setTimeout(showRules, 400); } } catch (e) { /* ignore */ }
    beginBet();
  }
  function beginBet() {
    S.phase = 'bet'; S.deal = null; S.dealerSet = null; S.sets = []; S.results = null; S.turn = -1; S.pushAll = false; $('setter').innerHTML = '';
    S.msg = ['Place your bets', 'Main bet ' + money(MIN) + '–' + money(MAX) + ' · Fortune bonus ' + money(FORT) + ' optional'];
    S.ps.forEach((p, i) => {
      if (!p.human) { if (p.bank < MIN + FORT) { Casino.rebuy(p); Casino.toast(p.name + ' reloads ' + money(Casino.START_BANK) + '.'); } S.bets[i] = Math.min(CPU_UNIT[p.style % 6], Math.floor(p.bank / MIN) * MIN); S.fort[i] = (p.style % 3 === 0) ? FORT : 0; }
      else { S.bets[i] = S.last[i] && p.bank >= S.last[i] + S.lastF[i] ? S.last[i] : 0; S.fort[i] = S.bets[i] ? S.lastF[i] : 0; }
    });
    Casino.save(); render();
  }
  async function deal() {
    if (S.phase !== 'bet') return;
    if (!S.ps.some((p, i) => p.human && S.bets[i] >= MIN)) { Casino.toast('Place a bet of at least ' + money(MIN) + ' first.'); return; }
    S.last = S.bets.slice(); S.lastF = S.fort.slice(); S.handNo++;
    S.ps.forEach((p, i) => { if (S.bets[i] < MIN) { S.bets[i] = 0; S.fort[i] = 0; } p.bank = Casino.r2(p.bank - S.bets[i] - S.fort[i]); });
    const d = P.paiGowDeal(S.ps.length, window.__pgRng || Math.random); S.deal = d;
    S.dealerSet = P.houseWay(d.dealer); S.pushAll = P.dealerAceHighPaiGow(d.dealer);
    S.phase = 'dealing'; S.msg = ['Dealing…', '']; render(); for (let i = 0; i < 8; i++) setTimeout(() => sfx('card'), i * 90);
    await sleep(900);
    S.msg = S.pushAll ? ['Dealer has ace-high pai gow', 'Every main bet pushes this hand. Fortune bets still pay.'] : ['The dealer sets the house way', P.describe(P.eval5(S.dealerSet.high)) + ' · ' + P.describe2(P.eval2(S.dealerSet.low))];
    S.phase = 'set'; render(); await sleep(700);
    S.sets = S.ps.map(() => null);
    nextSetter();
  }
  async function nextSetter() {
    for (let i = 0; i < S.ps.length; i++) {
      if (S.sets[i] || !S.bets[i]) continue;
      const p = S.ps[i];
      if (!p.human) { S.sets[i] = P.bestVsDealer(S.deal.hands[i], S.dealerSet); S.turn = i; render(); await sleep(450); continue; }
      S.turn = i; S.pick = []; S.msg = [p.name === 'You' ? 'Your turn to set' : p.name + '’s turn to set', 'Pick the two cards for your low hand below']; render(); scrollToTurn(); return;
    }
    S.turn = -1; settle();
  }
  function confirmSet() {
    const i = S.turn, p = S.ps[i]; if (S.phase !== 'set' || !p || !p.human) return;
    const cards = S.deal.hands[i]; if (S.pick.length !== 2) { Casino.toast('Pick exactly two cards for the low hand.'); return; }
    const low = cards.filter(c => S.pick.includes(c.id)), high = cards.filter(c => !S.pick.includes(c.id));
    if (!P.validSet(high, low)) { Casino.toast('Your five-card hand must beat your two-card hand.'); sfx('lose'); return; }
    S.sets[i] = { high, low }; sfx('click'); nextSetter();
  }
  function useSet(sp) { S.pick = sp.low.map(c => c.id); sfx('click'); render(); }
  function settle() {
    S.phase = 'done'; const res = [];
    S.ps.forEach((p, i) => {
      if (!S.bets[i]) { res.push(null); return; }
      const o = S.pushAll ? 'push' : P.outcome(S.sets[i], S.dealerSet);
      let net = o === 'win' ? S.bets[i] : o === 'lose' ? -S.bets[i] : 0;
      p.bank = Casino.r2(p.bank + S.bets[i] + net);
      let fNet = 0, f = null;
      if (S.fort[i]) { f = P.fortune(S.deal.hands[i]); if (f) { fNet = S.fort[i] * f.pay; p.bank = Casino.r2(p.bank + S.fort[i] + fNet); } else fNet = -S.fort[i]; }
      res.push({ o, net, fNet, f });
      Casino.touch(p);
    });
    S.results = res; Casino.save();
    const anyWin = res.some(r => r && r.net + r.fNet > 0), big = res.some(r => r && r.fNet >= 100);
    S.msg = S.pushAll ? ['Ace-high pai gow: all main bets push', ''] : ['Hands are settled', 'Both hands beat the dealer to win · ties go to the dealer'];
    render();
    res.forEach((r, i) => { if (!r) return; const el = document.querySelector('.ps[data-i="' + i + '"]'), n = Casino.r2(r.net + r.fNet); if (el) Casino.pop(el, n === 0 ? 'Push' : signed(n), n > 0 ? 'win' : n < 0 ? 'lose' : 'push'); });
    sfx(big ? 'big' : anyWin ? 'win' : res.some(r => r && r.net < 0) ? 'lose' : 'push');
    if (S.ps.some(p => p.human && p.bank < MIN)) Casino.toast('Someone is out of chips. Tap Rebuy on their seat.');
  }

  /* ---------- betting ---------- */
  function addChip(i, v) {
    if (S.phase !== 'bet') return; const p = S.ps[i]; if (!p || !p.human) return;
    const nb = Casino.r2((S.bets[i] || 0) + v);
    if (nb > MAX) { Casino.toast('Table maximum is ' + money(MAX) + '.'); return; }
    if (nb + S.fort[i] > p.bank + 1e-9) { Casino.toast('Not enough chips.'); sfx('lose'); return; }
    S.bets[i] = nb; sfx('chip'); render();
  }
  function toggleFortune(i) {
    if (S.phase !== 'bet') return; const p = S.ps[i]; if (!p || !p.human) return;
    if (!S.fort[i] && S.bets[i] + FORT > p.bank + 1e-9) { Casino.toast('Not enough chips.'); return; }
    S.fort[i] = S.fort[i] ? 0 : FORT; sfx('chip'); render();
  }

  /* ---------- rendering ---------- */
  function renderDealer() {
    const d = $('dealer'); d.innerHTML = '';
    if (!S.deal) { d.append(h('div', { class: 'lab' }, 'Dealer'), h('div', { class: 'row5', style: { minHeight: '62px', alignItems: 'center', color: 'var(--mute)', fontSize: '13px' } }, 'Seven cards each, dealt face up')); return; }
    if (!S.dealerSet || S.phase === 'dealing') { d.append(h('div', { class: 'lab' }, 'Dealer'), h('div', { class: 'row5' }, sortCards(S.deal.dealer).map((c, k) => cardEl(c, k * .09)))); return; }
    d.append(h('div', { class: 'hand2' },
      h('div', null, h('div', { class: 'lab' }, 'Dealer high'), h('div', { class: 'row5' }, sortCards(S.dealerSet.high).map(c => cardEl(c))), h('span', { class: 'desc' }, P.describe(P.eval5(S.dealerSet.high)))),
      h('div', null, h('div', { class: 'lab' }, 'Dealer low'), h('div', { class: 'row5' }, sortCards(S.dealerSet.low).map(c => cardEl(c))), h('span', { class: 'desc' }, P.describe2(P.eval2(S.dealerSet.low))))));
  }
  function renderSeats() {
    const box = $('seats'), keep = box.scrollLeft; box.innerHTML = '';
    S.ps.forEach((p, i) => {
      const turn = S.turn === i && S.phase === 'set';
      const el = h('div', { class: 'ps' + (turn ? ' turn' : ''), 'data-i': i, 'aria-pressed': i === S.active, style: { '--pc': p.color }, onclick: () => { if (p.human && S.phase === 'bet') { S.active = i; sfx('click'); render(); } } },
        h('div', { class: 'nm' }, h('span', { class: 'dot' }), p.name, p.human ? null : h('span', { class: 'cpu' }, 'CPU')),
        h('div', { class: 'bk' }, money(S.phase === 'bet' ? Casino.r2(p.bank - S.bets[i] - S.fort[i]) : p.bank)));
      if (S.deal && S.bets[i]) {
        const set = S.sets[i];
        if (set && (S.phase === 'done' || !p.human || S.turn !== i)) {
          el.append(h('div', { class: 'row5' }, sortCards(set.high).map(c => cardEl(c))), h('div', { class: 'row5', style: { marginTop: '3px' } }, sortCards(set.low).map(c => cardEl(c))));
          el.append(h('div', { style: { fontSize: '11px', color: '#f3e9d2', marginTop: '3px' } }, P.describe(P.eval5(set.high)) + ' · ' + P.describe2(P.eval2(set.low))));
        } else el.append(h('div', { class: 'row5' }, sortCards(S.deal.hands[i]).map((c, k) => cardEl(c, .1 + k * .06))));
      }
      if (S.phase === 'done' && S.results && S.results[i]) {
        const r = S.results[i];
        el.append(h('div', null, h('span', { class: 'res ' + r.o }, r.o === 'win' ? 'Win' : r.o === 'lose' ? 'Lose' : 'Push')));
        if (S.fort[i]) el.append(h('div', { style: { fontSize: '11px', fontWeight: 800, color: r.f ? 'var(--good)' : 'var(--mute)', marginTop: '3px' } }, r.f ? 'Fortune: ' + r.f.name + ' pays ' + r.f.pay + ' to 1' : 'Fortune: no qualifying hand'));
      }
      el.append(h('div', { class: 'bets' }, S.bets[i] ? [Casino.chipEl(chipFor(S.bets[i])), money(S.bets[i])] : h('span', { style: { color: 'var(--mute)', fontWeight: 700 } }, p.bank < MIN ? 'Out of chips' : 'No bet'), S.fort[i] ? h('span', { style: { color: 'var(--cyan)' } }, '+ Fortune ' + money(S.fort[i])) : null));
      if (p.human && p.bank < MIN && (S.phase === 'bet' || S.phase === 'done')) el.append(h('button', { class: 'rebuy', type: 'button', onclick: e => { e.stopPropagation(); Casino.rebuy(p); sfx('chips'); render(); } }, 'Rebuy ' + money(Casino.START_BANK)));
      box.append(el);
    });
    box.scrollLeft = keep;
  }
  function scrollToTurn() { const box = $('seats'), el = box.querySelector('.ps.turn'); if (el) box.scrollLeft = el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2; }
  function renderSetter() {
    const box = $('setter'); box.innerHTML = '';
    if (S.phase !== 'set' || S.turn < 0 || !S.ps[S.turn].human) return;
    const i = S.turn, cards = sortCards(S.deal.hands[i]), low = cards.filter(c => S.pick.includes(c.id)), high = cards.filter(c => !S.pick.includes(c.id));
    const valid = low.length === 2 && P.validSet(high, low);
    let verdict = '';
    if (low.length === 2 && valid && !S.pushAll) { const o = P.outcome({ high, low }, S.dealerSet); verdict = o === 'win' ? 'This setting beats the dealer on both hands: you win.' : o === 'lose' ? 'This setting loses both hands to the dealer.' : 'This setting wins one hand and loses the other: a push.'; }
    box.append(h('div', { class: 'setter' },
      h('h3', null, S.ps[i].name + ': set your hand'),
      h('p', { style: { textAlign: 'center', margin: '0 0 4px', fontSize: '12.5px', color: 'var(--mute)' } }, 'Tap two cards to lift them into your low hand. The rest make your five-card high hand.'),
      h('div', { class: 'seven' }, cards.map(c => h('button', { type: 'button', 'aria-pressed': S.pick.includes(c.id), onclick: () => {
        if (S.pick.includes(c.id)) S.pick = S.pick.filter(x => x !== c.id); else { if (S.pick.length >= 2) S.pick.shift(); S.pick.push(c.id); }
        sfx('card'); render(); } }, cardEl(c)))),
      h('div', { class: 'split' },
        h('div', null, h('div', { class: 'lab' }, 'High hand (5)'), high.map(c => cardEl(c)), h('div', null, h('span', { class: 'desc' }, high.length === 5 ? P.describe(P.eval5(high)) : '—'))),
        h('div', null, h('div', { class: 'lab' }, 'Low hand (2)'), low.map(c => cardEl(c)), h('div', null, h('span', { class: 'desc' }, low.length === 2 ? P.describe2(P.eval2(low)) : 'Pick 2')))),
      h('div', { class: 'warn' + (valid ? ' ok' : '') }, low.length < 2 ? '' : !valid ? 'Not allowed: your five-card hand must beat your two-card hand.' : verdict)));
  }
  function renderMsg() { const m = $('msg'); m.innerHTML = ''; if (S.msg) m.append(h('div', null, h('b', null, S.msg[0]), S.msg[1] ? h('small', null, S.msg[1]) : null)); }
  function renderDock() {
    const box = $('dockIn'); box.innerHTML = '';
    if (S.phase === 'bet') {
      const ap = S.ps[S.active];
      box.append(Casino.chipTray(S.chip, v => { S.chip = v; addChip(S.active, v); }));
      box.append(h('div', { class: 'who2' }, ap && ap.human ? h('span', null, 'Betting for ', h('b', null, ap.name), ' · bet ', h('b', null, money(S.bets[S.active] || 0)), S.fort[S.active] ? ' + Fortune ' + money(S.fort[S.active]) : '') : 'Seat a human player to bet'));
      box.append(h('div', { class: 'acts' },
        h('button', { class: 'btn ghost', type: 'button', onclick: () => { S.bets[S.active] = 0; S.fort[S.active] = 0; sfx('click'); render(); } }, 'Clear'),
        h('button', { class: 'btn ghost', type: 'button', 'aria-pressed': !!S.fort[S.active], onclick: () => toggleFortune(S.active) }, S.fort[S.active] ? 'Fortune ✓' : 'Fortune $5'),
        h('button', { class: 'btn red', type: 'button', onclick: deal }, 'Deal')));
    } else if (S.phase === 'set' && S.turn >= 0 && S.ps[S.turn].human) {
      const cards = S.deal.hands[S.turn];
      box.append(h('div', { class: 'acts' },
        h('button', { class: 'btn ghost', type: 'button', onclick: () => useSet(P.houseWay(cards)) }, 'House way'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => useSet(P.bestVsDealer(cards, S.dealerSet)) }, 'Best play'),
        h('button', { class: 'btn green', type: 'button', onclick: confirmSet }, 'Set hand')));
    } else if (S.phase === 'done') {
      box.append(h('div', { class: 'acts', style: { gridTemplateColumns: '1fr' } }, h('button', { class: 'btn big green', type: 'button', onclick: () => { sfx('click'); beginBet(); } }, 'Next hand')));
    } else box.append(h('div', { class: 'who2' }, S.phase === 'set' ? 'Players are setting their hands…' : 'Dealing…'));
  }
  function render() { renderDealer(); renderMsg(); renderSeats(); renderSetter(); renderDock(); }

  function showRules() {
    Casino.modal('Face Up Pai Gow Poker', h('div', null,
      h('p', null, 'Everyone, the dealer included, gets seven cards from a 53-card deck with one joker. Split your seven into a ', h('b', null, 'five-card high hand'), ' and a ', h('b', null, 'two-card low hand'), '. The high hand must beat the low hand.'),
      h('h3', null, 'Face up'),
      h('p', null, 'The dealer’s cards are dealt face up and set the house way before you set yours, so you know exactly what you have to beat. Tap ', h('b', null, 'Best play'), ' to see the setting that does best against this dealer.'),
      h('h3', null, 'Winning'),
      h('p', null, 'Beat the dealer with both hands and you win even money, with no commission. Win one and lose one and it’s a push. Ties go to the dealer. If the dealer has an ', h('b', null, 'ace-high pai gow'), ' (no pair, straight or flush, ace on top), every main bet pushes.'),
      h('h3', null, 'The joker'),
      h('p', null, 'The joker counts as an ace, or as any card that completes a straight, flush or straight flush.'),
      h('h3', null, 'Fortune bonus ($5)'),
      h('table', null, h('tr', null, h('th', null, 'Seven-card hand'), h('th', { class: 'r' }, 'Pays')), P.FORTUNE.map(([n, pay]) => h('tr', null, h('td', null, n), h('td', { class: 'r' }, pay + ' to 1')))),
      h('p', null, 'Play money only.')), [{ label: 'Deal me in', cls: '' }]);
  }

  $('bRules').addEventListener('click', showRules);
  const snd = $('bSnd'); snd.setAttribute('aria-pressed', !Casino.isMuted()); snd.addEventListener('click', () => { Casino.setMuted(!Casino.isMuted()); snd.setAttribute('aria-pressed', !Casino.isMuted()); sfx('click'); });
  window.__pg = { S, P, deal, confirmSet, beginBet, render, addChip, toggleFortune, useSet };
  Casino.pickSeats($('setup'), { game: 'paigow', max: 5, title: 'Take your seats', blurb: 'Up to five players. Seven cards each, the dealer’s hand face up, no commission.', onStart: start });
  Casino.registerSW();
})();
