<title>Chance Academy — Science, Numbers & Reading</title>
<style>
/* Chance Academy — built for a 7-year-old on an iPad.
   Rules that drive every choice here:
   - Nothing important is text-only. Every action has a picture.
   - Tap targets are at least 64px. Fingers, not styluses.
   - No timers on screen, no red X, no "wrong" — the owl coaches instead.
   - High contrast, no thin type, no hover-only affordances. */

:root {
  --navy: #0f2a4a;
  --navy-2: #16375e;
  --paper: #f4f7fb;
  --ink: #1b2a3a;
  --ink-soft: #5b7089;
  --line: #d9e2ee;
  --sun: #ffc93c;
  --sun-deep: #f5a524;
  --leaf: #2fae6a;
  --leaf-deep: #1d8a51;
  --sky: #3aa0f5;
  --grape: #8b5cf6;
  --coral: #ff7a59;
  --shadow: 0 6px 0 rgba(16, 42, 74, .16);
  --radius: 22px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  font-size: 18px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}
body { padding: max(10px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }

h1, h2, h3 { margin: 0; line-height: 1.15; }
button { font-family: inherit; font-size: inherit; border: 0; background: none; color: inherit; cursor: pointer; }

.screen { max-width: 900px; margin: 0 auto; }
.screen[hidden] { display: none; }
.spacer { flex: 1; }

/* ------------------------------- HOME ------------------------------- */
.hero { display: flex; align-items: center; gap: 14px; padding: 6px 4px 16px; }
.hero-badge {
  width: 62px; height: 62px; flex: 0 0 62px; border-radius: 20px;
  display: grid; place-items: center; font-size: 34px;
  background: linear-gradient(160deg, var(--navy-2), var(--navy));
  box-shadow: var(--shadow);
}
.hero-text { flex: 1; min-width: 0; }
.hero h1 { font-size: clamp(24px, 5.5vw, 34px); font-weight: 800; letter-spacing: -.5px; }
.hero p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }

.today-card {
  display: flex; align-items: center; gap: 14px;
  background: linear-gradient(150deg, #1c4a7e, var(--navy));
  color: #fff; border-radius: 26px; padding: 18px;
  box-shadow: 0 10px 24px rgba(15, 42, 74, .3);
  transition: transform .08s;
}
.today-card:active { transform: scale(.985); }
.today-icon { font-size: 52px; width: 72px; text-align: center; flex: 0 0 72px; }
.today-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kicker { font-size: 12px; letter-spacing: 1.4px; font-weight: 800; opacity: .75; }
.kicker b { background: rgba(255,255,255,.18); border-radius: 999px; padding: 2px 8px; margin-left: 6px; letter-spacing: .6px; }
.today-body strong { font-size: clamp(19px, 4.6vw, 25px); font-weight: 800; }
.today-sub { font-size: 14px; opacity: .8; }
.today-go { font-size: 30px; opacity: .9; padding-right: 4px; }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dots i { width: 26px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); }
.dots i.on { background: var(--sun); }

.icon-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0;
}
@media (max-width: 420px) { .icon-grid { grid-template-columns: repeat(2, 1fr); } }
.tile {
  position: relative; border-radius: var(--radius); padding: 18px 8px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #fff; border: 2px solid var(--line);
  box-shadow: var(--shadow); min-height: 108px;
  transition: transform .08s;
}
.tile:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(16,42,74,.16); }
.tile-icon { font-size: 40px; line-height: 1; }
.tile-label { font-size: 15px; font-weight: 800; }
.tile-science { border-color: #b9dcff; background: #f0f8ff; }
.tile-math    { border-color: #ffe0a8; background: #fff9ec; }
.tile-read    { border-color: #c8f0d8; background: #f1fbf5; }
.tile-map     { border-color: #ded0ff; background: #f7f3ff; }
.tile-rewards { border-color: #ffd2c6; background: #fff5f2; }
.tile-word    { border-color: #cdeaf2; background: #f1fbfd; }
.tile-count {
  position: absolute; top: 8px; right: 10px; min-width: 26px;
  background: var(--sun); color: #4a3200; font-weight: 800; font-size: 13px;
  border-radius: 999px; padding: 1px 7px;
}

.goal-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .goal-strip { grid-template-columns: 1fr; } }
.goal {
  background: #fff; border: 2px solid var(--line); border-radius: 18px;
  padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center;
}
.goal-icon { font-size: 26px; }
.goal b { display: block; font-size: 14px; }
.goal i { font-style: normal; font-size: 13px; color: var(--ink-soft); }
.goal .bar { grid-column: 1 / -1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.goal .bar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--leaf), var(--sun)); transition: width .5s; }

/* ------------------------------ TOP BAR ----------------------------- */
.bar-top { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
.bar-top h2 { font-size: clamp(17px, 4.4vw, 22px); font-weight: 800; flex: 1; }
.icon-btn {
  width: 56px; height: 56px; flex: 0 0 56px; border-radius: 18px;
  display: grid; place-items: center; font-size: 26px;
  background: #fff; border: 2px solid var(--line); box-shadow: var(--shadow);
}
.icon-btn:active { transform: translateY(2px); box-shadow: none; }
.icon-btn.small { width: 48px; height: 48px; flex-basis: 48px; font-size: 22px; }
.icon-btn.on { background: var(--sun); border-color: var(--sun-deep); }

.progress-pips { display: flex; gap: 6px; flex: 1; }
.progress-pips i { flex: 1; max-width: 60px; height: 10px; border-radius: 99px; background: var(--line); }
.progress-pips i.on { background: var(--leaf); }
.progress-pips i.now { background: var(--sun); }

.think-meter { display: flex; align-items: center; gap: 6px; }
.tm-icon { font-size: 20px; }
.tm-fill { width: 54px; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tm-fill i { display: block; height: 100%; width: 60%; background: var(--leaf); transition: width .4s, background .4s; }
.tm-fill i.warn { background: var(--sun-deep); }
.tm-fill i.slow { background: var(--coral); }

/* ------------------------------ STATIONS ---------------------------- */
.stage { padding-bottom: 120px; }
.card {
  background: #fff; border: 2px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.card-head .em { font-size: 36px; }
.card-head h3 { font-size: clamp(18px, 4.4vw, 24px); font-weight: 800; }
.card-head .tag { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; color: var(--ink-soft); }

.lines p { margin: 0 0 10px; font-size: clamp(18px, 4.4vw, 21px); }
.lines p.said { background: #fffbea; border-radius: 10px; box-shadow: 0 0 0 6px #fffbea; }

.bigword {
  display: flex; align-items: center; gap: 12px; margin-top: 12px;
  background: #f0f8ff; border: 2px dashed #9ecbff; border-radius: 16px; padding: 12px 14px;
}
.bigword .w { font-size: 22px; font-weight: 800; }
.bigword .say { font-size: 15px; color: var(--ink-soft); letter-spacing: 1px; }
.bigword .mean { font-size: 15px; }

.story {
  background: #fff9ec; border: 2px solid #ffe0a8; border-radius: 16px;
  padding: 14px; margin-bottom: 12px; font-size: clamp(17px, 4.2vw, 20px);
}
.qtext { font-size: clamp(19px, 4.8vw, 23px); font-weight: 800; margin: 4px 0 14px; }

.choices { display: grid; gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: #fff; border: 3px solid var(--line); border-radius: 18px;
  padding: 14px 16px; min-height: 66px; font-size: clamp(17px, 4.2vw, 20px); font-weight: 600;
  box-shadow: var(--shadow); transition: transform .08s, border-color .15s, background .15s;
}
.choice .pick { font-size: 22px; width: 30px; flex: 0 0 30px; text-align: center; }
.choice:active { transform: translateY(2px); box-shadow: none; }
.choice.right { border-color: var(--leaf); background: #ecfbf2; }
.choice.rethink { border-color: var(--sun-deep); background: #fff8e6; opacity: .95; }
.choice.faded { opacity: .35; }
.choice[disabled] { box-shadow: none; }

.showwork {
  margin-top: 14px; background: #f1fbf5; border: 2px solid #c8f0d8;
  border-radius: 16px; padding: 12px 14px; font-size: 17px;
}
.showwork b { display: block; font-size: 13px; letter-spacing: 1.2px; color: var(--leaf-deep); }

/* ------------------------- READING / PHONICS ------------------------ */
.word-hero { text-align: center; padding: 6px 0 4px; }
.word-hero .word {
  font-size: clamp(40px, 12vw, 68px); font-weight: 800; letter-spacing: 2px;
  display: flex; justify-content: center; flex-wrap: wrap; gap: 4px;
}
.chunk {
  padding: 2px 10px; border-radius: 12px; background: #f1fbf5; border: 2px solid #c8f0d8;
}
.chunk.lit { background: var(--sun); border-color: var(--sun-deep); }
.word-hero .say { font-size: 17px; color: var(--ink-soft); letter-spacing: 2px; margin-top: 6px; }

.mic-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0 4px; flex-wrap: wrap; }
.mic-btn {
  width: 92px; height: 92px; border-radius: 50%; font-size: 42px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, #ff9370, var(--coral));
  box-shadow: 0 8px 0 #d95a3c;
}
.mic-btn:active { transform: translateY(3px); box-shadow: 0 5px 0 #d95a3c; }
.mic-btn.live { animation: pulse 1s infinite; background: linear-gradient(160deg, #6ee7a8, var(--leaf)); box-shadow: 0 8px 0 var(--leaf-deep); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.heard { text-align: center; font-size: 16px; color: var(--ink-soft); min-height: 24px; }
.heard b { color: var(--ink); }

.sentence { font-size: clamp(19px, 4.8vw, 24px); line-height: 1.7; }
.sentence span { padding: 1px 2px; border-radius: 6px; }
.sentence span.lit { background: var(--sun); }

/* -------------------------- BOTTOM ACTIONS -------------------------- */
.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 12px 14px max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(244,247,251,0), var(--paper) 40%);
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
}
.btn-big {
  flex: 1; max-width: 420px; min-height: 68px; border-radius: 22px;
  font-size: 21px; font-weight: 800; color: #163;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(180deg, #7ee0a8, var(--leaf)); color: #06371f;
  box-shadow: 0 6px 0 var(--leaf-deep);
}
.btn-big:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--leaf-deep); }
.btn-big.sun { background: linear-gradient(180deg, #ffd978, var(--sun)); box-shadow: 0 6px 0 var(--sun-deep); color: #4a3200; }
.btn-big.ghost { background: #fff; border: 2px solid var(--line); box-shadow: var(--shadow); color: var(--ink); }

/* Stop and Home: always reachable inside a mission, but sized so the
   wide primary button is still obviously the thing to tap next. */
.btn-big.compact {
  flex: 0 1 auto; min-width: 104px; max-width: 150px;
  font-size: 17px; min-height: 64px; gap: 7px; padding: 0 14px;
}
.btn-big.compact.hushed {
  background: var(--sun); border-color: var(--sun-deep); color: #4a3200;
}

/* ------------------------------- COACH ------------------------------ */
/* An author `display` beats the UA stylesheet's [hidden] rule, so the
   hidden state has to be declared explicitly or the empty bubble sits
   on screen for the whole mission. */
.coach[hidden] { display: none; }
.coach {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 45;
  width: min(860px, calc(100% - 28px));
  display: flex; align-items: center; gap: 10px;
  background: #fffbea; border: 3px solid var(--sun); border-radius: 20px;
  padding: 12px 14px; box-shadow: 0 12px 28px rgba(15,42,74,.18);
  animation: pop .22s ease-out;
}
@keyframes pop { from { transform: translateX(-50%) translateY(14px); opacity: 0; } }
.coach-face { font-size: 34px; }
.coach-bubble { flex: 1; }
.coach-bubble p { margin: 0; font-size: 17px; font-weight: 600; }

/* ------------------------------- LISTS ------------------------------ */
.scroll { padding-bottom: 40px; }
.week-block { margin-bottom: 18px; }
.week-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; color: var(--ink-soft); margin: 4px 0 8px; letter-spacing: .5px; }
.week-title .em { font-size: 22px; }
.day-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 520px) { .day-row { grid-template-columns: repeat(3, 1fr); } }
.day-chip {
  background: #fff; border: 2px solid var(--line); border-radius: 16px;
  padding: 12px 6px; text-align: center; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 4px; align-items: center;
}
.day-chip .em { font-size: 26px; }
.day-chip .n { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.day-chip .t { font-size: 12px; line-height: 1.25; }
.day-chip.done { border-color: var(--leaf); background: #f1fbf5; }
.day-chip.done::after { content: "⭐"; position: absolute; }
.day-chip.today { border-color: var(--sun-deep); background: #fff9ec; }

.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.badge {
  background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 14px 10px;
  text-align: center; box-shadow: var(--shadow);
}
.badge .em { font-size: 44px; display: block; }
.badge .nm { font-size: 14px; font-weight: 800; margin-top: 4px; }
.badge .dt { font-size: 12px; color: var(--ink-soft); }
.badge.locked { opacity: .38; }
.badge.locked .em { filter: grayscale(1); }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 26px; }
.stat i { font-style: normal; font-size: 12px; color: var(--ink-soft); }

.report-item { background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--sun); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.report-item.good { border-left-color: var(--leaf); }
.report-item.watch { border-left-color: var(--coral); }
.report-item b { display: block; font-size: 16px; }
.report-item span { font-size: 15px; color: var(--ink-soft); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; background: #fff; border-radius: 14px; overflow: hidden; }
table.tbl th, table.tbl td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
table.tbl th { background: #eef4fb; font-size: 13px; letter-spacing: .5px; }

/* ------------------------------ OVERLAY ----------------------------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(15, 42, 74, .55);
  display: grid; place-items: center; padding: 16px;
}
.overlay[hidden] { display: none; }
.sheet {
  background: #fff; border-radius: 26px; padding: 20px; width: min(560px, 100%);
  max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  animation: pop2 .2s ease-out; text-align: center;
}
@keyframes pop2 { from { transform: scale(.94); opacity: 0; } }
.sheet h3 { font-size: 24px; margin-bottom: 6px; }
.sheet .big-em { font-size: 76px; line-height: 1; }
.sheet p { color: var(--ink-soft); }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.sheet canvas { width: 100%; max-width: 320px; border-radius: 14px; border: 2px solid var(--line); }
.share-btn {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px; min-height: 56px;
  border-radius: 16px; font-weight: 800; background: #fff; border: 2px solid var(--line); box-shadow: var(--shadow);
}
.share-btn .em { font-size: 22px; }
.field { display: block; text-align: left; margin: 10px 0; font-size: 14px; font-weight: 700; }
.field select, .field input {
  width: 100%; margin-top: 4px; padding: 12px; font-size: 17px; font-family: inherit;
  border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
}

/* ----------------------------- CONFETTI ----------------------------- */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i {
  position: absolute; font-size: 26px; animation: fall linear forwards;
}
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
<!-- ============================= HOME ============================= -->
<section class="screen" id="screen-home" data-screen="home">
  <header class="hero">
    <div class="hero-badge" id="homeAvatar">🚀</div>
    <div class="hero-text">
      <h1>Chance Academy</h1>
      <p id="homeGreeting">Tap a picture to start.</p>
    </div>
    <button class="icon-btn small" id="btnGrownups" aria-label="Grown-ups area">👨‍👩‍👦</button>
  </header>

  <div class="today-card" id="todayCard" role="button" tabindex="0">
    <div class="today-icon" id="todayIcon">🌎</div>
    <div class="today-body">
      <span class="kicker">TODAY'S MISSION <b id="todayNumber">Day 1</b></span>
      <strong id="todayTitle">Loading…</strong>
      <span class="today-sub" id="todaySub">3 quick stops · about 7 minutes</span>
      <div class="dots" id="todayDots"></div>
    </div>
    <div class="today-go">▶</div>
  </div>

  <nav class="icon-grid" id="iconGrid">
    <button class="tile tile-science" data-go="station:discover">
      <span class="tile-icon">🔭</span><span class="tile-label">Science</span>
    </button>
    <button class="tile tile-math" data-go="station:numbers">
      <span class="tile-icon">🔢</span><span class="tile-label">Numbers</span>
    </button>
    <button class="tile tile-read" data-go="station:reading">
      <span class="tile-icon">📖</span><span class="tile-label">Read &amp; Say</span>
    </button>
    <button class="tile tile-map" data-go="map">
      <span class="tile-icon">🗺️</span><span class="tile-label">Mission Map</span>
    </button>
    <button class="tile tile-rewards" data-go="rewards">
      <span class="tile-icon">🏆</span><span class="tile-label">My Rewards</span>
      <span class="tile-count" id="tileStarCount">0</span>
    </button>
    <button class="tile tile-word" data-go="wordwall">
      <span class="tile-icon">🗣️</span><span class="tile-label">Word Wall</span>
    </button>
  </nav>

  <div class="goal-strip">
    <div class="goal" id="goalWeek">
      <span class="goal-icon">📅</span>
      <div><b>This week</b><i id="goalWeekText">0 of 5 days</i></div>
      <div class="bar"><span id="goalWeekBar"></span></div>
    </div>
    <div class="goal" id="goalMonth">
      <span class="goal-icon">🎖️</span>
      <div><b>This month</b><i id="goalMonthText">0 of 20 days</i></div>
      <div class="bar"><span id="goalMonthBar"></span></div>
    </div>
  </div>
</section>

<!-- ============================ MISSION =========================== -->
<section class="screen" id="screen-mission" data-screen="mission" hidden>
  <header class="bar-top">
    <button class="icon-btn" data-go="home" aria-label="Home">🏠</button>
    <div class="progress-pips" id="missionPips"></div>
    <div class="think-meter" id="thinkMeter" title="Thinking meter">
      <span class="tm-icon">🧠</span><span class="tm-fill"><i id="thinkFill"></i></span>
    </div>
    <button class="icon-btn" id="btnReplay" aria-label="Read it again">🔊</button>
  </header>

  <div class="stage" id="stage"><!-- stations render here --></div>

  <div class="coach" id="coach" hidden>
    <div class="coach-face" id="coachFace">🦉</div>
    <div class="coach-bubble"><p id="coachText"></p></div>
    <button class="icon-btn" id="coachSpeak" aria-label="Say it again">🔊</button>
  </div>
</section>

<!-- ============================== MAP ============================= -->
<section class="screen" id="screen-map" data-screen="map" hidden>
  <header class="bar-top">
    <button class="icon-btn" data-go="home" aria-label="Home">🏠</button>
    <h2>Mission Map</h2>
    <span class="spacer"></span>
  </header>
  <div class="scroll" id="mapBody"></div>
</section>

<!-- ============================ REWARDS ========================== -->
<section class="screen" id="screen-rewards" data-screen="rewards" hidden>
  <header class="bar-top">
    <button class="icon-btn" data-go="home" aria-label="Home">🏠</button>
    <h2>My Rewards</h2>
    <span class="spacer"></span>
  </header>
  <div class="scroll" id="rewardsBody"></div>
</section>

<!-- =========================== WORD WALL ========================= -->
<section class="screen" id="screen-wordwall" data-screen="wordwall" hidden>
  <header class="bar-top">
    <button class="icon-btn" data-go="home" aria-label="Home">🏠</button>
    <h2>Word Wall</h2>

/* ===== data/curriculum.js ===== */
/* ============================================================
   curriculum.js — the shape of the course, and the helpers the
   three unit files use to add days.

   60 mission days = 3 units x 4 weeks x 5 days. One day is
   5-10 minutes and always has the same three stops, because a
   predictable shape lets a 7-year-old spend his attention on the
   content instead of on figuring out the app:

     🔭 DISCOVER  a science idea, read aloud, one reasoning check
     🔢 NUMBERS   three real-world problems (time/distance/speed,
                  geometry, algebra, physics, groups-of)
     📖 READ & SAY a phonics word set he says out loud, a sentence,
                  and one comprehension question about the science

   Unit 1 opens on the solar system on purpose. That is the hook
   that worked in July summer school, so we start where his
   attention already is and pull the math and reading through it.

   ---------------------------------------------------------------
   AUTHORING NOTES (for whoever edits this next — hi, Grandpa)

   Every WRONG choice must carry a tag naming the thinking error
   that leads a kid to it. The tag is what makes the real-time
   evaluation work — see js/evaluate.js for the full list. Never
   write a throwaway wrong answer; each one should be a mistake a
   real second-grader would actually make.

     C('the right one', 1)                  <- correct choice
     C('the tempting one', 'bigger-number-bias')   <- tagged error

   `hint` is spoken on the second try. `show` is the worked
   reasoning revealed after he gets it right, so the lesson lands
   even when the answer came easily. Mark a problem multiStep:1
   when it needs two thoughts — the evaluator then treats a
   sub-second correct answer as a possible lucky guess and asks
   him to explain.
   ============================================================ */

window.Curriculum = (function () {

  var UNITS = [
    {
      n: 1, name: 'Space', em: '🚀',
      blurb: 'The solar system, the Sun and Moon, orbits and rockets.',
      weeks: [
        { n: 1,  em: '☀️', title: 'Sun, Earth and Shadows', badge: 'Sun Watcher',      phonics: 'short vowels in one-syllable words (sun, spin, rock)' },
        { n: 2,  em: '🌙', title: 'The Moon and Gravity',   badge: 'Moon Watcher',     phonics: 'magic-e long vowels (shape, side, globe)' },
        { n: 3,  em: '🪐', title: 'Planets and Orbits',     badge: 'Planet Ranger',    phonics: 'r-controlled vowels (orbit, star, Mars)' },
        { n: 4,  em: '🔭', title: 'Rockets and Telescopes', badge: 'Rocket Engineer',  phonics: 'vowel teams ee / ea (speed, deep, heat)' }
      ]
    },
    {
      n: 2, name: 'Woods & Water', em: '🦎',
      blurb: 'Salamanders, streams, fish, trees — the science of his own creek.',
      weeks: [
        { n: 5,  em: '🦎', title: 'Salamanders and Frogs',  badge: 'Salamander Scout', phonics: 'digraphs sh / ch / th (shed, hatch, moth)' },
        { n: 6,  em: '💧', title: 'Water and Streams',      badge: 'Stream Keeper',    phonics: 'endings -ing / -ed (soaking, floated)' },
        { n: 7,  em: '🎣', title: 'Fish and Food Webs',     badge: 'Angler Naturalist', phonics: 'oo / ou / ow (brook, trout, down)' },
        { n: 8,  em: '🌳', title: 'Trees, Leaves and Soil', badge: 'Forest Ranger',    phonics: 'soft c / soft g (cell, edge, ridge)' }
      ]
    },
    {
      n: 3, name: 'Forces & Machines', em: '⚙️',
      blurb: 'Push, pull, friction, levers, magnets, circuits, and building things that work.',
      weeks: [
        { n: 9,  em: '💪', title: 'Push, Pull and Friction', badge: 'Force Finder',    phonics: 'blends str / spl / scr (strong, splash, screw)' },
        { n: 10, em: '🔧', title: 'Simple Machines',         badge: 'Machine Builder', phonics: '-le and -er syllables (handle, lever, rudder)' },
        { n: 11, em: '🧲', title: 'Magnets, Light and Sound', badge: 'Energy Engineer', phonics: 'silent letters kn / wr / ph (knot, wrench, phone)' },
        { n: 12, em: '🏗️', title: 'Design and Build',        badge: 'Chief Engineer',  phonics: 'two-syllable compound words (footbridge, sunlight)' }
      ]
    }
  ];

  var days = [];   // flat, in teaching order

  /* --------------------------- helpers ---------------------------- */

  /* C('text', 1) correct  |  C('text', 'tag') tagged misconception */
  function C(t, x) {
    return x === 1 ? { t: t, correct: true } : { t: t, tag: x };
  }

  /* W('orbit', ['or','bit'], 'the path around something')

     `parts` are the SPELLING chunks he taps and decodes. How each
     chunk gets said out loud is not stored here — js/phonics.js
     owns that, keyed by the chunk itself, so "ar" is pronounced the
     same way in "far", "star" and "Mars" and only has to be right
     in one place. Do not invent phonetic spellings like 'fff' here;
     that is exactly what used to make the sound-out wrong. */
  function W(word, parts, mean) {
    return { w: word, parts: parts, mean: mean || '' };
  }

  function addDays(unitNo, list) {
    var unit = UNITS.filter(function (u) { return u.n === unitNo; })[0];
    list.forEach(function (d, i) {
      var weekIdx = Math.floor(i / 5);
      var wk = unit.weeks[weekIdx];
      var n = days.length + 1;
      days.push(Object.assign({
        id: 'd' + (n < 10 ? '0' + n : n),
        n: n,
        unit: unitNo,
        unitName: unit.name,
        week: wk.n,
        weekTitle: wk.title,
        weekEm: wk.em,
        dayOfWeek: (i % 5) + 1,
        phonicsFocus: wk.phonics
      }, d));
    });
  }

  /* --------------------------- lookups ---------------------------- */
  function allDays() { return days; }
  function day(id) { return days.filter(function (d) { return d.id === id; })[0] || null; }
  function dayByNumber(n) { return days[n - 1] || null; }
  function daysInUnit(n) { return days.filter(function (d) { return d.unit === n; }); }
  function daysInWeek(n) { return days.filter(function (d) { return d.week === n; }); }
  function units() { return UNITS; }
  function weekMeta(n) {
    for (var i = 0; i < UNITS.length; i++) {
      var w = UNITS[i].weeks.filter(function (x) { return x.n === n; })[0];
      if (w) return Object.assign({ unit: UNITS[i].n, unitName: UNITS[i].name }, w);
    }
    return null;
  }

  /* Name the weekly badge after the science he just finished, not the
     week he is about to start — so completing week 1 earns the Sun
     Watcher patch, not the Moon Watcher one. Falls back to the next
     unfinished day when nothing is done yet. */
  function weekBadgeForDate() {
    var wk = null;
    if (window.Progress) {
      var lastDone = null;
      for (var i = days.length - 1; i >= 0; i--) {
        if (Progress.isDayDone(days[i].id)) { lastDone = days[i]; break; }
      }
      var d = lastDone || Progress.nextDay();
      if (d) wk = weekMeta(d.week);
    }
    if (!wk) wk = weekMeta(1);
    return { em: wk ? wk.em : '🗓️', name: (wk ? wk.badge : 'Week') + ' Badge' };
  }

  /* Free-play picks: any day's single station, newest-unlocked first. */
  function stationPool(station) {
    return days.filter(function (d) { return d[station === 'discover' ? 'discover' : station]; });
  }

  function wordWall() {
    var out = [];
    days.forEach(function (d) {
      if (d.reading && d.reading.words) {
        d.reading.words.forEach(function (w) {
          out.push(Object.assign({ dayId: d.id, week: d.week, focus: d.phonicsFocus }, w));
        });
      }
    });
    return out;
  }

  return {
    C: C, W: W, addDays: addDays,
    allDays: allDays, day: day, dayByNumber: dayByNumber,
    daysInUnit: daysInUnit, daysInWeek: daysInWeek,
    units: units, weekMeta: weekMeta, weekBadgeForDate: weekBadgeForDate,
    stationPool: stationPool, wordWall: wordWall,
    get count() { return days.length; }
  };
})();

/* ============================================================
   phonics.js — how a letter chunk gets said out loud

   THE PROBLEM THIS FIXES
   Speech synthesis reads *words*. It cannot say an isolated
   phoneme. Feed it "fff" and you get a mess; feed it "f" and you
   get the letter name "eff"; feed it "str" and you get noise. The
   first version of this app invented spellings like "fff" and
   "rrr" and handed them to the synthesizer, so "far" came out as
   two disconnected noises instead of a blend. That was wrong.

   THE FIX
   Say it the way a reading teacher says it: name the letter, then
   anchor it in a real word the synthesizer can definitely
   pronounce.

       far  ->  "far"
                "f, like in fan"      [f highlighted]
                "ar, like in car"     [ar highlighted]
                "Now blend it: far"

   Every token in that script is a real English word, so no engine
   on any device can mangle it. It is also exactly the language he
   already hears at school.

   THE UPGRADE PATH
   A recorded human voice CAN say a true isolated phoneme, and the
   recording booth stores clips against these same chunk keys. So
   when Grandpa has recorded /f/, his /f/ plays instead of the "f,
   like in fan" script — and because the key is the letter chunk
   and not the word, recording the ~90 letter sounds once covers
   all 180 words in the course.

   Keys are the SPELLING chunks from the curriculum ("f", "ar",
   "sh", "str", "ee"), not invented phonetic spellings. Real
   syllables and whole-word chunks ("han", "bridge", "light") need
   no entry — the synthesizer already says those correctly, so
   anything not in this table is simply spoken as it is written.
   ============================================================ */

    'hook:1': { a: 'book', a2: 'look', lead: 'o o says oo' },
    'wood:1': { a: 'book', a2: 'good', lead: 'o o says oo' },
    // ow: the cow sound, not the snow sound
    'down:1': { a: 'cow', a2: 'now', lead: 'o w says ow' },
    'crowd:1': { a: 'cow', a2: 'now', lead: 'o w says ow' },
    // ou: already the ow sound, but anchor away from the word itself
    'mouth:1': { a: 'cloud', a2: 'shout', lead: 'o u says ow' },
    'south:1': { a: 'cloud', a2: 'shout', lead: 'o u says ow' },
    'trout:1': { a: 'cloud', a2: 'shout', lead: 'o u says ow' },
    // ea: the bread sound, not the eat sound
    'spread:1': { a: 'bread', a2: 'head', lead: 'e a says short e' },
    // unstressed a at the start of a word
    'apart:0': { a: 'about', a2: 'ago', lead: 'a says uh' }
  };

  function key(chunk) { return String(chunk || '').toLowerCase(); }

  function entryFor(chunk, word, index) {
    var o = OVERRIDES[String(word || '').toLowerCase() + ':' + index];
    if (o) return o;
    return CHUNKS[key(chunk)] || null;
  }

  /* Pick the anchor, avoiding the word we are currently decoding.
     "s p, like in spin" is worthless while he is reading "spin". */
  function anchorFor(e, word) {
    var w = String(word || '').toLowerCase();
    if (e.a && e.a.toLowerCase() !== w) return e.a;
    if (e.a2 && e.a2.toLowerCase() !== w) return e.a2;
    return e.a || e.a2 || '';
  }

  /* What to say for one chunk: a string made only of real words, so
     no speech engine on any device can mangle it. Chunks that are
     already pronounceable syllables are simply spoken as written. */
  function chunkPhrase(chunk, word, index) {
    var e = entryFor(chunk, word, index);
    if (!e) return String(chunk);                  // real syllable: say it
    var lead = e.lead || spellOut(chunk);
    var anchor = anchorFor(e, word);
    return anchor ? lead + ', like in ' + anchor + '.' : lead + '.';
  }

  /* Multi-letter graphemes are taught letter by letter: "a-r says ar".
     Single letters are just themselves. */
  function spellOut(chunk) {
    var c = String(chunk);
    return c.length === 1 ? c : c.split('').join(' ');
  }

  /* The full sound-out script for a word, as an ordered list of
     steps. Each step is either a recorded-clip lookup (a chunk) or
     a phrase to speak, plus which chunk to highlight.

       { chunk, index, phrase, highlight }
       { phrase, highlight: -1 }                */
  function script(word, parts) {
    var steps = [];
    steps.push({ phrase: String(word), highlight: -1, whole: true });
    (parts || []).forEach(function (p, i) {
      steps.push({
        chunk: p, index: i, highlight: i,
        phrase: chunkPhrase(p, word, i)
      });
    });
    if ((parts || []).length > 1) {
      steps.push({ phrase: 'Now blend it.', highlight: -1 });
      steps.push({ phrase: String(word), highlight: -1, whole: true });
    }
    return steps;
  }

  /* Every distinct chunk in the whole course, for the recording
     booth: record these ~90 once and every word benefits. */
  function allChunks() {
    var seen = Object.create(null), out = [];
    Curriculum.allDays().forEach(function (d) {
      d.reading.words.forEach(function (w) {
        w.parts.forEach(function (p, i) {
          var k = key(p);
          if (seen[k]) return;
          seen[k] = true;
          out.push({
            chunk: p,
            phrase: chunkPhrase(p, w.w, i),
            anchor: (entryFor(p, w.w, i) || {}).a || '',
            example: w.w
          });
        });
      });
    });
    return out.sort(function (a, b) {
      return a.chunk.length - b.chunk.length || a.chunk.localeCompare(b.chunk);
    });
  }

  /* Audit hook, used by the test suite. A chunk is "risky" if the
     synthesizer cannot be trusted to say it: a single letter, or
     any chunk with no vowel in it. Every risky chunk must have an
     anchor word, or somebody will hear "eff eff eff" again. */
  function audit() {
    var problems = [];
    Curriculum.allDays().forEach(function (d) {
      d.reading.words.forEach(function (w) {
        if (w.parts.join('').toLowerCase().replace(/-/g, '') !== w.w.toLowerCase().replace(/-/g, '')) {
          problems.push(w.w + ': chunks spell "' + w.parts.join('') + '"');
        }
        w.parts.forEach(function (p, i) {
          if (!p || !String(p).trim()) {
            problems.push(w.w + ': empty chunk at ' + i);
            return;
          }
          var e = entryFor(p, w.w, i);
          var risky = p.length === 1 || !/[aeiouy]/i.test(p);
          if (risky && !e) {
            problems.push(w.w + ': chunk "' + p + '" has no anchor word');
            return;
          }
          if (!e) return;
          // an anchor that IS the word being decoded teaches nothing
          if (anchorFor(e, w.w).toLowerCase() === w.w.toLowerCase()) {
            problems.push(w.w + ': chunk "' + p + '" anchors to the word itself — needs an a2');
          }
          // and the phrase must not contain the answer either
          var phrase = chunkPhrase(p, w.w, i).toLowerCase();
          if (p.length < w.w.length && new RegExp('\\b' + w.w.toLowerCase() + '\\b').test(phrase)) {
            problems.push(w.w + ': chunk "' + p + '" phrase gives the word away: "' + phrase + '"');
          }
        });
      });
    });
    return problems;
  }

  return {
    script: script, chunkPhrase: chunkPhrase, allChunks: allChunks,
    audit: audit, entryFor: entryFor
  };
})();


/* ===== js/recordings.js ===== */
/* ============================================================
   recordings.js — Grandpa's voice instead of the robot's

   The synthesized voice is fine as a fallback, but it is not the
   voice that matters to him. This lets a real person record any
   line in the app, in their own voice, and from then on that
   recording plays instead of the robot — everywhere that line is
   spoken.

   How it hangs together:
   - Every spoken string is keyed by a hash of its own text. Record
     "Whoa, speedy! That was faster than the question." once and it
     plays every time the owl says it, on any day, forever.
   - Clips live in IndexedDB on the device (localStorage cannot hold
     audio). A list of which keys exist is kept in memory so the
     lookup on every line is instant and never delays the lesson.
   - Anything not yet recorded falls back to the synthesized voice,
     so a half-finished recording session still works fine. You can
     record the 40 lines he hears most and stop there.
   - Export writes every clip to one file you can back up or carry
     to another iPad.

   iOS notes:
   - MediaRecorder needs iOS 14.3+ and gives us audio/mp4.
   - Audio playback needs one user gesture before it will work, so
     a single shared <audio> element is unlocked on the first tap
     and reused for every clip after that.
   ============================================================ */

window.Recordings = (function () {

  var DB_NAME = 'chance-recordings';
  var STORE = 'clips';
  var db = null;
  var known = Object.create(null);   // id -> {text, kind, size}
  var ready = false;
  var player = null;                  // one shared, unlocked <audio>
  var currentUrl = null;

  /* ------------------------- keys ------------------------- */
  function norm(s) {
    return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function hash(s) {
    var h = 2166136261, t = norm(s);
    for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h.toString(36);
  }
  /* kind separates a phoneme from a word that happens to spell the
     same thing — the "or" sound versus the word "or". */
  function keyFor(text, kind) { return (kind || 'say') + '_' + hash(text); }

  /* ----------------------- IndexedDB ---------------------- */
  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      if (!window.indexedDB) return reject(new Error('no IndexedDB'));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = function () { db = req.result; resolve(db); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function tx(mode) {
    return open().then(function (d) { return d.transaction(STORE, mode).objectStore(STORE); });
  }

  function init() {
    return tx('readonly').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.openCursor();
        req.onsuccess = function () {
          var cur = req.result;
          if (cur) {
            var v = cur.value;
            known[v.id] = { text: v.text, kind: v.kind, size: v.blob ? v.blob.size : 0, ts: v.ts };
            cur.continue();
          } else { ready = true; resolve(true); }
        };
        req.onerror = function () { ready = true; resolve(false); };
      });
    }).catch(function () { ready = true; return false; });
  }

  function save(text, kind, blob) {
    var id = keyFor(text, kind);
    var rec = { id: id, text: String(text), kind: kind || 'say', blob: blob, ts: Date.now() };
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve, reject) {
        var req = store.put(rec);
        req.onsuccess = function () {
          known[id] = { text: rec.text, kind: rec.kind, size: blob.size, ts: rec.ts };
          resolve(id);
        };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function load(id) {
    return tx('readonly').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.get(id);
        req.onsuccess = function () { resolve(req.result ? req.result.blob : null); };
        req.onerror = function () { resolve(null); };
      });
    }).catch(function () { return null; });
  }

  function remove(text, kind) {
    var id = keyFor(text, kind);
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.delete(id);
        req.onsuccess = function () { delete known[id]; resolve(true); };
        req.onerror = function () { resolve(false); };
      });
    }).catch(function () { return false; });
  }

  function clearAll() {
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.clear();
        req.onsuccess = function () { known = Object.create(null); resolve(true); };
        req.onerror = function () { resolve(false); };
      });
    }).catch(function () { return false; });
  }

  /* ---------------------- playback ------------------------ */
  /* One element, unlocked once. iOS will not let us create a new
     Audio() mid-lesson and play it without a fresh tap. */
  function unlock() {
    if (player) return;
    player = new Audio();
    player.preload = 'auto';
    // a 0.05s silent wav, just to satisfy the gesture requirement
    player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
    setTimeout(function () { try { player.pause(); player.currentTime = 0; } catch (e) {} }, 30);
  }

  function has(text, kind) { return !!known[keyFor(text, kind)]; }

  /* play() resolves true when a real recording was played, false
     when there is nothing recorded for this line (so the caller
     falls back to the synthesized voice). */
  function play(text, kind) {
    var id = keyFor(text, kind);
    if (!known[id]) return Promise.resolve(false);
    return load(id).then(function (blob) {
      if (!blob) return false;
      return new Promise(function (resolve) {
        if (!player) player = new Audio();
        if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
        currentUrl = URL.createObjectURL(blob);
        var done = false;
        function finish(v) { if (!done) { done = true; resolve(v); } }
        player.onended = function () { finish(true); };
        player.onerror = function () { finish(false); };
        player.src = currentUrl;
        var pr = player.play();
        if (pr && pr.catch) pr.catch(function () { finish(false); });
        // never let a stuck clip hang the lesson
        setTimeout(function () { finish(true); }, 30000);
      });
    });
  }

  function stop() {
    if (player) { try { player.pause(); player.currentTime = 0; } catch (e) {} }
  }

  /* ---------------------- recording ----------------------- */
  var stream = null, recorder = null, chunks = [];

  function pickMime() {
    if (!window.MediaRecorder) return null;
    var options = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < options.length; i++) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(options[i])) return options[i];
    }
    return '';
  }

  function canRecord() {
    return !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function startRecording() {
    if (!canRecord()) return Promise.reject(new Error('This browser cannot record audio.'));
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      chunks = [];
      var mime = pickMime();
      recorder = mime ? new MediaRecorder(s, { mimeType: mime }) : new MediaRecorder(s);
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.start();
      return true;
    });
  }

  /* stopRecording() resolves with the finished Blob. */
  function stopRecording() {
    return new Promise(function (resolve, reject) {
      if (!recorder) return reject(new Error('not recording'));
      recorder.onstop = function () {
        var type = recorder.mimeType || 'audio/mp4';
        var blob = new Blob(chunks, { type: type });
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
        recorder = null; chunks = [];
        resolve(blob);
      };
      try { recorder.stop(); } catch (e) { reject(e); }
    });
  }

  function isRecording() { return !!recorder; }

  function cancelRecording() {
    try { if (recorder) recorder.stop(); } catch (e) {}
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    recorder = null; chunks = [];
  }

  /* ------------------- backup / transfer ------------------ */
  function blobToBase64(blob) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onloadend = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, type) {
    var bin = atob(b64), n = bin.length, arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], { type: type || 'audio/mp4' });
  }

  function exportAll(onProgress) {
    var ids = Object.keys(known);
    var out = { app: 'chance-academy-voice', version: 1, made: new Date().toISOString(), clips: [] };
    var p = Promise.resolve();
    ids.forEach(function (id, i) {
      p = p.then(function () {
        return load(id).then(function (blob) {
          if (!blob) return;
          return blobToBase64(blob).then(function (b64) {
            out.clips.push({ id: id, text: known[id].text, kind: known[id].kind, type: blob.type, data: b64 });
            if (onProgress) onProgress(i + 1, ids.length);
          });
        });
      });
    });
    return p.then(function () { return out; });
  }

  function importAll(json) {
    if (!json || json.app !== 'chance-academy-voice' || !json.clips) {
      return Promise.reject(new Error('That is not a Chance Academy voice file.'));
    }
    var p = Promise.resolve(), n = 0;
    json.clips.forEach(function (c) {
      p = p.then(function () {
        return save(c.text, c.kind, base64ToBlob(c.data, c.type)).then(function () { n++; });
      });
    });
    return p.then(function () { return n; });
  }

  function stats() {
    var ids = Object.keys(known), bytes = 0;
    ids.forEach(function (id) { bytes += known[id].size || 0; });
    return { count: ids.length, bytes: bytes, mb: (bytes / 1048576).toFixed(1) };
  }

  /* ---------------- what there is to record ---------------- */
  /* Ordered by how often he will actually hear it, so somebody with
     twenty minutes records the lines that matter and stops. */
  function inventory() {
    var groups = [];

    // 1. the owl. Every one of these repeats across all 60 days.
    var coach = [];
    Object.keys(Evaluate.allTags()).forEach(function (t) {
      coach.push({ text: Evaluate.allTags()[t].say, kind: 'say', note: Evaluate.allTags()[t].label });
    });
    Object.keys(Evaluate.BEHAVIOR).forEach(function (b) {
      coach.push({ text: Evaluate.BEHAVIOR[b].say, kind: 'say', note: Evaluate.BEHAVIOR[b].label });
    });
    groups.push({
      id: 'coach', em: '🦉', name: 'Coach lines',
      blurb: 'What the owl says when he picks a wrong answer. These repeat on every single day — record these first.',
      lines: coach
    });

    // 2. praise and the app's own phrases
    var praise = Evaluate.praiseLines().map(function (t) { return { text: t, kind: 'say', note: 'praise' }; });
    Object.keys(Phrases).forEach(function (k) {
      if (typeof Phrases[k] === 'string') praise.push({ text: Phrases[k], kind: 'say', note: k });
    });
    groups.push({
      id: 'app', em: '⭐', name: 'Praise & app lines',
      blurb: 'Well done, station finished, mission complete. Also heard constantly.',
      lines: praise
    });

    // 3. the letter sounds. A synthesizer physically cannot say an
    //    isolated /f/; a person can. Recording each chunk once fixes
    //    the sound-out for every word in the course that uses it.
    groups.push({
      id: 'sounds', em: '🔤', name: 'Letter sounds',
      blurb: 'Say each one as a pure sound — "ffff", not "eff". Recorded once, each of these works in every word ' +
             'across all 60 days, and it is the one thing the computer voice genuinely cannot do.',
      lines: Phonics.allChunks().map(function (c) {
        return { text: c.chunk, kind: 'sound', note: 'as in "' + (c.anchor || c.example) + '"' };
      })
    });

    // 4. one group per mission day
    Curriculum.allDays().forEach(function (d) {
      var lines = [];
      d.discover.intro.forEach(function (t) { lines.push({ text: t, kind: 'say', note: 'science' }); });
      if (d.discover.word) {
        lines.push({ text: 'Big word: ' + d.discover.word.w + '. ' + d.discover.word.mean + '.', kind: 'say', note: 'big word' });
      }
      pushItem(lines, d.discover.check, 'science question');
      d.numbers.problems.forEach(function (p, i) { pushItem(lines, p, 'math ' + (i + 1)); });
      d.reading.words.forEach(function (w) {
        lines.push({ text: w.w, kind: 'say', note: 'word' });
      });
      lines.push({ text: d.reading.sentence, kind: 'say', note: 'sentence' });
      pushItem(lines, d.reading.comp, 'comprehension');
      groups.push({
        id: d.id, em: d.icon, name: 'Day ' + d.n + ': ' + d.title,
        blurb: d.unitName + ' · ' + d.weekTitle, lines: lines, day: true
      });
    });
    return groups;
  }

  function pushItem(lines, item, note) {
    if (!item) return;
    if (item.story) lines.push({ text: item.story, kind: 'say', note: note + ' story' });
    lines.push({ text: item.q, kind: 'say', note: note + ' question' });
    item.choices.forEach(function (c, i) {
      lines.push({ text: (i + 1) + '. ' + c.t, kind: 'say', note: note + ' choice' });
    });
    if (item.hint) lines.push({ text: item.hint, kind: 'say', note: note + ' hint' });
    if (item.show) lines.push({ text: item.show, kind: 'say', note: note + ' answer' });
  }

  function groupProgress(group) {
    var done = group.lines.filter(function (l) { return has(l.text, l.kind); }).length;
    return { done: done, total: group.lines.length, pct: Math.round(100 * done / (group.lines.length || 1)) };
  }

  init();

  return {
    isReady: function () { return ready; },
    has: has, play: play, stop: stop, unlock: unlock,
    save: save, remove: remove, clearAll: clearAll,
    canRecord: canRecord, startRecording: startRecording, stopRecording: stopRecording,
    isRecording: isRecording, cancelRecording: cancelRecording,
    exportAll: exportAll, importAll: importAll, stats: stats,
    inventory: inventory, groupProgress: groupProgress, keyFor: keyFor
  };
})();

/* Every fixed phrase the app speaks, in one place, so the recording
   studio can list exactly the strings the code will later look up.
   If these two ever drift apart you record a line that never plays,
   so they are defined here and referenced everywhere else. */
window.Phrases = {
  stationDone: 'Station complete. You earned a star.',
  missionDone: 'Mission complete! Fantastic work today.',
  tapTheAnswer: 'Here is the answer. Tap it with me, and say it out loud.',
  micOff: "I didn't hear you. Hold the microphone button and say it out loud."
};


/* ===== js/voice.js ===== */
/* ============================================================
   voice.js — Chance Academy speech layer

   Two jobs:
   1) SPEAK. Everything on screen can be read aloud in a soft
      female voice, slowed down for a 7-year-old, so reading is
      never the thing that blocks him from doing the science.
   2) LISTEN. In the Read & Say station he says the word out
      loud; we compare what the microphone heard against the
      target word and coach the sounds he missed.

   iOS notes (this app lives on an iPad):
   - getVoices() is empty until the engine warms up, so we wait
     on the voiceschanged event and re-resolve.
   - Speech will not start until the user has tapped once, so
     app.js calls Voice.unlock() on the first touch.
   - Safari's recognition is webkitSpeechRecognition and needs
     mic permission once per site. If it is missing or refused,
     the reading station falls back to "listen, then tap the
     sounds you said" so nothing is a dead end.
   ============================================================ */

window.Voice = (function () {
  var synth = window.speechSynthesis || null;
  var voices = [];
  var chosen = null;
  var unlocked = false;
  var muted = false;
  var queueTail = Promise.resolve();

  /* Soft, warm, female, in rough order of preference. First list is
     Apple (iPad / Mac), then Google, then Microsoft. */
  var PREFERRED = [
    'Samantha', 'Ava', 'Allison', 'Susan', 'Nicky', 'Karen', 'Moira',
    'Tessa', 'Fiona', 'Serena', 'Victoria', 'Kate',
    'Google UK English Female', 'Google US English',
    'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Michelle'
  ];

  var settings = {
    rate: 0.82,   // slower than default; he is 7 and decoding as he listens
    pitch: 1.12,  // a touch higher reads as gentler
    volume: 1,
    voiceName: null // grown-ups can pin a specific voice in settings
  };

  function loadSettings() {
    try {
      var raw = localStorage.getItem('chance.voice');
      if (raw) Object.assign(settings, JSON.parse(raw));
    } catch (e) {}
  }
  function saveSettings() {
    try { localStorage.setItem('chance.voice', JSON.stringify(settings)); } catch (e) {}
  }

  function score(v) {
    var n = (v.name || '');
    var idx = PREFERRED.findIndex(function (p) { return n.indexOf(p) === 0 || n === p; });
    var s = idx === -1 ? 500 : idx;
    if (!/^en/i.test(v.lang || '')) s += 1000;          // English only
    if (/compact|eloquence/i.test(n)) s += 60;          // the tinny fallback voices
    if (/\b(male|Daniel|Alex|Fred|Aaron|Arthur|Oliver|Rishi|Tom|Guy)\b/i.test(n)) s += 400;
    return s;
  }

  function resolveVoice() {
    if (!synth) return null;
    voices = synth.getVoices() || [];
    if (!voices.length) return null;
    if (settings.voiceName) {
      var pinned = voices.filter(function (v) { return v.name === settings.voiceName; })[0];
      if (pinned) { chosen = pinned; return chosen; }
    }
    chosen = voices.slice().sort(function (a, b) { return score(a) - score(b); })[0] || null;
    return chosen;
  }

  if (synth) {
    resolveVoice();
    synth.addEventListener && synth.addEventListener('voiceschanged', resolveVoice);
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = resolveVoice;
  }
  loadSettings();

  /* One silent utterance on the first tap buys us the right to
     speak later without a gesture. */
  function unlock() {
    if (unlocked || !synth) return;
    unlocked = true;
    resolveVoice();
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 2;
      synth.speak(u);

     opts.rate / opts.pitch override for one phrase (used to stretch
     single phonemes out). Calls queue rather than interrupt so a
     three-sentence lesson reads in order.

     somebody has recorded this exact line in the studio, we play
     their voice; otherwise we fall back to speech synthesis. That
     is what lets a half-finished recording session still work. */
  function say(text, opts) {
    opts = opts || {};
    if (!text) return Promise.resolve();
    if (muted) return Promise.resolve();
    if (opts.interrupt) stop();

    queueTail = queueTail.then(function () {
      var kind = opts.kind || 'say';
      if (window.Recordings && Recordings.has(text, kind)) {
        return Recordings.play(text, kind).then(function (played) {
          if (!played) return speak(text, opts);
        });
      }
      return speak(text, opts);
    });
    return queueTail;
  }

  /* the synthesized fallback */
  function speak(text, opts) {
    if (!synth) return Promise.resolve();
    return new Promise(function (done) {
      if (!chosen) resolveVoice();
      var u = new SpeechSynthesisUtterance(String(text));
      if (chosen) { u.voice = chosen; u.lang = chosen.lang || 'en-US'; }
      else u.lang = 'en-US';
      u.rate = opts.rate != null ? opts.rate : settings.rate;
      u.pitch = opts.pitch != null ? opts.pitch : settings.pitch;
      u.volume = opts.volume != null ? opts.volume : settings.volume;
      var finished = false;
      function finish() { if (!finished) { finished = true; done(); } }
      u.onend = finish;
      u.onerror = finish;
      // Safety net: if the engine silently drops an utterance we keep moving.
      setTimeout(finish, Math.min(20000, 1400 + String(text).length * 95));
      try { synth.speak(u); } catch (e) { finish(); }
    });

  /* Read a list of lines with a beat between them, calling back
     before each one so the UI can highlight what is being said. */
  function sayLines(lines, onLine) {
    var p = Promise.resolve();

  /* Kept for the recording booth, which needs to preview the clip
     for one chunk on its own. */
  function sayPhoneme(sound) {

  }

  /* Sound out a word the way a reading teacher does: the whole word,
     each chunk anchored in a real word, then the blend.
     onStep(highlightIndex) lets the UI light the chunk being said. */
  function soundOut(word, parts, onStep) {

      ? Phonics.script(word, parts)

    steps.forEach(function (st) {
      p = p.then(function () {
        if (onStep) onStep(st.highlight);
        if (st.chunk != null) return sayChunk(st.chunk, word, st.index);
        return say(st.phrase, { rate: st.whole ? 0.75 : 0.85 });
      }).then(function () { return pause(180); });
    });
    return p.then(function () { if (onStep) onStep(-1); });
  }

  /* --------------------------- LISTENING --------------------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var rec = null, recBusy = false;

  function canListen() { return !!SR; }

  /* listen() -> Promise<{transcript, ok:boolean, reason}>  */
  function listen(opts) {
    opts = opts || {};
    if (!SR) return Promise.resolve({ transcript: '', ok: false, reason: 'unsupported' });
    if (recBusy) return Promise.resolve({ transcript: '', ok: false, reason: 'busy' });

    return new Promise(function (resolve) {
      recBusy = true;
      var settled = false;
      var best = '';
      try { rec = new SR(); } catch (e) { recBusy = false; return resolve({ transcript: '', ok: false, reason: 'unsupported' }); }
      rec.lang = 'en-US';
      rec.continuous = false;
      rec.interimResults = true;
      rec.maxAlternatives = 5;
      var alts = [];

      function finish(reason) {
        if (settled) return;
        settled = true; recBusy = false;
        try { rec.stop(); } catch (e) {}
        resolve({ transcript: best.trim(), alternatives: alts, ok: !!best.trim(), reason: reason || 'ok' });
      }

      rec.onresult = function (ev) {
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var r = ev.results[i];
          for (var j = 0; j < r.length; j++) {
            if (r[j].transcript) alts.push(r[j].transcript);
          }
          if (r[0] && r[0].transcript) best = r[0].transcript;
          if (opts.onInterim) opts.onInterim(best);
          if (r.isFinal) return finish('ok');
        }
      };
      rec.onerror = function (ev) {
        finish(ev && ev.error === 'not-allowed' ? 'denied' : 'error');
      };
      rec.onend = function () { finish('ok'); };
      try { rec.start(); } catch (e) { finish('error'); }
      setTimeout(function () { finish('timeout'); }, opts.ms || 6000);
    });
  }

  function abortListen() {
    if (rec) { try { rec.abort(); } catch (e) {} }
    recBusy = false;
  }

  /* ----------------------- PRONUNCIATION MATCH --------------------- */
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function lev(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[n];
  }

  /* Homophone-ish forgiveness: the recogniser often returns a common
     word that sounds like the target ("son" for "sun"). Reading the
     word correctly out loud is the goal, not spelling it. */
  var SOUNDALIKE = {
    sun: ['son'], son: ['sun'], to: ['two', 'too'], two: ['to', 'too'],
    for: ['four', 'fore'], four: ['for'], one: ['won'], won: ['one'],
    ate: ['eight'], eight: ['ate'], be: ['bee'], bee: ['be'],
    see: ['sea'], sea: ['see'], by: ['buy', 'bye'], red: ['read'],
    hour: ['our'], our: ['hour'], knew: ['new'], new: ['knew'],
    weight: ['wait'], wait: ['weight'], ate2: []
  };

  /* heard vs target -> 0..1 confidence that he said the word. */
  function match(target, heard, alternatives) {
    var t = norm(target);
    var pool = [heard].concat(alternatives || []).map(norm).filter(Boolean);
    if (!pool.length) return 0;
    var best = 0;
    pool.forEach(function (h) {
      // The recogniser often returns a whole phrase; check each word too.
      var candidates = [h].concat(h.split(' '));
      candidates.forEach(function (c) {
        if (!c) return;
        var s;
        if (c === t) s = 1;
        else if ((SOUNDALIKE[t] || []).indexOf(c) !== -1) s = 0.95;
        else {
          var d = lev(c, t);
          s = 1 - d / Math.max(c.length, t.length);
          if (c.length > 2 && t.indexOf(c) === 0) s = Math.max(s, 0.7); // said the first part
        }
        if (s > best) best = s;
      });
    });
    return best;
  }

  return {
    say: say, sayLines: sayLines, sayPhoneme: sayPhoneme, sayChunk: sayChunk, soundOut: soundOut,
    stop: stop, unlock: unlock, pause: pause,
    listen: listen, abortListen: abortListen, canListen: canListen, match: match, norm: norm,
    get settings() { return settings; },
    setMuted: function (m) { muted = !!m; if (muted) stop(); },
    isMuted: function () { return muted; },
    update: function (patch) { Object.assign(settings, patch || {}); saveSettings(); resolveVoice(); },
    listVoices: function () { resolveVoice(); return voices.filter(function (v) { return /^en/i.test(v.lang || ''); }); },
    currentVoiceName: function () { return chosen ? chosen.name : 'device default'; },
    available: function () { return !!synth; }
  };
})();


/* ===== js/evaluate.js ===== */
/* ============================================================
   evaluate.js — the real-time reasoning evaluator

   A normal quiz app knows one thing: right or wrong. That is not
   useful for a 7-year-old, because *why* he picked an answer is
   the whole story. "12" can be a careful answer or a tap.

   So every wrong choice in the curriculum data carries a TAG: the
   specific thinking error that leads to that choice. The evaluator
   watches the tags, plus how long he took and how many tries, and
   reacts inside the same second:

     - it speaks a coaching line aimed at that exact error
       (not "wrong", not "try again")
     - it drops a live signal into the Thinking Meter at the top
     - it logs the event so the grown-up report can say
       "he is sound on multiplication, but bigger-number-bias
       showed up 6 times in speed problems this week"

   Behaviour signals it also catches, which no answer key can:
     fast-guess     answered faster than the question can be read
     hesitation     long freeze — the item is above his level today
     thrash         three tries on one item, needs the scaffold
     repeat-tag     the same thinking error twice in one sitting
   ============================================================ */

window.Evaluate = (function () {

  /* ---------------- the thinking-error dictionary ----------------
     say   : spoken to Chance immediately, in his language
     label : what the grown-up report calls it
     fix   : what to practice, for the report
     Tags are shared across science, math and reading on purpose —
     the same habit shows up in all three, and seeing that is the
     point of the report. */
  var TAGS = {
    'bigger-number-bias': {
      label: 'Picks the bigger number',
      say: "You grabbed the biggest number. Big numbers aren't always the answer. What is the question really asking?",
      fix: 'Ask "what is being counted?" out loud before choosing.'
    },
    'additive-for-multiplicative': {
      label: 'Adds when it should be groups-of',
      say: "That looks like adding. This one is groups. How many groups, and how many in each group?",
      fix: 'Draw the groups as circles with dots before answering.'
    },
    'unit-mixup': {
      label: 'Mixes up the units',
      say: "Check the words next to the number. Minutes and hours are not the same size, and neither are feet and miles.",
      fix: 'Read the unit out loud with every number.'
    },
    'reversed-relation': {
      label: 'Flips the relationship backwards',
      say: "You turned it around. Going faster means the trip takes LESS time, not more. Say it out loud both ways.",
      fix: 'Practice "faster means less time" with two real trips.'
    },
    'surface-feature': {
      label: 'Matches a word instead of the meaning',
      say: "That answer copies a word from the question, but it doesn't answer it. What is the question actually asking?",
      fix: 'Cover the choices, answer in your own words first, then look.'
    },
    'literal-appearance': {
      label: 'Trusts how it looks over how it works',
      say: "That's how it LOOKS. Scientists ask what is really happening. What is really going on here?",
      fix: 'Name the appearance and the reality separately.'
    },
    'ignored-condition': {
      label: 'Skips a detail in the story',
      say: "There's a clue in the story you flew past. Let's read it again and hunt for the number you missed.",
      fix: 'Underline every number and every "each/every/both" in the story.'
    },
    'off-by-one': {
      label: 'Off by one',
      say: "So close! You're one away. Count it again slowly, with your finger.",
      fix: 'Count aloud and touch each item once.'
    },
    'part-whole-mixup': {
      label: 'Confuses the part with the whole',
      say: "Careful — is that the whole thing, or just one piece of it?",
      fix: 'Say "whole" and "part" out loud before choosing.'
    },
    'perimeter-area-mixup': {
      label: 'Confuses around-the-edge with inside',
      say: "Are we walking around the outside, or covering the inside? Those are two different jobs.",
      fix: 'Trace the edge with a finger, then tap the inside squares.'
    },
    'shape-orientation': {
      label: 'Thinks a turned shape is a new shape',
      say: "Turning a shape doesn't change what it is. A square tipped on its corner is still a square.",
      fix: 'Rotate a cut-out shape by hand and re-name it each turn.'
    },
    'sequence-error': {
      label: 'Gets the order of steps wrong',
      say: "Right pieces, wrong order. What has to happen FIRST?",
      fix: 'Number the steps 1-2-3 before answering.'
    },
    'animism': {
      label: 'Gives objects wants and feelings',
      say: "Rocks and planets don't want anything — they just follow rules. What rule is making this happen?",
      fix: 'Replace "it wants to" with "the force that pushes it is…"'
    },
    'overgeneralize': {
      label: 'Uses a rule where it does not apply',
      say: "That rule works sometimes, but not here. What is different about this one?",
      fix: 'Hunt for the exception on purpose.'
    },
    'guess-plausible': {
      label: 'Picks the sensible-sounding answer without checking',
      say: "That sounds right, but let's prove it. Show me the numbers you used.",
      fix: 'Say the calculation out loud before tapping.'
    },
    'letter-look': {
      label: 'Reads by the shape of the word',
      say: "That word starts the same, but look at the middle sounds. Let's sound the whole word out.",
      fix: 'Touch each sound chunk while saying it.'
    },
    'vowel-swap': {
      label: 'Swaps the vowel sound',
      say: "Check the vowel in the middle. That one little letter changes the whole word.",
      fix: 'Short-vowel drill with the five vowel cards.'
    }
  };

  var BEHAVIOR = {
    'fast-guess': {
      label: 'Answered before reading',
      say: "Whoa, speedy! That was faster than the question. Read it with me once, then choose.",
      fix: 'Require him to say the question back before answering.'
    },
    'hesitation': {
      label: 'Long freeze',
      say: "This one's tricky. Want me to read it again? There's no clock here.",
      fix: 'This item is above his level today — scaffold it or come back later.'
    },
    'thrash': {
      label: 'Three tries on one item',
      say: "Let's take two answers off the board and think about the two that are left.",
      fix: 'Break the problem into two smaller questions.'
    },
    'repeat-tag': {
      label: 'Same thinking error twice in one sitting',
      say: "That's the same trap as before! Remember what we said? Let's use it.",
      fix: 'Do a 2-minute drill on this habit before the next mission.'
    }
  };

  var PRAISE = [
    "Yes! That's exactly the reasoning.",
    "Nailed it. You used the numbers, not a guess.",
    "That's it. Good, careful thinking.",
    "Correct — and you found it on the first try.",
    "Right! You caught the important detail."
  ];
  var PRAISE_RECOVER = [
    "There it is. You fixed it yourself — that's what scientists do.",
    "Yes! Second look, better answer.",
    "That's the one. Slowing down worked."
  ];

  /* thresholds, in milliseconds */
  var FAST_MS = 1900;      // faster than a 7-year-old can read the question
  var SLOW_MS = 32000;     // frozen

  var session = null;

  function startSession(dayId) {
    session = {
      dayId: dayId,
      started: Date.now(),
      events: [],
      tagCounts: {},
      firstTry: 0,
      items: 0,
      focus: 72          // drives the Thinking Meter, 0..100
    };
    return session;
  }

  function currentSession() { return session; }

  /* ---------------------------------------------------------------
     judge() is called the instant a choice is tapped.
     Returns everything the UI needs to react:
       { correct, speak, tone, flags, focus, reveal, eliminate }
     --------------------------------------------------------------- */
  function judge(o) {
    // o: {itemId, station, domain, choice, attempt, ms, item}
    if (!session) startSession(o.dayId || 'free');
    var correct = !!o.choice.correct;
    var tag = o.choice.tag || null;
    var flags = [];
    var speak = '';
    var tone = correct ? 'good' : 'coach';
    var reveal = false, eliminate = false;

    if (o.attempt === 1) session.items++;

    /* --- behaviour first: how he answered matters as much as what --- */
    if (!correct && o.ms < FAST_MS) flags.push('fast-guess');
    if (correct && o.ms < 900 && (o.item && o.item.multiStep)) flags.push('lucky-fast');
    if (o.ms > SLOW_MS) flags.push('hesitation');
    if (!correct && o.attempt >= 3) { flags.push('thrash'); eliminate = true; }

    /* --- the specific thinking error --- */
    if (tag) {
      session.tagCounts[tag] = (session.tagCounts[tag] || 0) + 1;
      if (session.tagCounts[tag] >= 2) flags.push('repeat-tag');
    }

    /* --- what the owl says, most specific message wins --- */
    if (correct) {
      speak = o.attempt === 1 ? pick(PRAISE) : pick(PRAISE_RECOVER);
      if (o.attempt === 1) session.firstTry++;
      session.focus = clamp(session.focus + (o.attempt === 1 ? 8 : 4));
      if (flags.indexOf('lucky-fast') !== -1) {
        speak += " Tell me how you got it?";
      }
    } else if (flags.indexOf('fast-guess') !== -1) {
      speak = BEHAVIOR['fast-guess'].say;
      tone = 'slow-down';
      session.focus = clamp(session.focus - 16);
    } else if (flags.indexOf('repeat-tag') !== -1 && tag) {
      speak = BEHAVIOR['repeat-tag'].say + ' ' + TAGS[tag].say;
      tone = 'pattern';
      session.focus = clamp(session.focus - 10);
    } else if (tag && TAGS[tag]) {
      speak = TAGS[tag].say;
      session.focus = clamp(session.focus - 7);
    } else {
      speak = "Not that one. Read it with me one more time.";
      session.focus = clamp(session.focus - 6);
    }

    if (!correct && o.attempt >= 3) {
      reveal = true;
      speak = "Let's do this one together. " + (o.item && o.item.hint ? o.item.hint : '');
    } else if (!correct && o.item && o.item.hint && o.attempt === 2) {
      speak += ' ' + o.item.hint;
    }

    if (flags.indexOf('hesitation') !== -1 && !correct) {
      speak = BEHAVIOR.hesitation.say + ' ' + speak;
    }

    var ev = {
      t: Date.now(), dayId: session.dayId, itemId: o.itemId, station: o.station,
      domain: o.domain || o.station, correct: correct, tag: tag,
      attempt: o.attempt, ms: o.ms, flags: flags
    };
    session.events.push(ev);
    if (window.Progress) Progress.logEvent(ev);

    return {
      correct: correct, speak: speak, tone: tone, flags: flags,
      focus: session.focus, reveal: reveal, eliminate: eliminate,
      tag: tag, tagLabel: tag && TAGS[tag] ? TAGS[tag].label : null
    };
  }

  /* Reading station: judge a spoken word instead of a tap. */
  function judgeSpoken(o) {
    // o: {word, parts, confidence, attempt, heard, itemId}
    var c = o.confidence;
    var ok = c >= 0.72;
    var close = !ok && c >= 0.45;
    var speak, tone = ok ? 'good' : 'coach', flags = [];

    if (ok) {
      speak = c >= 0.95
        ? 'That is exactly right. ' + o.word + '.'
        : 'Yes — ' + o.word + '. You got it.';
    } else if (close) {
      speak = 'Close! I heard something like that. Listen to the sounds again.';
      flags.push('letter-look');
    } else if (!o.heard) {
      speak = Phrases.micOff;
      tone = 'retry';
    } else {
      speak = 'I heard "' + o.heard + '". The word is ' + o.word + '. Let me break it up for you.';
      flags.push('vowel-swap');
    }

    var ev = {
      t: Date.now(), dayId: session ? session.dayId : 'free', itemId: o.itemId,
      station: 'reading', domain: 'phonics', correct: ok,
      tag: ok ? null : (close ? 'letter-look' : 'vowel-swap'),
      attempt: o.attempt, ms: o.ms || 0, flags: flags, heard: o.heard || ''
    };
    if (session) {
      session.events.push(ev);
      session.items += o.attempt === 1 ? 1 : 0;
      if (ok && o.attempt === 1) session.firstTry++;
      session.focus = clamp(session.focus + (ok ? 6 : -5));
    }
    if (window.Progress) Progress.logEvent(ev);

    return { correct: ok, close: close, speak: speak, tone: tone, focus: session ? session.focus : 70 };
  }

  /* --------------------- session-level read-out --------------------- */
  function sessionSummary() {
    if (!session) return null;
    var s = session;
    var times = s.events.filter(function (e) { return e.attempt === 1 && e.ms; }).map(function (e) { return e.ms; });
    var topTag = Object.keys(s.tagCounts).sort(function (a, b) { return s.tagCounts[b] - s.tagCounts[a]; })[0] || null;
    return {
      dayId: s.dayId,
      items: s.items,
      firstTry: s.firstTry,
      firstTryPct: s.items ? Math.round(100 * s.firstTry / s.items) : 0,
      medianMs: median(times),
      focus: s.focus,
      topTag: topTag,
      topTagLabel: topTag ? TAGS[topTag].label : null,
      topTagCount: topTag ? s.tagCounts[topTag] : 0,
      cleanRun: s.items > 0 && s.firstTry === s.items,
      events: s.events.slice()
    };
  }

  function tagInfo(tag) { return TAGS[tag] || BEHAVIOR[tag] || null; }
  function allTags() { return TAGS; }

  function clamp(n) { return Math.max(5, Math.min(100, Math.round(n))); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function median(a) {
    if (!a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
  }

  return {
    startSession: startSession, currentSession: currentSession,
    judge: judge, judgeSpoken: judgeSpoken, sessionSummary: sessionSummary,
    tagInfo: tagInfo, allTags: allTags, BEHAVIOR: BEHAVIOR,
    // the recording studio lists these so they can be said in a real voice
    praiseLines: function () { return PRAISE.concat(PRAISE_RECOVER); }
  };
})();


/* ===== js/progress.js ===== */
/* ============================================================
   progress.js — stars, streaks, weekly and monthly goals, badges

   Everything lives in localStorage on the iPad, so there is no
   account to make and no data leaving the device. The grown-up
   report reads from the same log the evaluator writes to.

   Reward shape (deliberately simple enough for a 7-year-old to
   hold in his head):
     ⭐ one star per station finished          -> 3 a day
     💎 a gem when every answer was first-try  -> "clean run"
     🗓️ weekly badge at 5 finished days in a calendar week
     🎖️ monthly patch at 20 finished days in a calendar month
     plus milestone badges for streaks and totals
   ============================================================ */

window.Progress = (function () {
  var KEY = 'chance.progress.v1';
  var LOG_CAP = 2000;

  var data = {
    name: 'Chance',
    days: {},        // dayId -> { done, stars, gem, date, firstTryPct }
    stations: {},    // dayId:station -> true
    log: [],         // evaluator events
    badges: {},      // badgeId -> ISO date earned
    streak: { count: 0, best: 0, last: null },
    totals: { stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        data = Object.assign(data, parsed);
        data.totals = Object.assign({ stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }, parsed.totals || {});
        data.streak = Object.assign({ count: 0, best: 0, last: null }, parsed.streak || {});
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  load();

  /* ------------------------------ dates ---------------------------- */
  function today() { return iso(new Date()); }
  function iso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  /* Monday-start week key, e.g. 2026-W32 */
  function weekKey(d) {
    d = d || new Date();
