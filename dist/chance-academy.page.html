  function photo(id) { return get(PHOTOS, id); }
  function removePhoto(packObj, photoId) {
    packObj.photoIds = (packObj.photoIds || []).filter(function (x) { return x !== photoId; });
    return del(PHOTOS, photoId).then(function () { return savePack(packObj); });
  }

  /* ------------------- turning input into items ---------------- */

  /* Parse "7 x 8", "7*8", "24 ÷ 3", "15-8", "9 + 6". Returns the
     numbers and operator, or null if it is not a simple problem. */
  function parseMath(text) {
    var t = String(text || '').trim().replace(/[=?]+$/, '').trim();
    var m = /^(\d{1,4})\s*([x×*·+\-−/÷])\s*(\d{1,4})$/i.exec(t);
    if (!m) return null;
    var a = parseInt(m[1], 10), b = parseInt(m[3], 10);
    var opRaw = m[2];
    var op = /[x×*·]/i.test(opRaw) ? '×' : (opRaw === '+' ? '+' : (/[-−]/.test(opRaw) ? '−' : '÷'));
    if (op === '÷' && (b === 0 || a % b !== 0)) return null;   // keep it whole-number
    if (op === '−' && b > a) return null;                      // no negatives at seven
    return { a: a, b: b, op: op };
  }

  /* Build a full question from a parsed problem. Every wrong answer
     carries the tag of the mistake that produces it, so the live
     coaching and the Thinking Report keep working exactly as they
     do for the built-in curriculum. */
  function mathItem(p) {
    var a = p.a, b = p.b, op = p.op, correct, wrong = [];

    if (op === '×') {
      correct = a * b;
      wrong.push([a + b, 'additive-for-multiplicative']);
      wrong.push([a * b - a, 'off-by-one']);            // skip-counted one group short
      wrong.push([a * (b + 1), 'bigger-number-bias']);
    } else if (op === '+') {
      correct = a + b;
      wrong.push([Math.abs(a - b), 'reversed-relation']);  // did the opposite operation
      wrong.push([a + b + 1, 'off-by-one']);
      wrong.push([a * b, 'bigger-number-bias']);
    } else if (op === '−') {
      correct = a - b;
      wrong.push([a + b, 'reversed-relation']);
      wrong.push([a - b + 1, 'off-by-one']);
      wrong.push([b, 'surface-feature']);                  // copied a number from the question
    } else {
      correct = a / b;
      wrong.push([a - b, 'reversed-relation']);
      wrong.push([a * b, 'bigger-number-bias']);
      wrong.push([a / b + 1, 'off-by-one']);
    }

    // no duplicates, nothing negative, nothing equal to the answer
    var seen = { }, choices = [{ t: String(correct), correct: true }];
    seen[correct] = true;
    wrong.forEach(function (w) {
      var v = w[0];
      if (v == null || isNaN(v) || v < 0 || seen[v]) return;
      seen[v] = true;
      choices.push({ t: String(v), tag: w[1] });
    });
    // a question needs at least one distractor to be worth asking
    var pad = 1;
    while (choices.length < 3) {
      var v = correct + pad;
      if (!seen[v]) { seen[v] = true; choices.push({ t: String(v), tag: 'off-by-one' }); }
      pad++;
      if (pad > 12) break;
    }

    var names = { '×': 'times', '+': 'plus', '−': 'minus', '÷': 'divided by' };
    return {
      id: newId('it'),
      kind: 'math',
      source: a + ' ' + op + ' ' + b,
      q: 'What is ' + a + ' ' + op + ' ' + b + '?',
      spoken: 'What is ' + a + ' ' + names[op] + ' ' + b + '?',
      choices: choices,
      hint: hintFor(op, a, b),
      show: a + ' ' + op + ' ' + b + ' = ' + correct + '.'
    };
  }

  function hintFor(op, a, b) {
    if (op === '×') return 'Think of ' + b + ' groups with ' + a + ' in each group. Count them up.';
    if (op === '+') return 'Start at ' + a + ' and count on ' + b + ' more.';
    if (op === '−') return 'Start at ' + a + ' and count back ' + b + '.';
    return 'How many ' + b + 's fit inside ' + a + '?';
  }

  /* A spelling word becomes a Read & Say item: he sees the chunks,
     hears them anchored, and says the word into the microphone.
     Hyphens let a grown-up force the split: "sh-ad-ow". */
  function wordItem(text) {
    var raw = String(text || '').trim();
    if (!raw) return null;
    var word, parts;
    if (raw.indexOf('-') !== -1) {
      parts = raw.split('-').map(function (s) { return s.trim(); }).filter(Boolean);
      word = parts.join('');
    } else {
      word = raw.replace(/\s+/g, '');
      parts = window.Phonics && Phonics.split ? Phonics.split(word) : [word];
    }
    if (!word) return null;
    return { id: newId('it'), kind: 'word', word: word, parts: parts };
  }

  /* A free-form question typed by a grown-up. Wrong answers are
     optional; with none it becomes a say-it-out-loud prompt. */
  function askItem(q, right, wrongs) {
    var choices = [{ t: String(right), correct: true }];
    (wrongs || []).forEach(function (w) {
      if (w && String(w).trim()) choices.push({ t: String(w).trim(), tag: 'guess-plausible' });
    });
    return {
      id: newId('it'), kind: 'ask', q: String(q),
      choices: choices,
      hint: 'Read the question again slowly.',
      show: 'The answer is ' + right + '.'
    };
  }

  function addItem(packObj, item) {
    if (!item) return Promise.resolve(null);
    packObj.items = (packObj.items || []).concat(item);
    return savePack(packObj).then(function () { return item; });
  }
  function removeItem(packObj, itemId) {
    packObj.items = (packObj.items || []).filter(function (x) { return x.id !== itemId; });
    return savePack(packObj);
  }

  /* Accepts a whole list at once: "7x8, 6x7, 24/3" or one per line. */
  function addMany(packObj, text) {
    var lines = String(text || '').split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var made = [], skipped = [];
    lines.forEach(function (line) {
      var p = parseMath(line);
      if (p) made.push(mathItem(p));
      else skipped.push(line);
    });
    packObj.items = (packObj.items || []).concat(made);
    return savePack(packObj).then(function () { return { made: made, skipped: skipped }; });
  }

  function stats() {
    var items = 0, photos = 0;
    cache.forEach(function (p) { items += (p.items || []).length; photos += (p.photoIds || []).length; });
    return { packs: cache.length, items: items, photos: photos };
  }

  init();

  return {
    isReady: isReady, init: init, packs: packs, pack: pack,
    createPack: createPack, savePack: savePack, deletePack: deletePack,
    addPhoto: addPhoto, photo: photo, removePhoto: removePhoto,
    parseMath: parseMath, mathItem: mathItem, wordItem: wordItem, askItem: askItem,
    addItem: addItem, removeItem: removeItem, addMany: addMany,
    stats: stats, defaultTitle: defaultTitle
  };
})();


/* ===== js/recordings.js ===== */
/* ============================================================
   recordings.js — Grandpa's voice instead of the robot's

   The synthesized voice is fine as a fallback, but it is not the
   voice that matters to him. This lets a real person record any
   line in the app, in their own voice, and from then on that
   recording plays instead of the robot — everywhere that line is
   spoken.

   How it hangs together:
   - Every spoken string is keyed by a hash of its own text. Record
     "Whoa, speedy! That was faster than the question." once and it
     plays every time the owl says it, on any day, forever.
   - Clips live in IndexedDB on the device (localStorage cannot hold
     audio). A list of which keys exist is kept in memory so the
     lookup on every line is instant and never delays the lesson.
   - Anything not yet recorded falls back to the synthesized voice,
     so a half-finished recording session still works fine. You can
     record the 40 lines he hears most and stop there.
   - Export writes every clip to one file you can back up or carry
     to another iPad.

   iOS notes:
   - MediaRecorder needs iOS 14.3+ and gives us audio/mp4.
   - Audio playback needs one user gesture before it will work, so
     a single shared <audio> element is unlocked on the first tap
     and reused for every clip after that.
   ============================================================ */

window.Recordings = (function () {

  var DB_NAME = 'chance-recordings';
  var STORE = 'clips';
  var db = null;
  var known = Object.create(null);   // id -> {text, kind, size}
  var ready = false;
  var player = null;                  // one shared, unlocked <audio>
  var currentUrl = null;

  /* ------------------------- keys ------------------------- */
  function norm(s) {
    return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function hash(s) {
    var h = 2166136261, t = norm(s);
    for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h.toString(36);
  }
  /* kind separates a phoneme from a word that happens to spell the
     same thing — the "or" sound versus the word "or". */
  function keyFor(text, kind) { return (kind || 'say') + '_' + hash(text); }

  /* ----------------------- IndexedDB ---------------------- */
  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      if (!window.indexedDB) return reject(new Error('no IndexedDB'));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = function () {
        db = req.result;
        // iOS closes IndexedDB connections while a home-screen app is
        // in the background; forget it so the next call reconnects
        db.onclose = function () { db = null; };
        db.onversionchange = function () { try { db.close(); } catch (e) {} db = null; };
        resolve(db);
      };
      req.onerror = function () { reject(req.error); };
    });
  }

  function tx(mode) {
    return open().then(function (d) {
      try { return d.transaction(STORE, mode).objectStore(STORE); }
      catch (e) {
        // "The database connection is closing" — reconnect once
        db = null;
        return open().then(function (d2) { return d2.transaction(STORE, mode).objectStore(STORE); });
      }
    });
  }

  function init() {
    return tx('readonly').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.openCursor();
        req.onsuccess = function () {
          var cur = req.result;
          if (cur) {
            var v = cur.value;
            known[v.id] = { text: v.text, kind: v.kind, size: v.blob ? v.blob.size : 0, ts: v.ts };
            cur.continue();
          } else { ready = true; resolve(true); }
        };
        req.onerror = function () { ready = true; resolve(false); };
      });
    }).catch(function () { ready = true; return false; });
  }

  function save(text, kind, blob) {
    var id = keyFor(text, kind);
    var rec = { id: id, text: String(text), kind: kind || 'say', blob: blob, ts: Date.now() };
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve, reject) {
        var req = store.put(rec);
        req.onsuccess = function () {
          known[id] = { text: rec.text, kind: rec.kind, size: blob.size, ts: rec.ts };
          resolve(id);
        };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function load(id) {
    return tx('readonly').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.get(id);
        req.onsuccess = function () { resolve(req.result ? req.result.blob : null); };
        req.onerror = function () { resolve(null); };
      });
    }).catch(function () { return null; });
  }

  function remove(text, kind) {
    var id = keyFor(text, kind);
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.delete(id);
        req.onsuccess = function () { delete known[id]; resolve(true); };
        req.onerror = function () { resolve(false); };
      });
    }).catch(function () { return false; });
  }

  function clearAll() {
    return tx('readwrite').then(function (store) {
      return new Promise(function (resolve) {
        var req = store.clear();
        req.onsuccess = function () { known = Object.create(null); resolve(true); };
        req.onerror = function () { resolve(false); };
      });
    }).catch(function () { return false; });
  }

  /* ---------------------- playback ------------------------ */
  /* One element, unlocked once. iOS will not let us create a new
     Audio() mid-lesson and play it without a fresh tap. */
  var needsUnlock = true;

  /* After the app returns from the background iOS may want a fresh
     gesture before it plays audio again, so this is re-armed then. */
  function rearm() { needsUnlock = true; }

  function unlock() {
    if (player && !needsUnlock) return;
    needsUnlock = false;
    if (!player) player = new Audio();
    player.preload = 'auto';
    // a 0.05s silent wav, just to satisfy the gesture requirement
    player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
    setTimeout(function () { try { player.pause(); player.currentTime = 0; } catch (e) {} }, 30);
  }

  function has(text, kind) { return !!known[keyFor(text, kind)]; }

  /* play() resolves true when a real recording was played, false
     when there is nothing recorded for this line (so the caller
     falls back to the synthesized voice). */
  function play(text, kind) {
    var id = keyFor(text, kind);
    if (!known[id]) return Promise.resolve(false);
    return load(id).then(function (blob) {
      if (!blob) return false;
      return new Promise(function (resolve) {
        if (!player) player = new Audio();
        if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
        currentUrl = URL.createObjectURL(blob);
        var done = false;
        function finish(v) { if (!done) { done = true; resolve(v); } }
        player.onended = function () { finish(true); };
        player.onerror = function () { finish(false); };
        player.src = currentUrl;
        var pr = player.play();
        if (pr && pr.catch) pr.catch(function () { finish(false); });
        // never let a stuck clip hang the lesson
        setTimeout(function () { finish(true); }, 30000);
      });
    });
  }

  function stop() {
    if (player) { try { player.pause(); player.currentTime = 0; } catch (e) {} }
  }

  /* ---------------------- recording ----------------------- */
  var stream = null, recorder = null, chunks = [];

  function pickMime() {
    if (!window.MediaRecorder) return null;
    var options = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < options.length; i++) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(options[i])) return options[i];
    }
    return '';
  }

  function canRecord() {
    return !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function startRecording() {
    if (!canRecord()) return Promise.reject(new Error('This browser cannot record audio.'));
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      chunks = [];
      var mime = pickMime();
      recorder = mime ? new MediaRecorder(s, { mimeType: mime }) : new MediaRecorder(s);
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.start();
      return true;
    });
  }

  /* stopRecording() resolves with the finished Blob. */
  function stopRecording() {
    return new Promise(function (resolve, reject) {
      if (!recorder) return reject(new Error('not recording'));
      recorder.onstop = function () {
        var type = recorder.mimeType || 'audio/mp4';
        var blob = new Blob(chunks, { type: type });
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
        recorder = null; chunks = [];
        resolve(blob);
      };
      try { recorder.stop(); } catch (e) { reject(e); }
    });
  }

  function isRecording() { return !!recorder; }

  function cancelRecording() {
    try { if (recorder) recorder.stop(); } catch (e) {}
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    recorder = null; chunks = [];
  }

  /* ------------------- backup / transfer ------------------ */
  function blobToBase64(blob) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onloadend = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, type) {
    var bin = atob(b64), n = bin.length, arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], { type: type || 'audio/mp4' });
  }

  function exportAll(onProgress) {
    var ids = Object.keys(known);
    var out = { app: 'chance-academy-voice', version: 1, made: new Date().toISOString(), clips: [] };
    var p = Promise.resolve();
    ids.forEach(function (id, i) {
      p = p.then(function () {
        return load(id).then(function (blob) {
          if (!blob) return;
          return blobToBase64(blob).then(function (b64) {
            out.clips.push({ id: id, text: known[id].text, kind: known[id].kind, type: blob.type, data: b64 });
            if (onProgress) onProgress(i + 1, ids.length);
          });
        });
      });
    });
    return p.then(function () { return out; });
  }

  function importAll(json) {
    if (!json || json.app !== 'chance-academy-voice' || !json.clips) {
      return Promise.reject(new Error('That is not a Chance Academy voice file.'));
    }
    var p = Promise.resolve(), n = 0;
    json.clips.forEach(function (c) {
      p = p.then(function () {
        return save(c.text, c.kind, base64ToBlob(c.data, c.type)).then(function () { n++; });
      });
    });
    return p.then(function () { return n; });
  }

  function stats() {
    var ids = Object.keys(known), bytes = 0;
    ids.forEach(function (id) { bytes += known[id].size || 0; });
    return { count: ids.length, bytes: bytes, mb: (bytes / 1048576).toFixed(1) };
  }

  /* ---------------- what there is to record ---------------- */
  /* Ordered by how often he will actually hear it, so somebody with
     twenty minutes records the lines that matter and stops. */
  function inventory() {
    var groups = [];

    // 1. the owl. Every one of these repeats across all 60 days.
    var coach = [];
    Object.keys(Evaluate.allTags()).forEach(function (t) {
      coach.push({ text: Evaluate.allTags()[t].say, kind: 'say', note: Evaluate.allTags()[t].label });
    });
    Object.keys(Evaluate.BEHAVIOR).forEach(function (b) {
      coach.push({ text: Evaluate.BEHAVIOR[b].say, kind: 'say', note: Evaluate.BEHAVIOR[b].label });
    });
    groups.push({
      id: 'coach', em: '🦉', name: 'Coach lines',
      blurb: 'What the owl says when he picks a wrong answer. These repeat on every single day — record these first.',
      lines: coach
    });

    // 2. praise and the app's own phrases
    var praise = Evaluate.praiseLines().map(function (t) { return { text: t, kind: 'say', note: 'praise' }; });
    Object.keys(Phrases).forEach(function (k) {
      if (typeof Phrases[k] === 'string') praise.push({ text: Phrases[k], kind: 'say', note: k });
    });
    groups.push({
      id: 'app', em: '⭐', name: 'Praise & app lines',
      blurb: 'Well done, station finished, mission complete. Also heard constantly.',
      lines: praise
    });

    // 3. the letter sounds. A synthesizer physically cannot say an
    //    isolated /f/; a person can. Recording each chunk once fixes
    //    the sound-out for every word in the course that uses it.
    groups.push({
      id: 'sounds', em: '🔤', name: 'Letter sounds',
      blurb: 'Say each one as a pure sound — "ffff", not "eff". Recorded once, each of these works in every word ' +
             'across all 60 days, and it is the one thing the computer voice genuinely cannot do.',
      /* Only graphemes with an anchor word — f, sh, igh, -le. Plain
         syllables like "sun" and "set" (grade 2 splits by syllable) are
         said perfectly well by the computer, so recording them adds
         nothing and would bury the ones that matter. */
      lines: Phonics.allChunks().filter(function (c) { return c.anchor; }).map(function (c) {
        return { text: c.chunk, kind: 'sound', note: 'as in "' + c.anchor + '"' };
      })
    });

    // 4. one group per mission day
    Curriculum.allDays().forEach(function (d) {
      var lines = [];
      d.discover.intro.forEach(function (t) { lines.push({ text: t, kind: 'say', note: 'science' }); });
      if (d.discover.word) {
        lines.push({ text: 'Big word: ' + d.discover.word.w + '. ' + d.discover.word.mean + '.', kind: 'say', note: 'big word' });
      }
      pushItem(lines, d.discover.check, 'science question');
      d.numbers.problems.forEach(function (p, i) { pushItem(lines, p, 'math ' + (i + 1)); });
      d.reading.words.forEach(function (w) {
        lines.push({ text: w.w, kind: 'say', note: 'word' });
      });
      lines.push({ text: d.reading.sentence, kind: 'say', note: 'sentence' });
      pushItem(lines, d.reading.comp, 'comprehension');
      groups.push({
        id: d.id, em: d.icon, name: 'Day ' + d.n + ': ' + d.title,
        blurb: d.unitName + ' · ' + d.weekTitle, lines: lines, day: true
      });
    });
    return groups;
  }

  function pushItem(lines, item, note) {
    if (!item) return;
    if (item.story) lines.push({ text: item.story, kind: 'say', note: note + ' story' });
    lines.push({ text: item.q, kind: 'say', note: note + ' question' });
    item.choices.forEach(function (c, i) {
      lines.push({ text: (i + 1) + '. ' + c.t, kind: 'say', note: note + ' choice' });
    });
    if (item.hint) lines.push({ text: item.hint, kind: 'say', note: note + ' hint' });
    if (item.show) lines.push({ text: item.show, kind: 'say', note: note + ' answer' });
  }

  function groupProgress(group) {
    var done = group.lines.filter(function (l) { return has(l.text, l.kind); }).length;
    return { done: done, total: group.lines.length, pct: Math.round(100 * done / (group.lines.length || 1)) };
  }

  init();

  return {
    isReady: function () { return ready; },
    has: has, play: play, stop: stop, unlock: unlock, rearm: rearm,
    save: save, remove: remove, clearAll: clearAll,
    canRecord: canRecord, startRecording: startRecording, stopRecording: stopRecording,
    isRecording: isRecording, cancelRecording: cancelRecording,
    exportAll: exportAll, importAll: importAll, stats: stats,
    inventory: inventory, groupProgress: groupProgress, keyFor: keyFor
  };
})();

/* Every fixed phrase the app speaks, in one place, so the recording
   studio can list exactly the strings the code will later look up.
   If these two ever drift apart you record a line that never plays,
   so they are defined here and referenced everywhere else. */
window.Phrases = {
  stationDone: 'Station complete. You earned a star.',
  missionDone: 'Mission complete! Fantastic work today.',
  tapTheAnswer: 'Here is the answer. Tap it with me, and say it out loud.',
  micOff: "I didn't hear you. Hold the microphone button and say it out loud."
};


/* ===== js/voice.js ===== */
/* ============================================================
   voice.js — Chance Academy speech layer

   Two jobs:
   1) SPEAK. Everything on screen can be read aloud in a soft
      female voice, slowed down for a 7-year-old, so reading is
      never the thing that blocks him from doing the science.
   2) LISTEN. In the Read & Say station he says the word out
      loud; we compare what the microphone heard against the
      target word and coach the sounds he missed.

   iOS notes (this app lives on an iPad):
   - getVoices() is empty until the engine warms up, so we wait
     on the voiceschanged event and re-resolve.
   - Speech will not start until the user has tapped once, so
     app.js calls Voice.unlock() on the first touch.
   - Safari's recognition is webkitSpeechRecognition and needs
     mic permission once per site. If it is missing or refused,
     the reading station falls back to "listen, then tap the
     sounds you said" so nothing is a dead end.
   ============================================================ */

window.Voice = (function () {
  var synth = window.speechSynthesis || null;
  var voices = [];
  var chosen = null;
  var unlocked = false;
  var muted = false;
  var queueTail = Promise.resolve();

  /* Soft, warm, female, in rough order of preference. First list is
     Apple (iPad / Mac), then Google, then Microsoft. */
  var PREFERRED = [
    'Samantha', 'Ava', 'Allison', 'Susan', 'Nicky', 'Karen', 'Moira',
    'Tessa', 'Fiona', 'Serena', 'Victoria', 'Kate',
    'Google UK English Female', 'Google US English',
    'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Michelle'
  ];

  var settings = {
    rate: 0.82,   // slower than default; he is 7 and decoding as he listens
    pitch: 1.12,  // a touch higher reads as gentler
    volume: 1,
    voiceName: null // grown-ups can pin a specific voice in settings
  };

  function loadSettings() {
    try {
      var raw = localStorage.getItem('chance.voice');
      if (raw) Object.assign(settings, JSON.parse(raw));
    } catch (e) {}
  }
  function saveSettings() {
    try { localStorage.setItem('chance.voice', JSON.stringify(settings)); } catch (e) {}
  }

  function score(v) {
    var n = (v.name || '');
    var idx = PREFERRED.findIndex(function (p) { return n.indexOf(p) === 0 || n === p; });
    var s = idx === -1 ? 500 : idx;
    if (!/^en/i.test(v.lang || '')) s += 1000;          // English only
    if (/compact|eloquence/i.test(n)) s += 60;          // the tinny fallback voices
    if (/\b(male|Daniel|Alex|Fred|Aaron|Arthur|Oliver|Rishi|Tom|Guy)\b/i.test(n)) s += 400;
    return s;
  }

  function resolveVoice() {
    if (!synth) return null;
    voices = synth.getVoices() || [];
    if (!voices.length) return null;
    if (settings.voiceName) {
      var pinned = voices.filter(function (v) { return v.name === settings.voiceName; })[0];
      if (pinned) { chosen = pinned; return chosen; }
    }
    chosen = voices.slice().sort(function (a, b) { return score(a) - score(b); })[0] || null;
    return chosen;
  }

  if (synth) {
    resolveVoice();
    synth.addEventListener && synth.addEventListener('voiceschanged', resolveVoice);
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = resolveVoice;
  }
  loadSettings();

  /* ---------------------------------------------------------------
     KEEPING THE SOUND ALIVE ON AN iPAD

     Reported: "somehow the sound turned off." Four separate things
     in the first version could each do that, and every one of them
     looked identical from the outside — silence, no error:

     1. One failed line poisoned the queue forever. Each line chains
        onto the one before; a single rejection meant every later
        .then() was skipped until the app was force-closed.
     2. iOS pauses the speech engine when the app goes to the
        background and never resumes it, so after a screen lock or
        an app switch every line queued silently.
     3. Audio was only unlocked on the very first tap. A home-screen
        app resuming from the background can need a fresh gesture.
     4. Stop() cleared the queue variable but not the chain already
        built on it, so lines queued before the tap still ran — and
        iOS drops an utterance spoken in the same tick as cancel().

     The fixes are below: a generation counter, a catch on every
     queued step, resume() before speaking, a pause after cancel, a
     re-armed unlock on return from the background, and repair() —
     which the 🔊 button calls, so "no sound? tap the speaker" works.
     --------------------------------------------------------------- */

  var generation = 0;        // bumped by stop(); queued lines from before it skip

  /* How many lines are queued or playing. The app shows a Stop
     button whenever this is above zero, on every screen. */
  var inFlight = 0;
  var talkListeners = [];
  function setInFlight(delta) {
    var was = inFlight > 0;
    inFlight = Math.max(0, inFlight + delta);
    var now = inFlight > 0;
    if (was !== now) talkListeners.forEach(function (fn) { try { fn(now); } catch (e) {} });
  }
  function onTalking(fn) { talkListeners.push(fn); }

  var lastCancel = 0;        // when cancel() last ran — iOS drops speech right after
  var stalls = 0;            // utterances that never started; >0 means wedged

  /* A silent utterance inside a tap buys the right to speak later
     without one. Re-armed every time the app comes back to the
     front, because iOS may have taken that right away. */
  function unlock() {
    if (!synth) return;
    try { synth.resume(); } catch (e) {}
    if (unlocked) return;
    unlocked = true;
    resolveVoice();
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 2;
      synth.speak(u);
    } catch (e) {}
  }

  function stop() {
    generation++;
    if (inFlight) setInFlight(-inFlight);
    if (window.Recordings) Recordings.stop();
    queueTail = Promise.resolve();
    if (!synth) return;
    try { synth.cancel(); } catch (e) {}
    lastCancel = Date.now();
  }

  /* Back from the background (screen lock, app switch, home button).
     The engine is probably paused, the queue holds lines nobody is
     waiting for, and audio may need re-unlocking on the next tap. */
  function onReturn() {
    stop();
    try { if (synth) synth.resume(); } catch (e) {}
    unlocked = false;
    stalls = 0;
    resolveVoice();
    if (window.Recordings && Recordings.rearm) Recordings.rearm();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') onReturn();
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) onReturn(); });

  /* Everything at once, called from inside a tap so iOS accepts the
     unlock. This is what the 🔊 button runs before it replays. */
  function repair() {
    onReturn();
    unlock();
    if (window.Recordings) Recordings.unlock();
  }

  /* Get the engine into a state where speak() will actually play. */
  function wake() {
    if (!synth) return Promise.resolve();
    try { synth.resume(); } catch (e) {}
    var wait = Math.max(0, 140 - (Date.now() - lastCancel));
    if (stalls > 0) {
      // the last line never started: the engine is wedged
      stalls = 0;
      try { synth.cancel(); } catch (e) {}
      lastCancel = Date.now();
      wait = 160;
    }
    if (!wait) return Promise.resolve();
    return pause(wait).then(function () { try { synth.resume(); } catch (e) {} });
  }

  /* For the grown-up sound check: what the engine thinks it is doing. */
  function diagnose() {
    return {
      available: !!synth,
      voices: synth ? (synth.getVoices() || []).length : 0,
      voice: chosen ? chosen.name : 'device default',
      paused: !!(synth && synth.paused),

     single phonemes out). Calls queue rather than interrupt so a
     three-sentence lesson reads in order.

     somebody has recorded this exact line in the studio, we play
     their voice; otherwise we fall back to speech synthesis. That
     is what lets a half-finished recording session still work. */

      .catch(function () {})

      // already zeroed the count for everything older

  function speak(text, opts) {

      return new Promise(function (done) {
        var finished = false, started = false;
        function finish() { if (!finished) { finished = true; done(); } }

          // and iOS reloads its voice list; fall back rather than throw.

          var safety = Math.min(20000, 1400 + String(text).length * 95);

          // next line. This must run BEFORE the safety net, or a short line
          // gets quietly "finished" and the wedge is never noticed.
          setTimeout(function () { if (!started && !finished) stalls++; }, Math.min(2500, safety - 100));
          setTimeout(finish, safety);

  /* Read a list of lines with a beat between them, calling back
     before each one so the UI can highlight what is being said. */

     If somebody has recorded this chunk in the booth, play their

     phonics.js ("f, like in fan"), which is built entirely out of

  /* Kept for the recording booth, which needs to preview the clip

  function sayPhoneme(sound) {

  }

  /* Sound out a word the way a reading teacher does: the whole word,
     each chunk anchored in a real word, then the blend.
     onStep(highlightIndex) lets the UI light the chunk being said. */
  function soundOut(word, parts, onStep) {

      ? Phonics.script(word, parts)

    steps.forEach(function (st) {
      p = p.then(function () {
        if (onStep) onStep(st.highlight);
        if (st.chunk != null) return sayChunk(st.chunk, word, st.index);
        return say(st.phrase, { rate: st.whole ? 0.75 : 0.85 });
      }).then(function () { return pause(180); });
    });
    return p.then(function () { if (onStep) onStep(-1); });
  }

  /* --------------------------- LISTENING --------------------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var rec = null, recBusy = false;

  function canListen() { return !!SR; }

  /* listen() -> Promise<{transcript, ok:boolean, reason}>  */
  function listen(opts) {
    opts = opts || {};
    if (!SR) return Promise.resolve({ transcript: '', ok: false, reason: 'unsupported' });
    if (recBusy) return Promise.resolve({ transcript: '', ok: false, reason: 'busy' });

    return new Promise(function (resolve) {
      recBusy = true;
      var settled = false;
      var best = '';
      try { rec = new SR(); } catch (e) { recBusy = false; return resolve({ transcript: '', ok: false, reason: 'unsupported' }); }
      rec.lang = 'en-US';
      rec.continuous = false;
      rec.interimResults = true;
      rec.maxAlternatives = 5;
      var alts = [];

      function finish(reason) {
        if (settled) return;
        settled = true; recBusy = false;
        try { rec.stop(); } catch (e) {}
        resolve({ transcript: best.trim(), alternatives: alts, ok: !!best.trim(), reason: reason || 'ok' });
      }

      rec.onresult = function (ev) {
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var r = ev.results[i];
          for (var j = 0; j < r.length; j++) {
            if (r[j].transcript) alts.push(r[j].transcript);
          }
          if (r[0] && r[0].transcript) best = r[0].transcript;
          if (opts.onInterim) opts.onInterim(best);
          if (r.isFinal) return finish('ok');
        }
      };
      rec.onerror = function (ev) {
        finish(ev && ev.error === 'not-allowed' ? 'denied' : 'error');
      };
      rec.onend = function () { finish('ok'); };
      try { rec.start(); } catch (e) { finish('error'); }
      setTimeout(function () { finish('timeout'); }, opts.ms || 6000);
    });
  }

  function abortListen() {
    if (rec) { try { rec.abort(); } catch (e) {} }
    recBusy = false;
  }

  /* ----------------------- PRONUNCIATION MATCH --------------------- */
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function lev(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[n];
  }

  /* Homophone-ish forgiveness: the recogniser often returns a common
     word that sounds like the target ("son" for "sun"). Reading the
     word correctly out loud is the goal, not spelling it. */
  var SOUNDALIKE = {
    sun: ['son'], son: ['sun'], to: ['two', 'too'], two: ['to', 'too'],
    for: ['four', 'fore'], four: ['for'], one: ['won'], won: ['one'],
    ate: ['eight'], eight: ['ate'], be: ['bee'], bee: ['be'],
    see: ['sea'], sea: ['see'], by: ['buy', 'bye'], red: ['read'],
    hour: ['our'], our: ['hour'], knew: ['new'], new: ['knew'],
    weight: ['wait'], wait: ['weight'], ate2: []
  };

  /* heard vs target -> 0..1 confidence that he said the word. */
  function match(target, heard, alternatives) {
    var t = norm(target);
    var pool = [heard].concat(alternatives || []).map(norm).filter(Boolean);
    if (!pool.length) return 0;
    var best = 0;
    pool.forEach(function (h) {
      // The recogniser often returns a whole phrase; check each word too.

        var s;
        if (c === t) s = 1;
        else if ((SOUNDALIKE[t] || []).indexOf(c) !== -1) s = 0.95;
        else {

          if (c.length > 2 && t.indexOf(c) === 0) s = Math.max(s, 0.7); // said the first part
        }
        if (s > best) best = s;
      });
    });
    return best;
  }

  return {
    say: say, sayLines: sayLines, sayPhoneme: sayPhoneme, sayChunk: sayChunk, soundOut: soundOut,
    stop: stop, unlock: unlock, pause: pause, repair: repair, diagnose: diagnose,
    onTalking: onTalking, isTalking: function () { return inFlight > 0; },
    listen: listen, abortListen: abortListen, canListen: canListen, match: match, norm: norm,

    setMuted: function (m) { muted = !!m; if (muted) stop(); },
    isMuted: function () { return muted; },
    update: function (patch) { Object.assign(settings, patch || {}); saveSettings(); resolveVoice(); },
    listVoices: function () { resolveVoice(); return voices.filter(function (v) { return /^en/i.test(v.lang || ''); }); },
    currentVoiceName: function () { return chosen ? chosen.name : 'device default'; },
    available: function () { return !!synth; }
  };
})();


/* ===== js/evaluate.js ===== */
/* ============================================================
   evaluate.js — the real-time reasoning evaluator

   A normal quiz app knows one thing: right or wrong. That is not
   useful for a 7-year-old, because *why* he picked an answer is
   the whole story. "12" can be a careful answer or a tap.

   So every wrong choice in the curriculum data carries a TAG: the
   specific thinking error that leads to that choice. The evaluator
   watches the tags, plus how long he took and how many tries, and
   reacts inside the same second:

     - it speaks a coaching line aimed at that exact error
       (not "wrong", not "try again")
     - it drops a live signal into the Thinking Meter at the top
     - it logs the event so the grown-up report can say
       "he is sound on multiplication, but bigger-number-bias
       showed up 6 times in speed problems this week"

   Behaviour signals it also catches, which no answer key can:
     fast-guess     answered faster than the question can be read
     hesitation     long freeze — the item is above his level today
     thrash         three tries on one item, needs the scaffold
     repeat-tag     the same thinking error twice in one sitting
   ============================================================ */

window.Evaluate = (function () {

  /* ---------------- the thinking-error dictionary ----------------
     say   : spoken to Chance immediately, in his language
     label : what the grown-up report calls it
     fix   : what to practice, for the report
     Tags are shared across science, math and reading on purpose —
     the same habit shows up in all three, and seeing that is the
     point of the report. */
  var TAGS = {
    'bigger-number-bias': {
      label: 'Picks the bigger number',
      say: "You grabbed the biggest number. Big numbers aren't always the answer. What is the question really asking?",
      fix: 'Ask "what is being counted?" out loud before choosing.'
    },
    'additive-for-multiplicative': {
      label: 'Adds when it should be groups-of',
      say: "That looks like adding. This one is groups. How many groups, and how many in each group?",
      fix: 'Draw the groups as circles with dots before answering.'
    },
    'unit-mixup': {
      label: 'Mixes up the units',
      say: "Check the words next to the number. Minutes and hours are not the same size, and neither are feet and miles.",
      fix: 'Read the unit out loud with every number.'
    },
    'reversed-relation': {
      label: 'Flips the relationship backwards',
      say: "You turned it around. Going faster means the trip takes LESS time, not more. Say it out loud both ways.",
      fix: 'Practice "faster means less time" with two real trips.'
    },
    'surface-feature': {
      label: 'Matches a word instead of the meaning',
      say: "That answer copies a word from the question, but it doesn't answer it. What is the question actually asking?",
      fix: 'Cover the choices, answer in your own words first, then look.'
    },
    'literal-appearance': {
      label: 'Trusts how it looks over how it works',
      say: "That's how it LOOKS. Scientists ask what is really happening. What is really going on here?",
      fix: 'Name the appearance and the reality separately.'
    },
    'ignored-condition': {
      label: 'Skips a detail in the story',
      say: "There's a clue in the story you flew past. Let's read it again and hunt for the number you missed.",
      fix: 'Underline every number and every "each/every/both" in the story.'
    },
    'off-by-one': {
      label: 'Off by one',
      say: "So close! You're one away. Count it again slowly, with your finger.",
      fix: 'Count aloud and touch each item once.'
    },
    'part-whole-mixup': {
      label: 'Confuses the part with the whole',
      say: "Careful — is that the whole thing, or just one piece of it?",
      fix: 'Say "whole" and "part" out loud before choosing.'
    },
    'perimeter-area-mixup': {
      label: 'Confuses around-the-edge with inside',
      say: "Are we walking around the outside, or covering the inside? Those are two different jobs.",
      fix: 'Trace the edge with a finger, then tap the inside squares.'
    },
    'shape-orientation': {
      label: 'Thinks a turned shape is a new shape',
      say: "Turning a shape doesn't change what it is. A square tipped on its corner is still a square.",
      fix: 'Rotate a cut-out shape by hand and re-name it each turn.'
    },
    'sequence-error': {
      label: 'Gets the order of steps wrong',
      say: "Right pieces, wrong order. What has to happen FIRST?",
      fix: 'Number the steps 1-2-3 before answering.'
    },
    'animism': {
      label: 'Gives objects wants and feelings',
      say: "Rocks and planets don't want anything — they just follow rules. What rule is making this happen?",
      fix: 'Replace "it wants to" with "the force that pushes it is…"'
    },
    'overgeneralize': {
      label: 'Uses a rule where it does not apply',
      say: "That rule works sometimes, but not here. What is different about this one?",
      fix: 'Hunt for the exception on purpose.'
    },
    'guess-plausible': {
      label: 'Picks the sensible-sounding answer without checking',
      say: "That sounds right, but let's prove it. Show me the numbers you used.",
      fix: 'Say the calculation out loud before tapping.'
    },
    'letter-look': {
      label: 'Reads by the shape of the word',
      say: "That word starts the same, but look at the middle sounds. Let's sound the whole word out.",
      fix: 'Touch each sound chunk while saying it.'
    },
    'vowel-swap': {
      label: 'Swaps the vowel sound',
      say: "Check the vowel in the middle. That one little letter changes the whole word.",
      fix: 'Short-vowel drill with the five vowel cards.'
    }
  };

  var BEHAVIOR = {
    'fast-guess': {
      label: 'Answered before reading',
      say: "Whoa, speedy! That was faster than the question. Read it with me once, then choose.",
      fix: 'Require him to say the question back before answering.'
    },
    'hesitation': {
      label: 'Long freeze',
      say: "This one's tricky. Want me to read it again? There's no clock here.",
      fix: 'This item is above his level today — scaffold it or come back later.'
    },
    'thrash': {
      label: 'Three tries on one item',
      say: "Let's take two answers off the board and think about the two that are left.",
      fix: 'Break the problem into two smaller questions.'
    },
    'repeat-tag': {
      label: 'Same thinking error twice in one sitting',
      say: "That's the same trap as before! Remember what we said? Let's use it.",
      fix: 'Do a 2-minute drill on this habit before the next mission.'
    }
  };

  var PRAISE = [
    "Yes! That's exactly the reasoning.",
    "Nailed it. You used the numbers, not a guess.",
    "That's it. Good, careful thinking.",
    "Correct — and you found it on the first try.",
    "Right! You caught the important detail."
  ];
  var PRAISE_RECOVER = [
    "There it is. You fixed it yourself — that's what scientists do.",
    "Yes! Second look, better answer.",
    "That's the one. Slowing down worked."
  ];

  /* thresholds, in milliseconds */
  var FAST_MS = 1900;      // faster than a 7-year-old can read the question
  var SLOW_MS = 32000;     // frozen

  var session = null;

  function startSession(dayId) {
    session = {
      dayId: dayId,
      started: Date.now(),
      events: [],
      tagCounts: {},
      firstTry: 0,
      items: 0,
      focus: 72          // drives the Thinking Meter, 0..100
    };
    return session;
  }

  function currentSession() { return session; }

  /* ---------------------------------------------------------------
     judge() is called the instant a choice is tapped.
     Returns everything the UI needs to react:
       { correct, speak, tone, flags, focus, reveal, eliminate }
     --------------------------------------------------------------- */
  function judge(o) {
    // o: {itemId, station, domain, choice, attempt, ms, item}
    if (!session) startSession(o.dayId || 'free');
    var correct = !!o.choice.correct;
    var tag = o.choice.tag || null;
    var flags = [];
    var speak = '';
    var tone = correct ? 'good' : 'coach';
    var reveal = false, eliminate = false;

    if (o.attempt === 1) session.items++;

    /* --- behaviour first: how he answered matters as much as what --- */
    if (!correct && o.ms < FAST_MS) flags.push('fast-guess');
    if (correct && o.ms < 900 && (o.item && o.item.multiStep)) flags.push('lucky-fast');
    if (o.ms > SLOW_MS) flags.push('hesitation');
    if (!correct && o.attempt >= 3) { flags.push('thrash'); eliminate = true; }

    /* --- the specific thinking error --- */
    if (tag) {
      session.tagCounts[tag] = (session.tagCounts[tag] || 0) + 1;
      if (session.tagCounts[tag] >= 2) flags.push('repeat-tag');
    }

    /* --- what the owl says, most specific message wins --- */
    if (correct) {
      speak = o.attempt === 1 ? pick(PRAISE) : pick(PRAISE_RECOVER);
      if (o.attempt === 1) session.firstTry++;
      session.focus = clamp(session.focus + (o.attempt === 1 ? 8 : 4));
      if (flags.indexOf('lucky-fast') !== -1) {
        speak += " Tell me how you got it?";
      }
    } else if (flags.indexOf('fast-guess') !== -1) {
      speak = BEHAVIOR['fast-guess'].say;
      tone = 'slow-down';
      session.focus = clamp(session.focus - 16);
    } else if (flags.indexOf('repeat-tag') !== -1 && tag) {
      speak = BEHAVIOR['repeat-tag'].say + ' ' + TAGS[tag].say;
      tone = 'pattern';
      session.focus = clamp(session.focus - 10);
    } else if (tag && TAGS[tag]) {
      speak = TAGS[tag].say;
      session.focus = clamp(session.focus - 7);
    } else {
      speak = "Not that one. Read it with me one more time.";
      session.focus = clamp(session.focus - 6);
    }

    if (!correct && o.attempt >= 3) {
      reveal = true;
      speak = "Let's do this one together. " + (o.item && o.item.hint ? o.item.hint : '');
    } else if (!correct && o.item && o.item.hint && o.attempt === 2) {
      speak += ' ' + o.item.hint;
    }

    if (flags.indexOf('hesitation') !== -1 && !correct) {
      speak = BEHAVIOR.hesitation.say + ' ' + speak;
    }

    var ev = {
      t: Date.now(), dayId: session.dayId, itemId: o.itemId, station: o.station,
      domain: o.domain || o.station, correct: correct, tag: tag,
      attempt: o.attempt, ms: o.ms, flags: flags
    };
    session.events.push(ev);
    if (window.Progress) Progress.logEvent(ev);

    return {
      correct: correct, speak: speak, tone: tone, flags: flags,
      focus: session.focus, reveal: reveal, eliminate: eliminate,
      tag: tag, tagLabel: tag && TAGS[tag] ? TAGS[tag].label : null
    };
  }

  /* Reading station: judge a spoken word instead of a tap. */
  function judgeSpoken(o) {
    // o: {word, parts, confidence, attempt, heard, itemId}
    var c = o.confidence;
    var ok = c >= 0.72;
    var close = !ok && c >= 0.45;
    var speak, tone = ok ? 'good' : 'coach', flags = [];

    if (ok) {
      speak = c >= 0.95
        ? 'That is exactly right. ' + o.word + '.'
        : 'Yes — ' + o.word + '. You got it.';
    } else if (close) {
      speak = 'Close! I heard something like that. Listen to the sounds again.';
      flags.push('letter-look');
    } else if (!o.heard) {
      speak = Phrases.micOff;
      tone = 'retry';
    } else {
      speak = 'I heard "' + o.heard + '". The word is ' + o.word + '. Let me break it up for you.';
      flags.push('vowel-swap');
    }

    var ev = {
      t: Date.now(), dayId: session ? session.dayId : 'free', itemId: o.itemId,
      station: 'reading', domain: 'phonics', correct: ok,
      tag: ok ? null : (close ? 'letter-look' : 'vowel-swap'),
      attempt: o.attempt, ms: o.ms || 0, flags: flags, heard: o.heard || ''
    };
    if (session) {
      session.events.push(ev);
      session.items += o.attempt === 1 ? 1 : 0;
      if (ok && o.attempt === 1) session.firstTry++;
      session.focus = clamp(session.focus + (ok ? 6 : -5));
    }
    if (window.Progress) Progress.logEvent(ev);

    return { correct: ok, close: close, speak: speak, tone: tone, focus: session ? session.focus : 70 };
  }

  /* --------------------- session-level read-out --------------------- */
  function sessionSummary() {
    if (!session) return null;
    var s = session;
    var times = s.events.filter(function (e) { return e.attempt === 1 && e.ms; }).map(function (e) { return e.ms; });
    var topTag = Object.keys(s.tagCounts).sort(function (a, b) { return s.tagCounts[b] - s.tagCounts[a]; })[0] || null;
    return {
      dayId: s.dayId,
      items: s.items,
      firstTry: s.firstTry,
      firstTryPct: s.items ? Math.round(100 * s.firstTry / s.items) : 0,
      medianMs: median(times),
      focus: s.focus,
      topTag: topTag,
      topTagLabel: topTag ? TAGS[topTag].label : null,
      topTagCount: topTag ? s.tagCounts[topTag] : 0,
      cleanRun: s.items > 0 && s.firstTry === s.items,
      events: s.events.slice()
    };
  }

  function tagInfo(tag) { return TAGS[tag] || BEHAVIOR[tag] || null; }
  function allTags() { return TAGS; }

  function clamp(n) { return Math.max(5, Math.min(100, Math.round(n))); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function median(a) {
    if (!a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
  }

  return {
    startSession: startSession, currentSession: currentSession,
    judge: judge, judgeSpoken: judgeSpoken, sessionSummary: sessionSummary,
    tagInfo: tagInfo, allTags: allTags, BEHAVIOR: BEHAVIOR,
    // the recording studio lists these so they can be said in a real voice
    praiseLines: function () { return PRAISE.concat(PRAISE_RECOVER); }
  };
})();


/* ===== js/progress.js ===== */
/* ============================================================
   progress.js — stars, streaks, weekly and monthly goals, badges

   Everything lives in localStorage on the iPad, so there is no
   account to make and no data leaving the device. The grown-up
   report reads from the same log the evaluator writes to.

   Reward shape (deliberately simple enough for a 7-year-old to
   hold in his head):
     ⭐ one star per station finished          -> 3 a day
     💎 a gem when every answer was first-try  -> "clean run"
     🗓️ weekly badge at 5 finished days in a calendar week
     🎖️ monthly patch at 20 finished days in a calendar month
     plus milestone badges for streaks and totals
   ============================================================ */

window.Progress = (function () {
  var KEY = 'chance.progress.v1';
  var LOG_CAP = 2000;

  var data = {
    name: 'Chance',
    days: {},        // dayId -> { done, stars, gem, date, firstTryPct }
    stations: {},    // dayId:station -> true
    log: [],         // evaluator events
    badges: {},      // badgeId -> ISO date earned
    streak: { count: 0, best: 0, last: null },
    totals: { stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        data = Object.assign(data, parsed);
        data.totals = Object.assign({ stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }, parsed.totals || {});
        data.streak = Object.assign({ count: 0, best: 0, last: null }, parsed.streak || {});
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  load();

  /* ------------------------------ dates ---------------------------- */
  function today() { return iso(new Date()); }
  function iso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  /* Monday-start week key, e.g. 2026-W32 */
  function weekKey(d) {
    d = d || new Date();
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (x.getDay() + 6) % 7;             // Mon = 0
    x.setDate(x.getDate() - dow);
    return x.getFullYear() + '-W' + iso(x).slice(5);
  }
  function monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

  function daysDoneIn(keyFn, key) {
    var seen = {};
    Object.keys(data.days).forEach(function (id) {
      var rec = data.days[id];
      if (!rec.done || !rec.date) return;
      if (keyFn(parseIso(rec.date)) === key) seen[rec.date] = true;
    });
    return Object.keys(seen).length;
  }

  function weekProgress() {
    var n = daysDoneIn(weekKey, weekKey());
    return { done: n, goal: 5, pct: Math.min(100, Math.round(100 * n / 5)), met: n >= 5 };
  }
  function monthProgress() {
    var n = daysDoneIn(monthKey, monthKey());
    return { done: n, goal: 20, pct: Math.min(100, Math.round(100 * n / 20)), met: n >= 20 };
  }

  /* ------------------------------ badges --------------------------- */
  /* Weekly badges are themed to the week's science so the reward
     means something — "you earned the Moon Watcher patch" beats
     "you earned badge 3". Curriculum supplies the names. */
  var MILESTONES = [
    { id: 'first-day',   em: '🌟', name: 'Launch Day',        test: function (d) { return countDone() >= 1; },  blurb: 'Finished your very first mission.' },
    { id: 'streak-3',    em: '🔥', name: '3-Day Streak',      test: function (d) { return d.streak.count >= 3; }, blurb: 'Three days in a row.' },
    { id: 'streak-5',    em: '⚡', name: '5-Day Streak',      test: function (d) { return d.streak.count >= 5; }, blurb: 'Five days in a row.' },
    { id: 'streak-10',   em: '🏅', name: '10-Day Streak',     test: function (d) { return d.streak.count >= 10; }, blurb: 'Ten days without missing.' },
    { id: 'stars-25',    em: '✨', name: '25 Stars',          test: function (d) { return d.totals.stars >= 25; }, blurb: 'Twenty-five stars collected.' },
    { id: 'stars-100',   em: '🌠', name: '100 Stars',         test: function (d) { return d.totals.stars >= 100; }, blurb: 'One hundred stars. That is a lot of thinking.' },
    { id: 'gems-5',      em: '💎', name: 'Clear Thinker',     test: function (d) { return d.totals.gems >= 5; }, blurb: 'Five perfect first-try missions.' },
    { id: 'gems-15',     em: '👑', name: 'Master Reasoner',   test: function (d) { return d.totals.gems >= 15; }, blurb: 'Fifteen perfect missions.' },
    { id: 'words-50',    em: '🗣️', name: 'Word Sayer',        test: function (d) { return d.totals.wordsSpoken >= 50; }, blurb: 'Read fifty words out loud.' },
    { id: 'words-200',   em: '📣', name: 'Out-Loud Reader',   test: function (d) { return d.totals.wordsSpoken >= 200; }, blurb: 'Two hundred words read out loud.' },
    { id: 'unit-1',      em: '🚀', name: 'Space Explorer',    test: function () { return unitDone(1); }, blurb: 'Completed every Space mission.' },
    { id: 'unit-2',      em: '🦎', name: 'Field Scientist',   test: function () { return unitDone(2); }, blurb: 'Completed every Woods & Water mission.' },
    { id: 'unit-3',      em: '⚙️', name: 'Engineer',          test: function () { return unitDone(3); }, blurb: 'Completed every Forces & Machines mission.' }
  ];

  function countDone() {
    return Object.keys(data.days).filter(function (k) { return data.days[k].done; }).length;
  }
  function unitDone(n) {
    if (!window.Curriculum) return false;
    var ds = Curriculum.daysInUnit(n);
    return ds.length > 0 && ds.every(function (d) { return isDayDone(d.id); });
  }

  function awardBadge(id, em, name, blurb) {
    if (data.badges[id]) return null;
    data.badges[id] = { date: today(), em: em, name: name, blurb: blurb || '' };
    save();
    return data.badges[id];
  }

  function checkBadges() {
    var fresh = [];
    MILESTONES.forEach(function (m) {
      if (!data.badges[m.id] && m.test(data)) {
        var b = awardBadge(m.id, m.em, m.name, m.blurb);
        if (b) fresh.push(Object.assign({ id: m.id }, b));
      }
    });
    // weekly
    var wp = weekProgress();
    if (wp.met) {
      var wk = weekKey();
      var theme = window.Curriculum ? Curriculum.weekBadgeForDate() : { em: '🗓️', name: 'Week Complete' };
      var b2 = awardBadge('week-' + wk, theme.em, theme.name, 'Five mission days in one week.');
      if (b2) fresh.push(Object.assign({ id: 'week-' + wk }, b2));
    }
    // monthly
    var mp = monthProgress();
    if (mp.met) {
      var b3 = awardBadge('month-' + monthKey(), '🎖️', 'Monthly Mission Patch', 'Twenty mission days in one month.');
      if (b3) fresh.push(Object.assign({ id: 'month-' + monthKey() }, b3));
    }
    return fresh;
  }

  /* ---------------------------- recording -------------------------- */
  function logEvent(ev) {
    data.log.push(ev);
    // Only spoken phonics words count toward "words read aloud" —
    // the comprehension question is a tap, not a word.
    if (ev.domain === 'phonics' && ev.correct) data.totals.wordsSpoken++;
    if (data.log.length > LOG_CAP) data.log.splice(0, data.log.length - LOG_CAP);
    save();
  }

  function completeStation(dayId, station) {
    var k = dayId + ':' + station;
    var firstTime = !data.stations[k];
    if (firstTime) {
      data.stations[k] = today();
      data.totals.stars++;
      save();
    }
    return { star: firstTime, stars: data.totals.stars };
  }

  function stationDone(dayId, station) { return !!data.stations[dayId + ':' + station]; }

  function dayStationsDone(dayId) {
    return ['discover', 'numbers', 'reading'].filter(function (s) { return stationDone(dayId, s); });
  }

  function isDayDone(dayId) { return !!(data.days[dayId] && data.days[dayId].done); }

  /* Called when all three stations of a day are finished. */
  function completeDay(dayId, summary) {
    var already = isDayDone(dayId);
    var rec = data.days[dayId] || {};
    rec.done = true;
    rec.date = rec.date || today();
    rec.stars = 3;
    rec.firstTryPct = summary ? summary.firstTryPct : rec.firstTryPct || 0;
    if (summary && summary.cleanRun && !rec.gem) { rec.gem = true; data.totals.gems++; }
    data.days[dayId] = rec;

    if (!already) {
      data.totals.sessions++;
      bumpStreak();
    }
    save();
    return { fresh: !already, badges: checkBadges(), gem: !!rec.gem };
  }

  function bumpStreak() {
    var t = today();
    if (data.streak.last === t) return;
    var y = new Date(); y.setDate(y.getDate() - 1);
    data.streak.count = (data.streak.last === iso(y)) ? data.streak.count + 1 : 1;
    data.streak.last = t;
    if (data.streak.count > data.streak.best) data.streak.best = data.streak.count;
  }

  /* ------------------------- what to do today ---------------------- */
  /* The next unfinished day in curriculum order. If he finished
     today's mission he can keep going — nothing is locked, because
     locking a curious kid out is the opposite of the point. */
  function nextDay() {
    if (!window.Curriculum) return null;
    var all = Curriculum.allDays();
    for (var i = 0; i < all.length; i++) {
      if (!isDayDone(all[i].id)) return all[i];
    }
    return all[all.length - 1];
  }

  function badgeList() {
    return Object.keys(data.badges).map(function (id) {
      return Object.assign({ id: id }, data.badges[id]);
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function lockedMilestones() {
    return MILESTONES.filter(function (m) { return !data.badges[m.id]; });
  }

  function reset() {
    data = {
      name: data.name, days: {}, stations: {}, log: [], badges: {},
      streak: { count: 0, best: 0, last: null },
      totals: { stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }
    };
    save();
  }

  return {
    get data() { return data; },
    save: save, today: today, weekKey: weekKey, monthKey: monthKey,
    weekProgress: weekProgress, monthProgress: monthProgress,
    logEvent: logEvent, completeStation: completeStation, stationDone: stationDone,
    dayStationsDone: dayStationsDone, completeDay: completeDay, isDayDone: isDayDone,
    countDone: countDone, nextDay: nextDay, badgeList: badgeList,
    lockedMilestones: lockedMilestones, checkBadges: checkBadges, reset: reset,
    setName: function (n) { data.name = n || 'Chance'; save(); }
  };
})();


/* ===== js/rewards.js ===== */
/* ============================================================
   rewards.js — draws the reward card and gets it off the iPad

   Grandpa's ask: when Chance earns something, he should be able to
   send it to family. So every badge becomes a real PNG image drawn
   here on a canvas, and then:

     Share   -> navigator.share() with the actual image file. On
                iPad this opens the iOS share sheet, so Messages,
                Mail, AirDrop and Photos all work in one tap and
                the picture really is attached.
     Save    -> downloads the PNG (Files / Photos).
     Text    -> sms: link pre-filled with the achievement text.
     Email   -> mailto: link pre-filled, with the text.

   sms: and mailto: links cannot carry an attachment — that is an
   iOS limitation, not a choice — so those two send the words and
   we tell the user to use Share if they want the picture.
   ============================================================ */

window.Rewards = (function () {

  var W = 1080, H = 1350;

  function drawCard(badge, stats) {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');

    // --- night sky background, because everything started with the solar system
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#132f54');
    sky.addColorStop(0.55, '#0f2a4a');
    sky.addColorStop(1, '#091a2f');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // stars — seeded so a badge always looks the same when re-shared
    var seed = hash(badge.id || badge.name || 'x');
    for (var i = 0; i < 90; i++) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      var x = (seed % W), y = ((seed >> 7) % (H - 380));
      var r = ((seed >> 3) % 3) + 1;
      g.globalAlpha = 0.25 + ((seed >> 11) % 60) / 100;
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;

    // --- header
    g.textAlign = 'center';
    g.fillStyle = '#ffc93c';
    g.font = '800 40px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('CHANCE ACADEMY', W / 2, 118);
    g.fillStyle = 'rgba(255,255,255,.66)';
    g.font = '600 28px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('Science · Numbers · Reading', W / 2, 162);

    // --- medallion
    var cx = W / 2, cy = 470, R = 210;
    var ring = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    ring.addColorStop(0, '#ffe27a');
    ring.addColorStop(0.5, '#ffc93c');
    ring.addColorStop(1, '#f5a524');
    g.fillStyle = ring;
    g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill();
    g.fillStyle = '#0f2a4a';
    g.beginPath(); g.arc(cx, cy, R - 26, 0, 6.283); g.fill();

    // sunburst points
    g.save();
    g.translate(cx, cy);
    g.fillStyle = 'rgba(255,201,60,.9)';
    for (var s = 0; s < 16; s++) {
      g.rotate(6.283 / 16);
      g.beginPath();
      g.moveTo(-14, -R - 6); g.lineTo(14, -R - 6); g.lineTo(0, -R - 42);
      g.closePath(); g.fill();
    }
    g.restore();

    // the badge emoji, dead centre
    g.font = '200px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    g.textBaseline = 'middle';
    g.fillText(badge.em || '⭐', cx, cy + 8);
    g.textBaseline = 'alphabetic';

    // --- who and what
    g.fillStyle = '#ffffff';
    g.font = '800 66px "Trebuchet MS", system-ui, sans-serif';
    wrap(g, badge.name || 'Great Work', cx, 790, W - 140, 74);

    g.fillStyle = '#ffc93c';
    g.font = '700 40px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('earned by ' + (badge.who || 'Chance'), cx, 890);

    if (badge.blurb) {
      g.fillStyle = 'rgba(255,255,255,.8)';
      g.font = '400 32px "Trebuchet MS", system-ui, sans-serif';
      wrap(g, badge.blurb, cx, 950, W - 200, 42);
    }

    // --- stats strip
    if (stats && stats.length) {
      var boxY = 1050, boxH = 150, pad = 70;
      g.fillStyle = 'rgba(255,255,255,.08)';
      roundRect(g, pad, boxY, W - pad * 2, boxH, 28);
      g.fill();
      var each = (W - pad * 2) / stats.length;
      stats.forEach(function (st, i) {
        var x = pad + each * i + each / 2;
        g.fillStyle = '#ffe27a';
        g.font = '800 54px "Trebuchet MS", system-ui, sans-serif';
        g.fillText(String(st.value), x, boxY + 74);
        g.fillStyle = 'rgba(255,255,255,.7)';
        g.font = '600 24px "Trebuchet MS", system-ui, sans-serif';
        g.fillText(st.label.toUpperCase(), x, boxY + 112);
      });
    }

    // --- date
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.font = '500 28px "Trebuchet MS", system-ui, sans-serif';
    g.fillText(prettyDate(badge.date), cx, 1272);

    return c;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function wrap(g, text, cx, y, maxW, lh) {
    var words = String(text).split(' '), line = '', lines = [];
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; }
      else line = t;
    });
    if (line) lines.push(line);
    lines.forEach(function (l, i) { g.fillText(l, cx, y + i * lh); });
    return lines.length;
  }

  function prettyDate(d) {
    var dt = d ? new Date(String(d).replace(/-/g, '/')) : new Date();
    if (isNaN(dt)) dt = new Date();
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h & 0x7fffffff;
  }

  /* --------------------------- the message -------------------------- */
  function messageFor(badge, who) {
    var lines = [
      (who || 'Chance') + ' just earned the "' + (badge.name || 'Great Work') + '" badge at Chance Academy!'
    ];
    if (badge.blurb) lines.push(badge.blurb);
    if (window.Progress) {
      var t = Progress.data.totals;
      lines.push('⭐ ' + t.stars + ' stars · 💎 ' + t.gems + ' perfect missions · 🔥 ' + Progress.data.streak.count + '-day streak');
    }
    lines.push('— sent from Chance Academy');
    return lines.join('\n');
  }

  function toBlob(canvas) {
    return new Promise(function (res) {
      if (canvas.toBlob) canvas.toBlob(function (b) { res(b); }, 'image/png');
      else res(dataURLtoBlob(canvas.toDataURL('image/png')));
    });
  }
  function dataURLtoBlob(u) {
    var parts = u.split(','), bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], { type: 'image/png' });
  }

  function fileName(badge) {
    return 'chance-' + String(badge.name || 'badge').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
  }

  /* Share sheet with the real image attached (iPad: Messages, Mail,
     AirDrop, Photos, Notes...). Returns 'shared' | 'fallback'. */
  function share(badge, canvas, who) {
    var text = messageFor(badge, who);
    return toBlob(canvas).then(function (blob) {
      var file = null;
      try { file = new File([blob], fileName(badge), { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: badge.name, text: text })
          .then(function () { return 'shared'; })
          .catch(function () { return 'cancelled'; });
      }
      if (navigator.share) {
        return navigator.share({ title: badge.name, text: text })
          .then(function () { return 'shared-text'; })
          .catch(function () { return 'cancelled'; });
      }
      return 'fallback';
    });
  }

  function download(badge, canvas) {
    return toBlob(canvas).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName(badge);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return 'saved';
    });
  }

  function textIt(badge, who) {
    var body = encodeURIComponent(messageFor(badge, who));
    // iOS wants sms:&body=, Android wants sms:?body=
    var ios = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent);
    location.href = 'sms:' + (ios ? '&' : '?') + 'body=' + body;
  }

  function emailIt(badge, who) {
    var subj = encodeURIComponent((who || 'Chance') + ' earned a badge: ' + (badge.name || ''));
    var body = encodeURIComponent(messageFor(badge, who) + '\n\n(Tap Share in the app to send the picture too.)');
    location.href = 'mailto:?subject=' + subj + '&body=' + body;
  }

  function copyIt(badge, who) {
    var t = messageFor(badge, who);
    if (navigator.clipboard) return navigator.clipboard.writeText(t).then(function () { return true; }).catch(function () { return false; });
    return Promise.resolve(false);
  }

  return {
    drawCard: drawCard, share: share, download: download,
    textIt: textIt, emailIt: emailIt, copyIt: copyIt,
    messageFor: messageFor, toBlob: toBlob
  };
})();


/* ===== js/stations.js ===== */
/* ============================================================
   stations.js — the three stops in every mission

   🔭 discover : narrated science idea + one reasoning check
   🔢 numbers  : three real-world problems
   📖 reading  : phonics words said out loud, a sentence, and a
                 comprehension question about the science

   House rules, enforced here in code:
   - Every question's choices are SHUFFLED. The correct answer is
     written first in the data files, and a kid will spot that
     inside a week.
   - A wrong answer is never a dead end and never says "wrong".
     The owl coaches with a line aimed at that specific thinking
     error, and he tries again.
   - Third miss gets a scaffold: two choices fade out and the
     reasoning is walked through, then he still taps the answer
     himself so his hand ends on the right one.
   - Nothing is timed on screen. The evaluator times him quietly
     to spot guessing, but a clock would just add stress.
   ============================================================ */

window.Stations = (function () {

  var stage, current = null;

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ------------------------------------------------------------
     ask() — one multiple-choice item, start to finish.
     Resolves when he has landed on the correct answer.
     ------------------------------------------------------------ */
  function ask(item, meta) {
    return new Promise(function (resolve) {
      var card = el('div', 'card');

      if (item.story) {
        var s = el('div', 'story', item.story);
        card.appendChild(s);
      }
      var q = el('div', 'qtext', item.q);
      card.appendChild(q);

      var wrap = el('div', 'choices');
      var order = shuffle(item.choices);
      var buttons = [];
      var attempt = 0;
      var t0 = Date.now();
      var solved = false;

      order.forEach(function (ch) {
        var b = el('button', 'choice');
        b.appendChild(el('span', 'pick', '○'));
        b.appendChild(el('span', 'txt', ch.t));
        b.addEventListener('click', function () { pick(ch, b); });
        wrap.appendChild(b);
        buttons.push({ b: b, ch: ch });
      });
      card.appendChild(wrap);
      stage.appendChild(card);

      // read the whole item aloud, then let him answer. meta.spoken
      // lets a caller supply a say-able version — "7 times 8" reads
      // properly where the written "7 × 8" would not.
      var spoken = [item.story, meta.spoken || item.q].filter(Boolean).concat(order.map(function (c, i) {
        return (i + 1) + '. ' + c.t;
      }));
      App.setReplay(function () { Voice.stop(); Voice.sayLines(spoken); });
      Voice.sayLines(spoken).then(function () { t0 = Date.now(); });

      function pick(ch, btn) {
        if (solved) return;
        attempt++;
        var ms = Date.now() - t0;
        Voice.stop();

        var v = Evaluate.judge({
          itemId: meta.itemId, station: meta.station, domain: meta.domain,
          dayId: meta.dayId, choice: ch, attempt: attempt, ms: ms, item: item
        });
        App.setThinkMeter(v.focus);

        if (v.correct) {
          solved = true;
          btn.classList.add('right');
          btn.querySelector('.pick').textContent = '⭐';
          buttons.forEach(function (o) { o.b.disabled = true; if (o.b !== btn) o.b.classList.add('faded'); });
          App.showCoach(v.speak, 'good');
          App.burst(6);

          if (item.show) {
            var sw = el('div', 'showwork');
            sw.appendChild(el('b', null, 'HOW IT WORKS'));
            sw.appendChild(el('span', null, item.show));
            card.appendChild(sw);
            Voice.say(v.speak).then(function () { return Voice.say(item.show); });
          } else {
            Voice.say(v.speak);
          }
          App.setActions([{ label: 'Next', em: '➡️', cls: '', fn: function () { App.hideCoach(); resolve(); } }]);
          return;
        }

        // --- not correct: coach, keep going
        btn.classList.add('rethink');
        btn.querySelector('.pick').textContent = '🤔';
        App.showCoach(v.speak, v.tone);
        Voice.say(v.speak);

        if (v.eliminate) {
          // fade two wrong ones so only the answer and one distractor remain
          var wrongs = buttons.filter(function (o) { return !o.ch.correct && o.b !== btn; });
          shuffle(wrongs).slice(0, Math.max(0, wrongs.length - 1)).forEach(function (o) {
            o.b.classList.add('faded'); o.b.disabled = true;
          });
        }
        if (v.reveal) {
          var right = buttons.filter(function (o) { return o.ch.correct; })[0];
          if (right) {
            right.b.classList.add('right');
            right.b.querySelector('.pick').textContent = '👉';
            buttons.forEach(function (o) { if (!o.ch.correct) { o.b.disabled = true; o.b.classList.add('faded'); } });
            Voice.say(Phrases.tapTheAnswer);
          }
        }
        t0 = Date.now();
      }
    });
  }

     🔢 NUMBERS
