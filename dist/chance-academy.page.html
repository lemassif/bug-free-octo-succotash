    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (x.getDay() + 6) % 7;             // Mon = 0
    x.setDate(x.getDate() - dow);
    return x.getFullYear() + '-W' + iso(x).slice(5);
  }
  function monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

  function daysDoneIn(keyFn, key) {
    var seen = {};
    Object.keys(data.days).forEach(function (id) {
      var rec = data.days[id];
      if (!rec.done || !rec.date) return;
      if (keyFn(parseIso(rec.date)) === key) seen[rec.date] = true;
    });
    return Object.keys(seen).length;
  }

  function weekProgress() {
    var n = daysDoneIn(weekKey, weekKey());
    return { done: n, goal: 5, pct: Math.min(100, Math.round(100 * n / 5)), met: n >= 5 };
  }
  function monthProgress() {
    var n = daysDoneIn(monthKey, monthKey());
    return { done: n, goal: 20, pct: Math.min(100, Math.round(100 * n / 20)), met: n >= 20 };
  }

  /* ------------------------------ badges --------------------------- */
  /* Weekly badges are themed to the week's science so the reward
     means something — "you earned the Moon Watcher patch" beats
     "you earned badge 3". Curriculum supplies the names. */
  var MILESTONES = [
    { id: 'first-day',   em: '🌟', name: 'Launch Day',        test: function (d) { return countDone() >= 1; },  blurb: 'Finished your very first mission.' },
    { id: 'streak-3',    em: '🔥', name: '3-Day Streak',      test: function (d) { return d.streak.count >= 3; }, blurb: 'Three days in a row.' },
    { id: 'streak-5',    em: '⚡', name: '5-Day Streak',      test: function (d) { return d.streak.count >= 5; }, blurb: 'Five days in a row.' },
    { id: 'streak-10',   em: '🏅', name: '10-Day Streak',     test: function (d) { return d.streak.count >= 10; }, blurb: 'Ten days without missing.' },
    { id: 'stars-25',    em: '✨', name: '25 Stars',          test: function (d) { return d.totals.stars >= 25; }, blurb: 'Twenty-five stars collected.' },
    { id: 'stars-100',   em: '🌠', name: '100 Stars',         test: function (d) { return d.totals.stars >= 100; }, blurb: 'One hundred stars. That is a lot of thinking.' },
    { id: 'gems-5',      em: '💎', name: 'Clear Thinker',     test: function (d) { return d.totals.gems >= 5; }, blurb: 'Five perfect first-try missions.' },
    { id: 'gems-15',     em: '👑', name: 'Master Reasoner',   test: function (d) { return d.totals.gems >= 15; }, blurb: 'Fifteen perfect missions.' },
    { id: 'words-50',    em: '🗣️', name: 'Word Sayer',        test: function (d) { return d.totals.wordsSpoken >= 50; }, blurb: 'Read fifty words out loud.' },
    { id: 'words-200',   em: '📣', name: 'Out-Loud Reader',   test: function (d) { return d.totals.wordsSpoken >= 200; }, blurb: 'Two hundred words read out loud.' },
    { id: 'unit-1',      em: '🚀', name: 'Space Explorer',    test: function () { return unitDone(1); }, blurb: 'Completed every Space mission.' },
    { id: 'unit-2',      em: '🦎', name: 'Field Scientist',   test: function () { return unitDone(2); }, blurb: 'Completed every Woods & Water mission.' },
    { id: 'unit-3',      em: '⚙️', name: 'Engineer',          test: function () { return unitDone(3); }, blurb: 'Completed every Forces & Machines mission.' }
  ];

  function countDone() {
    return Object.keys(data.days).filter(function (k) { return data.days[k].done; }).length;
  }
  function unitDone(n) {
    if (!window.Curriculum) return false;
    var ds = Curriculum.daysInUnit(n);
    return ds.length > 0 && ds.every(function (d) { return isDayDone(d.id); });
  }

  function awardBadge(id, em, name, blurb) {
    if (data.badges[id]) return null;
    data.badges[id] = { date: today(), em: em, name: name, blurb: blurb || '' };
    save();
    return data.badges[id];
  }

  function checkBadges() {
    var fresh = [];
    MILESTONES.forEach(function (m) {
      if (!data.badges[m.id] && m.test(data)) {
        var b = awardBadge(m.id, m.em, m.name, m.blurb);
        if (b) fresh.push(Object.assign({ id: m.id }, b));
      }
    });
    // weekly
    var wp = weekProgress();
    if (wp.met) {
      var wk = weekKey();
      var theme = window.Curriculum ? Curriculum.weekBadgeForDate() : { em: '🗓️', name: 'Week Complete' };
      var b2 = awardBadge('week-' + wk, theme.em, theme.name, 'Five mission days in one week.');
      if (b2) fresh.push(Object.assign({ id: 'week-' + wk }, b2));
    }
    // monthly
    var mp = monthProgress();
    if (mp.met) {
      var b3 = awardBadge('month-' + monthKey(), '🎖️', 'Monthly Mission Patch', 'Twenty mission days in one month.');
      if (b3) fresh.push(Object.assign({ id: 'month-' + monthKey() }, b3));
    }
    return fresh;
  }

  /* ---------------------------- recording -------------------------- */
  function logEvent(ev) {
    data.log.push(ev);
    // Only spoken phonics words count toward "words read aloud" —
    // the comprehension question is a tap, not a word.
    if (ev.domain === 'phonics' && ev.correct) data.totals.wordsSpoken++;
    if (data.log.length > LOG_CAP) data.log.splice(0, data.log.length - LOG_CAP);
    save();
  }

  function completeStation(dayId, station) {
    var k = dayId + ':' + station;
    var firstTime = !data.stations[k];
    if (firstTime) {
      data.stations[k] = today();
      data.totals.stars++;
      save();
    }
    return { star: firstTime, stars: data.totals.stars };
  }

  function stationDone(dayId, station) { return !!data.stations[dayId + ':' + station]; }

  function dayStationsDone(dayId) {
    return ['discover', 'numbers', 'reading'].filter(function (s) { return stationDone(dayId, s); });
  }

  function isDayDone(dayId) { return !!(data.days[dayId] && data.days[dayId].done); }

  /* Called when all three stations of a day are finished. */
  function completeDay(dayId, summary) {
    var already = isDayDone(dayId);
    var rec = data.days[dayId] || {};
    rec.done = true;
    rec.date = rec.date || today();
    rec.stars = 3;
    rec.firstTryPct = summary ? summary.firstTryPct : rec.firstTryPct || 0;
    if (summary && summary.cleanRun && !rec.gem) { rec.gem = true; data.totals.gems++; }
    data.days[dayId] = rec;

    if (!already) {
      data.totals.sessions++;
      bumpStreak();
    }
    save();
    return { fresh: !already, badges: checkBadges(), gem: !!rec.gem };
  }

  function bumpStreak() {
    var t = today();
    if (data.streak.last === t) return;
    var y = new Date(); y.setDate(y.getDate() - 1);
    data.streak.count = (data.streak.last === iso(y)) ? data.streak.count + 1 : 1;
    data.streak.last = t;
    if (data.streak.count > data.streak.best) data.streak.best = data.streak.count;
  }

  /* ------------------------- what to do today ---------------------- */
  /* The next unfinished day in curriculum order. If he finished
     today's mission he can keep going — nothing is locked, because
     locking a curious kid out is the opposite of the point. */
  function nextDay() {
    if (!window.Curriculum) return null;
    var all = Curriculum.allDays();
    for (var i = 0; i < all.length; i++) {
      if (!isDayDone(all[i].id)) return all[i];
    }
    return all[all.length - 1];
  }

  function badgeList() {
    return Object.keys(data.badges).map(function (id) {
      return Object.assign({ id: id }, data.badges[id]);
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function lockedMilestones() {
    return MILESTONES.filter(function (m) { return !data.badges[m.id]; });
  }

  function reset() {
    data = {
      name: data.name, days: {}, stations: {}, log: [], badges: {},
      streak: { count: 0, best: 0, last: null },
      totals: { stars: 0, gems: 0, wordsSpoken: 0, sessions: 0 }
    };
    save();
  }

  return {
    get data() { return data; },
    save: save, today: today, weekKey: weekKey, monthKey: monthKey,
    weekProgress: weekProgress, monthProgress: monthProgress,
    logEvent: logEvent, completeStation: completeStation, stationDone: stationDone,
    dayStationsDone: dayStationsDone, completeDay: completeDay, isDayDone: isDayDone,
    countDone: countDone, nextDay: nextDay, badgeList: badgeList,
    lockedMilestones: lockedMilestones, checkBadges: checkBadges, reset: reset,
    setName: function (n) { data.name = n || 'Chance'; save(); }
  };
})();


/* ===== js/rewards.js ===== */
/* ============================================================
   rewards.js — draws the reward card and gets it off the iPad

   Grandpa's ask: when Chance earns something, he should be able to
   send it to family. So every badge becomes a real PNG image drawn
   here on a canvas, and then:

     Share   -> navigator.share() with the actual image file. On
                iPad this opens the iOS share sheet, so Messages,
                Mail, AirDrop and Photos all work in one tap and
                the picture really is attached.
     Save    -> downloads the PNG (Files / Photos).
     Text    -> sms: link pre-filled with the achievement text.
     Email   -> mailto: link pre-filled, with the text.

   sms: and mailto: links cannot carry an attachment — that is an
   iOS limitation, not a choice — so those two send the words and
   we tell the user to use Share if they want the picture.
   ============================================================ */

window.Rewards = (function () {

  var W = 1080, H = 1350;

  function drawCard(badge, stats) {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');

    // --- night sky background, because everything started with the solar system
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#132f54');
    sky.addColorStop(0.55, '#0f2a4a');
    sky.addColorStop(1, '#091a2f');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // stars — seeded so a badge always looks the same when re-shared
    var seed = hash(badge.id || badge.name || 'x');
    for (var i = 0; i < 90; i++) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      var x = (seed % W), y = ((seed >> 7) % (H - 380));
      var r = ((seed >> 3) % 3) + 1;
      g.globalAlpha = 0.25 + ((seed >> 11) % 60) / 100;
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;

    // --- header
    g.textAlign = 'center';
    g.fillStyle = '#ffc93c';
    g.font = '800 40px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('CHANCE ACADEMY', W / 2, 118);
    g.fillStyle = 'rgba(255,255,255,.66)';
    g.font = '600 28px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('Science · Numbers · Reading', W / 2, 162);

    // --- medallion
    var cx = W / 2, cy = 470, R = 210;
    var ring = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    ring.addColorStop(0, '#ffe27a');
    ring.addColorStop(0.5, '#ffc93c');
    ring.addColorStop(1, '#f5a524');
    g.fillStyle = ring;
    g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill();
    g.fillStyle = '#0f2a4a';
    g.beginPath(); g.arc(cx, cy, R - 26, 0, 6.283); g.fill();

    // sunburst points
    g.save();
    g.translate(cx, cy);
    g.fillStyle = 'rgba(255,201,60,.9)';
    for (var s = 0; s < 16; s++) {
      g.rotate(6.283 / 16);
      g.beginPath();
      g.moveTo(-14, -R - 6); g.lineTo(14, -R - 6); g.lineTo(0, -R - 42);
      g.closePath(); g.fill();
    }
    g.restore();

    // the badge emoji, dead centre
    g.font = '200px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    g.textBaseline = 'middle';
    g.fillText(badge.em || '⭐', cx, cy + 8);
    g.textBaseline = 'alphabetic';

    // --- who and what
    g.fillStyle = '#ffffff';
    g.font = '800 66px "Trebuchet MS", system-ui, sans-serif';
    wrap(g, badge.name || 'Great Work', cx, 790, W - 140, 74);

    g.fillStyle = '#ffc93c';
    g.font = '700 40px "Trebuchet MS", system-ui, sans-serif';
    g.fillText('earned by ' + (badge.who || 'Chance'), cx, 890);

    if (badge.blurb) {
      g.fillStyle = 'rgba(255,255,255,.8)';
      g.font = '400 32px "Trebuchet MS", system-ui, sans-serif';
      wrap(g, badge.blurb, cx, 950, W - 200, 42);
    }

    // --- stats strip
    if (stats && stats.length) {
      var boxY = 1050, boxH = 150, pad = 70;
      g.fillStyle = 'rgba(255,255,255,.08)';
      roundRect(g, pad, boxY, W - pad * 2, boxH, 28);
      g.fill();
      var each = (W - pad * 2) / stats.length;
      stats.forEach(function (st, i) {
        var x = pad + each * i + each / 2;
        g.fillStyle = '#ffe27a';
        g.font = '800 54px "Trebuchet MS", system-ui, sans-serif';
        g.fillText(String(st.value), x, boxY + 74);
        g.fillStyle = 'rgba(255,255,255,.7)';
        g.font = '600 24px "Trebuchet MS", system-ui, sans-serif';
        g.fillText(st.label.toUpperCase(), x, boxY + 112);
      });
    }

    // --- date
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.font = '500 28px "Trebuchet MS", system-ui, sans-serif';
    g.fillText(prettyDate(badge.date), cx, 1272);

    return c;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function wrap(g, text, cx, y, maxW, lh) {
    var words = String(text).split(' '), line = '', lines = [];
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; }
      else line = t;
    });
    if (line) lines.push(line);
    lines.forEach(function (l, i) { g.fillText(l, cx, y + i * lh); });
    return lines.length;
  }

  function prettyDate(d) {
    var dt = d ? new Date(String(d).replace(/-/g, '/')) : new Date();
    if (isNaN(dt)) dt = new Date();
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h & 0x7fffffff;
  }

  /* --------------------------- the message -------------------------- */
  function messageFor(badge, who) {
    var lines = [
      (who || 'Chance') + ' just earned the "' + (badge.name || 'Great Work') + '" badge at Chance Academy!'
    ];
    if (badge.blurb) lines.push(badge.blurb);
    if (window.Progress) {
      var t = Progress.data.totals;
      lines.push('⭐ ' + t.stars + ' stars · 💎 ' + t.gems + ' perfect missions · 🔥 ' + Progress.data.streak.count + '-day streak');
    }
    lines.push('— sent from Chance Academy');
    return lines.join('\n');
  }

  function toBlob(canvas) {
    return new Promise(function (res) {
      if (canvas.toBlob) canvas.toBlob(function (b) { res(b); }, 'image/png');
      else res(dataURLtoBlob(canvas.toDataURL('image/png')));
    });
  }
  function dataURLtoBlob(u) {
    var parts = u.split(','), bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], { type: 'image/png' });
  }

  function fileName(badge) {
    return 'chance-' + String(badge.name || 'badge').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
  }

  /* Share sheet with the real image attached (iPad: Messages, Mail,
     AirDrop, Photos, Notes...). Returns 'shared' | 'fallback'. */
  function share(badge, canvas, who) {
    var text = messageFor(badge, who);
    return toBlob(canvas).then(function (blob) {
      var file = null;
      try { file = new File([blob], fileName(badge), { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: badge.name, text: text })
          .then(function () { return 'shared'; })
          .catch(function () { return 'cancelled'; });
      }
      if (navigator.share) {
        return navigator.share({ title: badge.name, text: text })
          .then(function () { return 'shared-text'; })
          .catch(function () { return 'cancelled'; });
      }
      return 'fallback';
    });
  }

  function download(badge, canvas) {
    return toBlob(canvas).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName(badge);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return 'saved';
    });
  }

  function textIt(badge, who) {
    var body = encodeURIComponent(messageFor(badge, who));
    // iOS wants sms:&body=, Android wants sms:?body=
    var ios = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent);
    location.href = 'sms:' + (ios ? '&' : '?') + 'body=' + body;
  }

  function emailIt(badge, who) {
    var subj = encodeURIComponent((who || 'Chance') + ' earned a badge: ' + (badge.name || ''));
    var body = encodeURIComponent(messageFor(badge, who) + '\n\n(Tap Share in the app to send the picture too.)');
    location.href = 'mailto:?subject=' + subj + '&body=' + body;
  }

  function copyIt(badge, who) {
    var t = messageFor(badge, who);
    if (navigator.clipboard) return navigator.clipboard.writeText(t).then(function () { return true; }).catch(function () { return false; });
    return Promise.resolve(false);
  }

  return {
    drawCard: drawCard, share: share, download: download,
    textIt: textIt, emailIt: emailIt, copyIt: copyIt,
    messageFor: messageFor, toBlob: toBlob
  };
})();


/* ===== js/stations.js ===== */
/* ============================================================
   stations.js — the three stops in every mission

   🔭 discover : narrated science idea + one reasoning check
   🔢 numbers  : three real-world problems
   📖 reading  : phonics words said out loud, a sentence, and a
                 comprehension question about the science

   House rules, enforced here in code:
   - Every question's choices are SHUFFLED. The correct answer is
     written first in the data files, and a kid will spot that
     inside a week.
   - A wrong answer is never a dead end and never says "wrong".
     The owl coaches with a line aimed at that specific thinking
     error, and he tries again.
   - Third miss gets a scaffold: two choices fade out and the
     reasoning is walked through, then he still taps the answer
     himself so his hand ends on the right one.
   - Nothing is timed on screen. The evaluator times him quietly
     to spot guessing, but a clock would just add stress.
   ============================================================ */

window.Stations = (function () {

  var stage, current = null;

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ------------------------------------------------------------
     ask() — one multiple-choice item, start to finish.
     Resolves when he has landed on the correct answer.
     ------------------------------------------------------------ */
  function ask(item, meta) {
    return new Promise(function (resolve) {
      var card = el('div', 'card');

      if (item.story) {
        var s = el('div', 'story', item.story);
        card.appendChild(s);
      }
      var q = el('div', 'qtext', item.q);
      card.appendChild(q);

      var wrap = el('div', 'choices');
      var order = shuffle(item.choices);
      var buttons = [];
      var attempt = 0;
      var t0 = Date.now();
      var solved = false;

      order.forEach(function (ch) {
        var b = el('button', 'choice');
        b.appendChild(el('span', 'pick', '○'));
        b.appendChild(el('span', 'txt', ch.t));
        b.addEventListener('click', function () { pick(ch, b); });
        wrap.appendChild(b);
        buttons.push({ b: b, ch: ch });
      });
      card.appendChild(wrap);
      stage.appendChild(card);

      // read the whole item aloud, then let him answer
      var spoken = [item.story, item.q].filter(Boolean).concat(order.map(function (c, i) {
        return (i + 1) + '. ' + c.t;
      }));
      App.setReplay(function () { Voice.stop(); Voice.sayLines(spoken); });
      Voice.sayLines(spoken).then(function () { t0 = Date.now(); });

      function pick(ch, btn) {
        if (solved) return;
        attempt++;
        var ms = Date.now() - t0;
        Voice.stop();

        var v = Evaluate.judge({
          itemId: meta.itemId, station: meta.station, domain: meta.domain,
          dayId: meta.dayId, choice: ch, attempt: attempt, ms: ms, item: item
        });
        App.setThinkMeter(v.focus);

        if (v.correct) {
          solved = true;
          btn.classList.add('right');
          btn.querySelector('.pick').textContent = '⭐';
          buttons.forEach(function (o) { o.b.disabled = true; if (o.b !== btn) o.b.classList.add('faded'); });
          App.showCoach(v.speak, 'good');
          App.burst(6);

          if (item.show) {
            var sw = el('div', 'showwork');
            sw.appendChild(el('b', null, 'HOW IT WORKS'));
            sw.appendChild(el('span', null, item.show));
            card.appendChild(sw);
            Voice.say(v.speak).then(function () { return Voice.say(item.show); });
          } else {
            Voice.say(v.speak);
          }
          App.setActions([{ label: 'Next', em: '➡️', cls: '', fn: function () { App.hideCoach(); resolve(); } }]);
          return;
        }

        // --- not correct: coach, keep going
        btn.classList.add('rethink');
        btn.querySelector('.pick').textContent = '🤔';
        App.showCoach(v.speak, v.tone);
        Voice.say(v.speak);

        if (v.eliminate) {
          // fade two wrong ones so only the answer and one distractor remain
          var wrongs = buttons.filter(function (o) { return !o.ch.correct && o.b !== btn; });
          shuffle(wrongs).slice(0, Math.max(0, wrongs.length - 1)).forEach(function (o) {
            o.b.classList.add('faded'); o.b.disabled = true;
          });
        }
        if (v.reveal) {
          var right = buttons.filter(function (o) { return o.ch.correct; })[0];
          if (right) {
            right.b.classList.add('right');
            right.b.querySelector('.pick').textContent = '👉';
            buttons.forEach(function (o) { if (!o.ch.correct) { o.b.disabled = true; o.b.classList.add('faded'); } });
            Voice.say(Phrases.tapTheAnswer);
          }
        }
        t0 = Date.now();
      }
    });
  }

  /* ------------------------------------------------------------
     🔭 DISCOVER
     ------------------------------------------------------------ */
  function discover(day) {
    var d = day.discover;
    stage.innerHTML = '';
    App.setPips(0, 2);

    var card = el('div', 'card');
    var head = el('div', 'card-head');
    head.appendChild(el('span', 'em', day.icon));
    var ht = el('div');
    ht.appendChild(el('span', 'tag', 'SCIENCE · ' + day.weekTitle.toUpperCase()));
    ht.appendChild(el('h3', null, day.title));
    head.appendChild(ht);
    card.appendChild(head);

    var lines = el('div', 'lines');
    var ps = d.intro.map(function (t) { var p = el('p', null, t); lines.appendChild(p); return p; });
    card.appendChild(lines);

    if (d.word) {
      var bw = el('div', 'bigword');
      bw.appendChild(el('span', 'em', '💬'));
      var box = el('div');
      box.appendChild(el('div', 'w', d.word.w));
      box.appendChild(el('div', 'say', d.word.say));
      box.appendChild(el('div', 'mean', d.word.mean));
      bw.appendChild(box);
      var sp = el('button', 'icon-btn', '🔊');
      sp.addEventListener('click', function () {
        Voice.stop();
        Voice.say(d.word.w + '. ' + d.word.say + '. It means ' + d.word.mean + '.');
      });
      bw.appendChild(sp);
      card.appendChild(bw);
    }
    stage.appendChild(card);

    function readAll() {
      Voice.stop();
      return Voice.sayLines(d.intro, function (i) {
        ps.forEach(function (p, k) { p.classList.toggle('said', k === i); });
      }).then(function () {
        if (d.word) return Voice.say('Big word: ' + d.word.w + '. ' + d.word.mean + '.');
      });
    }
    App.setReplay(readAll);
    readAll();

    App.setActions([{
      label: 'Question time', em: '🤔', cls: 'sun', fn: function () {
        Voice.stop();
        App.setPips(1, 2);
        stage.innerHTML = '';
        var t = el('div', 'card-head');
        t.appendChild(el('span', 'em', '🤔'));
        var th = el('div');
        th.appendChild(el('span', 'tag', 'THINK IT THROUGH'));
        th.appendChild(el('h3', null, day.title));
        t.appendChild(th);
        stage.appendChild(t);
        App.setActions([]);
        ask(d.check, { itemId: day.id + '-check', station: 'discover', domain: 'science', dayId: day.id })
          .then(function () { App.setPips(2, 2); finish(day, 'discover'); });
      }
    }]);
  }

  /* ------------------------------------------------------------
     🔢 NUMBERS
     ------------------------------------------------------------ */
  function numbers(day) {
    var probs = day.numbers.problems;
    var i = 0;
    stage.innerHTML = '';

    function nextProblem() {
      App.setPips(i, probs.length);
      stage.innerHTML = '';
      var head = el('div', 'card-head');
      head.appendChild(el('span', 'em', '🔢'));
      var ht = el('div');
      ht.appendChild(el('span', 'tag', 'NUMBERS · PROBLEM ' + (i + 1) + ' OF ' + probs.length));
      ht.appendChild(el('h3', null, day.title));
      head.appendChild(ht);
      stage.appendChild(head);
      App.setActions([]);

      ask(probs[i], {
        itemId: day.id + '-n' + i, station: 'numbers',
        domain: day.numbers.domain, dayId: day.id
      }).then(function () {
        i++;
        App.setPips(i, probs.length);
        if (i < probs.length) nextProblem();
        else finish(day, 'numbers');
      });
    }
    nextProblem();
  }

  /* ------------------------------------------------------------
     📖 READ & SAY  (phonics, out loud, with the microphone)
     ------------------------------------------------------------ */
  function reading(day) {
    var r = day.reading;
    var wi = 0;
    stage.innerHTML = '';

    function wordStep() {
      App.setPips(wi, r.words.length + 2);
      var word = r.words[wi];
      stage.innerHTML = '';

      var card = el('div', 'card');
      var head = el('div', 'card-head');
      head.appendChild(el('span', 'em', '📖'));
      var ht = el('div');
      ht.appendChild(el('span', 'tag', 'READ & SAY · ' + (day.phonicsFocus || '').toUpperCase()));
      ht.appendChild(el('h3', null, 'Word ' + (wi + 1) + ' of ' + r.words.length));
      head.appendChild(ht);
      card.appendChild(head);

      var hero = el('div', 'word-hero');
      var wordRow = el('div', 'word');
      var chunkEls = word.parts.map(function (p, idx) {
        var c = el('span', 'chunk', p);
        c.addEventListener('click', function () {
          Voice.stop();
          light(idx);
          // "f, like in fan" — or Grandpa's recorded /f/ if it exists
          Voice.sayChunk(p, word.w, idx).then(function () { light(-1); });
        });
        wordRow.appendChild(c);
        return c;
      });
      hero.appendChild(wordRow);
      if (word.mean) hero.appendChild(el('div', 'say', word.mean));
      card.appendChild(hero);

      function light(k) {
        chunkEls.forEach(function (c, idx) { c.classList.toggle('lit', idx === k); });
      }

      var micRow = el('div', 'mic-row');
      var hearBtn = el('button', 'icon-btn', '🔊');
      hearBtn.setAttribute('aria-label', 'Hear the word');
      var slowBtn = el('button', 'icon-btn', '🐢');
      slowBtn.setAttribute('aria-label', 'Sound it out slowly');
      var mic = el('button', 'mic-btn', '🎤');
      mic.setAttribute('aria-label', 'Say the word');
      micRow.appendChild(hearBtn);
      micRow.appendChild(mic);
      micRow.appendChild(slowBtn);
      card.appendChild(micRow);

      var heard = el('div', 'heard', Voice.canListen() ? 'Tap the microphone and say the word.' : 'Tap 🐢 to hear the sounds, then say it out loud.');
      card.appendChild(heard);
      stage.appendChild(card);

      function sayWord() { Voice.stop(); return Voice.say(word.w, { rate: 0.72 }); }
      function soundOut() {
        Voice.stop();
        return Voice.soundOut(word.w, word.parts, light);
      }
      hearBtn.addEventListener('click', sayWord);
      slowBtn.addEventListener('click', soundOut);
      App.setReplay(soundOut);

      var attempt = 0;
      mic.addEventListener('click', function () {
        if (!Voice.canListen()) {
          soundOut().then(function () {
            heard.innerHTML = 'Now you say it out loud, then tap <b>I said it</b>.';
          });
          return;
        }
        Voice.stop();
        attempt++;
        mic.classList.add('live');
        heard.textContent = 'Listening…';
        var t0 = Date.now();
        Voice.listen({
          ms: 5000,
          onInterim: function (txt) { heard.innerHTML = 'I hear: <b>' + txt + '</b>'; }
        }).then(function (res) {
          mic.classList.remove('live');
          if (res.reason === 'denied' || res.reason === 'unsupported') {
            heard.textContent = 'Microphone is off. Tap 🐢 and say it out loud instead.';
            return;
          }
          var conf = Voice.match(word.w, res.transcript, res.alternatives);
          var v = Evaluate.judgeSpoken({
            word: word.w, parts: word.parts, confidence: conf, attempt: attempt,
            heard: res.transcript, ms: Date.now() - t0, itemId: day.id + '-w' + wi
          });
          App.setThinkMeter(v.focus);
          App.showCoach(v.speak, v.tone);

          if (v.correct) {
            heard.innerHTML = '✅ <b>' + word.w + '</b> — that is it!';
            chunkEls.forEach(function (c) { c.classList.add('lit'); });
            App.burst(5);
            Voice.say(v.speak).then(function () { App.hideCoach(); advance(); });
          } else {
            heard.innerHTML = res.transcript ? 'I heard: <b>' + res.transcript + '</b>' : 'I did not catch that.';
            Voice.say(v.speak).then(function () {
              if (attempt >= 2) return soundOut();
            }).then(function () {
              if (attempt >= 3) {
                heard.innerHTML = 'Good trying. Tap <b>Next</b> — we will practice this one again on the Word Wall.';
                App.setActions([
                  { label: 'Try again', em: '🎤', cls: 'ghost', fn: function () { mic.click(); } },
                  { label: 'Next word', em: '➡️', cls: '', fn: function () { App.hideCoach(); advance(); } }
                ]);
              }
            });
          }
        });
      });

      /* "I said it" is the honour-system path: it exists so a dead
         microphone, a noisy room or a shy morning never blocks the
         lesson. It still credits the word so the Word Sayer badge is
         reachable without the mic, but it is logged as self-reported
         so the grown-up report does not mistake it for a checked
         pronunciation. */
      App.setActions([
        {
          label: 'I said it', em: '👍', cls: 'sun', fn: function () {
            // Only when the mic was never used on this word — otherwise
            // judgeSpoken already logged the real attempt and we would
            // be scoring the same word twice.
            if (attempt === 0 && !Progress.stationDone(day.id, 'reading')) {
              Progress.logEvent({
                t: Date.now(), dayId: day.id, itemId: day.id + '-w' + wi,
                station: 'reading', domain: 'phonics', correct: true,
                attempt: 1, ms: 0, flags: ['self-reported']
              });
            }
            App.hideCoach();
            advance();
          }
        }
      ]);

      soundOut();

      function advance() {
        wi++;
        if (wi < r.words.length) wordStep();
        else sentenceStep();
      }
    }

    /* the sentence: science vocabulary in a real sentence */
    function sentenceStep() {
      App.setPips(r.words.length, r.words.length + 2);
      stage.innerHTML = '';
      var card = el('div', 'card');
      var head = el('div', 'card-head');
      head.appendChild(el('span', 'em', '📚'));
      var ht = el('div');
      ht.appendChild(el('span', 'tag', 'READ THE SENTENCE'));
      ht.appendChild(el('h3', null, 'Point and read'));
      head.appendChild(ht);
      card.appendChild(head);

      var sent = el('div', 'sentence');
      var tokens = r.sentence.split(' ');
      var spans = tokens.map(function (w, i) {
        var s = el('span', null, w);
        s.addEventListener('click', function () {
          Voice.stop();
          spans.forEach(function (x) { x.classList.remove('lit'); });
          s.classList.add('lit');
          Voice.say(w.replace(/[^A-Za-z'-]/g, ''), { rate: 0.65 })
            .then(function () { s.classList.remove('lit'); });
        });
        sent.appendChild(s);
        if (i < tokens.length - 1) sent.appendChild(document.createTextNode(' '));
        return s;
      });
      card.appendChild(sent);
      card.appendChild(el('div', 'heard', 'Tap any word to hear just that word.'));
      stage.appendChild(card);

      function readSentence() {
        Voice.stop();
        var p = Promise.resolve();
        spans.forEach(function (s, i) {
          p = p.then(function () {
            spans.forEach(function (x) { x.classList.remove('lit'); });
            s.classList.add('lit');
            return Voice.say(tokens[i].replace(/[^A-Za-z'-]/g, ''), { rate: 0.8 });
          });
        });
        return p.then(function () {
          spans.forEach(function (x) { x.classList.remove('lit'); });
          return Voice.say(r.sentence, { rate: 0.85 });
        });
      }
      App.setReplay(readSentence);
      readSentence();

      App.setActions([
        { label: 'Hear it again', em: '🔊', cls: 'ghost', fn: readSentence },
        { label: 'I read it', em: '➡️', cls: '', fn: function () { Voice.stop(); compStep(); } }
      ]);
    }

    function compStep() {
      App.setPips(r.words.length + 1, r.words.length + 2);
      stage.innerHTML = '';
      var head = el('div', 'card-head');
      head.appendChild(el('span', 'em', '🧠'));
      var ht = el('div');
      ht.appendChild(el('span', 'tag', 'WHAT DID IT MEAN?'));
      ht.appendChild(el('h3', null, day.title));
      head.appendChild(ht);
      stage.appendChild(head);
      var box = el('div', 'story', r.sentence);
      stage.appendChild(box);
      App.setActions([]);
      ask(r.comp, { itemId: day.id + '-comp', station: 'reading', domain: 'comprehension', dayId: day.id })
        .then(function () {
          App.setPips(r.words.length + 2, r.words.length + 2);
          finish(day, 'reading');
        });
    }

    wordStep();
  }

  /* ------------------------------------------------------------
     end of a station
     ------------------------------------------------------------ */
  function finish(day, station) {
    var res = Progress.completeStation(day.id, station);
    var done = Progress.dayStationsDone(day.id);
    var summary = Evaluate.sessionSummary();
    App.stationFinished(day, station, res, done, summary);
  }

  /* ------------------------------------------------------------ */
  function run(day, station) {
    stage = document.getElementById('stage');
    current = { day: day, station: station };
    if (!Evaluate.currentSession() || Evaluate.currentSession().dayId !== day.id) {
      Evaluate.startSession(day.id);
    }
    App.setThinkMeter(Evaluate.currentSession().focus);
    if (station === 'discover') discover(day);
    else if (station === 'numbers') numbers(day);
    else reading(day);
  }

  return { run: run, ask: ask, current: function () { return current; } };
})();


/* ===== js/grownup.js ===== */
/* ============================================================
   grownup.js — the Thinking Report

   This is the part a classroom cannot give you. Every answer he
   taps is logged with the thinking error behind it, how long he
   took, and which try it was. This screen turns that log into
   plain sentences:

     "Sound on multiplication. Speed problems are the soft spot —
      he flipped the faster/slower relationship 5 times this week.
      Work on: practice 'faster means less time' with two real
      trips."

   It also holds the settings: the narration voice (soft female
   by default), his name on the reward cards, and a reset.
   ============================================================ */

window.Grownup = (function () {

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  var DOMAIN_NAMES = {
    science: 'Science reasoning',
    'time-distance-speed': 'Time, distance & speed',
    time: 'Time & clocks',
    geometry: 'Geometry & shape',
    algebra: 'Algebra & patterns',
    physics: 'Physics & forces',
    measure: 'Measuring & data',
    phonics: 'Phonics (spoken)',
    comprehension: 'Reading comprehension'
  };

  function render(body) {
    body.innerHTML = '';
    var log = Progress.data.log || [];
    var firstTries = log.filter(function (e) { return e.attempt === 1; });
    var correctFirst = firstTries.filter(function (e) { return e.correct; });
    var pct = firstTries.length ? Math.round(100 * correctFirst.length / firstTries.length) : 0;
    var times = firstTries.filter(function (e) { return e.ms > 0 && e.ms < 120000; }).map(function (e) { return e.ms; });

    /* ------------------------- headline stats ------------------------ */
    var stats = el('div', 'stat-row');
    [[Progress.countDone(), 'missions finished'],
     [pct + '%', 'right on first try'],
     [(median(times) / 1000).toFixed(1) + 's', 'typical think time'],
     [Progress.data.streak.count, 'day streak'],
     [Progress.data.streak.best, 'best streak'],
     [Progress.data.totals.wordsSpoken, 'words read aloud']].forEach(function (s) {
      var n = el('div', 'stat');
      n.appendChild(el('b', null, String(s[0])));
      n.appendChild(el('i', null, s[1]));
      stats.appendChild(n);
    });
    body.appendChild(stats);

    if (!log.length) {
      body.appendChild(el('p', null, 'No sessions yet. Once Chance finishes a mission, this page fills in with what his answers reveal about how he is thinking.'));
      body.appendChild(voiceBlock());
      body.appendChild(settingsBlock());
      return;
    }

    /* ---------------------- thinking habits (tags) ------------------- */
    var tagCounts = {};
    log.forEach(function (e) { if (e.tag) tagCounts[e.tag] = (tagCounts[e.tag] || 0) + 1; });
    var tags = Object.keys(tagCounts).sort(function (a, b) { return tagCounts[b] - tagCounts[a]; });

    body.appendChild(el('div', 'week-title', 'WHAT HIS WRONG ANSWERS ARE TELLING US'));
    if (!tags.length) {
      body.appendChild(item('good', 'No repeated thinking errors yet', 'Every miss so far has been a one-off, not a habit.'));
    }
    tags.slice(0, 6).forEach(function (t) {
      var info = Evaluate.tagInfo(t);
      var n = tagCounts[t];
      var cls = n >= 4 ? 'watch' : '';
      body.appendChild(item(cls,
        (info ? info.label : t) + ' — ' + n + ' time' + (n > 1 ? 's' : ''),
        info ? 'Work on: ' + info.fix : ''));
    });

    /* ------------------------ behaviour signals ---------------------- */
    var flagCounts = {};
    log.forEach(function (e) {
      (e.flags || []).forEach(function (f) { flagCounts[f] = (flagCounts[f] || 0) + 1; });
    });
    var behaviourKeys = Object.keys(flagCounts).filter(function (k) { return Evaluate.BEHAVIOR[k]; });
    if (behaviourKeys.length) {
      body.appendChild(el('div', 'week-title', 'HOW HE IS WORKING'));
      behaviourKeys.sort(function (a, b) { return flagCounts[b] - flagCounts[a]; }).forEach(function (k) {
        var info = Evaluate.BEHAVIOR[k];
        body.appendChild(item(flagCounts[k] >= 4 ? 'watch' : '',
          info.label + ' — ' + flagCounts[k] + ' time' + (flagCounts[k] > 1 ? 's' : ''),
          'What to do: ' + info.fix));
      });
    }

    /* -------------------------- by subject --------------------------- */
    body.appendChild(el('div', 'week-title', 'BY SUBJECT (first-try accuracy)'));
    var byDomain = {};
    firstTries.forEach(function (e) {
      var d = byDomain[e.domain] = byDomain[e.domain] || { n: 0, ok: 0, ms: [] };
      d.n++; if (e.correct) d.ok++; if (e.ms) d.ms.push(e.ms);
    });
    var tbl = el('table', 'tbl');
    var thead = el('tr');
    ['Subject', 'Items', 'First try', 'Think time'].forEach(function (h) { thead.appendChild(el('th', null, h)); });
    tbl.appendChild(thead);
    Object.keys(byDomain).sort(function (a, b) {
      return (byDomain[a].ok / byDomain[a].n) - (byDomain[b].ok / byDomain[b].n);
    }).forEach(function (d) {
      var x = byDomain[d];
      var tr = el('tr');
      tr.appendChild(el('td', null, DOMAIN_NAMES[d] || d));
      tr.appendChild(el('td', null, String(x.n)));
      tr.appendChild(el('td', null, Math.round(100 * x.ok / x.n) + '%'));
      tr.appendChild(el('td', null, (median(x.ms) / 1000).toFixed(1) + 's'));
      tbl.appendChild(tr);
    });
    body.appendChild(tbl);

    /* --------------------- words that need practice ------------------ */
    var wordTrouble = {};
    log.filter(function (e) { return e.station === 'reading' && e.domain === 'phonics' && !e.correct; })
      .forEach(function (e) {
        var id = e.itemId;
        wordTrouble[id] = (wordTrouble[id] || 0) + 1;
      });
    var troubled = Object.keys(wordTrouble).filter(function (k) { return wordTrouble[k] >= 2; });
    if (troubled.length) {
      body.appendChild(el('div', 'week-title', 'WORDS TO PRACTICE OUT LOUD'));
      var list = troubled.map(function (id) {
        var w = lookupWord(id);
        return w ? w.w + ' (' + w.parts.join('-') + ')' : id;
      });
      body.appendChild(item('', list.join(', '), 'These needed more than one try. The Word Wall tile replays each one, sound by sound.'));
    }

    /* --------------------------- last 7 days ------------------------- */
    body.appendChild(el('div', 'week-title', 'LAST 7 DAYS'));
    var days = {};
    Object.keys(Progress.data.days).forEach(function (id) {
      var rec = Progress.data.days[id];
      if (rec.done && rec.date) days[rec.date] = (days[rec.date] || 0) + 1;
    });
    var row = el('div', 'day-row');
    for (var i = 6; i >= 0; i--) {
      var dt = new Date(); dt.setDate(dt.getDate() - i);
      var key = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
      var chip = el('div', 'day-chip' + (days[key] ? ' done' : ''));
      chip.appendChild(el('span', 'em', days[key] ? '⭐' : '·'));
      chip.appendChild(el('span', 'n', ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()]));
      chip.appendChild(el('span', 't', days[key] ? days[key] + ' mission' + (days[key] > 1 ? 's' : '') : '—'));
      row.appendChild(chip);
    }
    body.appendChild(row);

    /* ---------------------------- talk to him ----------------------- */
    body.appendChild(el('div', 'week-title', 'ONE THING TO ASK HIM AT DINNER'));
    var lastDay = lastFinishedDay();
    body.appendChild(item('good',
      lastDay ? lastDay.title : 'Ask him what he figured out today',
      lastDay ? lastDay.discover.check.q + '  (Answer: ' + correctText(lastDay.discover.check) + ')' : ''));

    body.appendChild(copyBlock(pct, tags, tagCounts, byDomain));
    body.appendChild(voiceBlock());
    body.appendChild(settingsBlock());
  }

  /* --------------------------- helpers ---------------------------- */
  function item(cls, title, sub) {
    var n = el('div', 'report-item ' + (cls || ''));
    n.appendChild(el('b', null, title));
    if (sub) n.appendChild(el('span', null, sub));
    return n;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function median(a) {
    if (!a || !a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
  }
  function correctText(check) {
    var c = check.choices.filter(function (x) { return x.correct; })[0];
    return c ? c.t : '';
  }
  function lastFinishedDay() {
    var best = null, bestDate = '';
    Object.keys(Progress.data.days).forEach(function (id) {
      var rec = Progress.data.days[id];
      if (rec.done && rec.date >= bestDate) { bestDate = rec.date; best = Curriculum.day(id); }
    });
    return best;
  }
  function lookupWord(itemId) {
    // itemId looks like d07-w2
    var m = /^(d\d+)-w(\d+)$/.exec(itemId || '');
    if (!m) return null;
    var d = Curriculum.day(m[1]);
    return d && d.reading ? d.reading.words[+m[2]] : null;
  }

  /* Plain-text summary a grandparent can text to a parent or teacher. */
  function copyBlock(pct, tags, tagCounts, byDomain) {
    var wrap = el('div', 'report-item');
    wrap.appendChild(el('b', null, 'Send this summary to a parent or teacher'));
    var lines = [
      Progress.data.name + ' — Chance Academy progress (' + Progress.today() + ')',
      'Missions finished: ' + Progress.countDone() + ' of ' + Curriculum.count,
      'First-try accuracy: ' + pct + '%   Streak: ' + Progress.data.streak.count +
        (Progress.data.streak.count === 1 ? ' day' : ' days'),
      'Words read aloud: ' + Progress.data.totals.wordsSpoken
    ];
    var weakest = Object.keys(byDomain).sort(function (a, b) {
      return (byDomain[a].ok / byDomain[a].n) - (byDomain[b].ok / byDomain[b].n);
    })[0];
    if (weakest) lines.push('Weakest subject right now: ' + (DOMAIN_NAMES[weakest] || weakest) +
      ' (' + Math.round(100 * byDomain[weakest].ok / byDomain[weakest].n) + '% first try)');
    if (tags.length) {
      var info = Evaluate.tagInfo(tags[0]);
      lines.push('Most common thinking error: ' + (info ? info.label : tags[0]) + ' (' + tagCounts[tags[0]] + 'x)');
      if (info) lines.push('Suggested practice: ' + info.fix);
    }
    var text = lines.join('\n');
    var pre = el('span', null, text);
    pre.style.whiteSpace = 'pre-wrap';
    wrap.appendChild(pre);
    var r = el('div', 'row');
    r.appendChild(App.ui.btn('📋', 'Copy', function () {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
    }));
    r.appendChild(App.ui.btn('✉️', 'Email', function () {
      location.href = 'mailto:?subject=' + encodeURIComponent(Progress.data.name + ' — Chance Academy progress') +
        '&body=' + encodeURIComponent(text);
    }));
    r.appendChild(App.ui.btn('💬', 'Text', function () {
      var ios = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent);
      location.href = 'sms:' + (ios ? '&' : '?') + 'body=' + encodeURIComponent(text);
    }));
    wrap.appendChild(r);
    return wrap;
  }

  /* --------------------- record it in your own voice --------------- */
  function voiceBlock() {
    var s = Recordings.stats();
    var wrap = el('div', 'report-item ' + (s.count ? 'good' : ''));
    wrap.appendChild(el('b', null, '🎙️  Use your own voice instead of the computer'));
    wrap.appendChild(el('span', null, s.count
      ? s.count + (s.count === 1 ? ' line is' : ' lines are') + ' recorded in your voice (' +
        s.mb + ' MB). Everything else still uses the computer voice.'
      : 'Record the app\'s lines yourself and they replace the computer voice everywhere. ' +
        'Start with the coach lines — about 20 minutes, and they repeat on every single day of the course.'));
    var r = el('div', 'row');
    r.appendChild(App.ui.btn('🎙️', s.count ? 'Record more lines' : 'Start recording', function () {
      App.go('studio');
    }));
    wrap.appendChild(r);
    return wrap;
  }

  /* ---------------------------- settings -------------------------- */
  function settingsBlock() {
    var wrap = el('div', 'report-item');
    wrap.appendChild(el('b', null, 'Settings'));

    // name
    var nameField = el('label', 'field', 'Name on the reward cards');
    var nameInput = el('input');
    nameInput.type = 'text';
    nameInput.value = Progress.data.name;
    nameInput.addEventListener('change', function () { Progress.setName(nameInput.value.trim()); });
    nameField.appendChild(nameInput);
    wrap.appendChild(nameField);

    // voice
    var vField = el('label', 'field', 'Computer voice — used only for lines you have not recorded yourself');
    var sel = el('select');
    var auto = el('option', null, 'Automatic — currently ' + Voice.currentVoiceName());
    auto.value = '';
    sel.appendChild(auto);
    Voice.listVoices().forEach(function (v) {
      var o = el('option', null, v.name + ' (' + v.lang + ')');
      o.value = v.name;
      if (Voice.settings.voiceName === v.name) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      Voice.update({ voiceName: sel.value || null });
      Voice.say('Hi Chance. This is my voice. Ready to learn something today?');
    });
    vField.appendChild(sel);
    wrap.appendChild(vField);

    // speed
    var sField = el('label', 'field', 'Speaking speed');
    var speed = el('select');
    [['0.7', 'Very slow'], ['0.82', 'Slow (recommended for reading)'], ['0.95', 'Normal'], ['1.1', 'Quick']]
      .forEach(function (o) {
        var op = el('option', null, o[1]);
        op.value = o[0];
        if (Math.abs(Voice.settings.rate - parseFloat(o[0])) < 0.02) op.selected = true;
        speed.appendChild(op);
      });
    speed.addEventListener('change', function () {
      Voice.update({ rate: parseFloat(speed.value) });
      Voice.say('This is how fast I will read to him.');
    });
    sField.appendChild(speed);
    wrap.appendChild(sField);

    var r = el('div', 'row');
    r.appendChild(App.ui.btn('🔊', 'Test the voice', function () {
      Voice.stop();
      Voice.say('Hi Chance! The Moon is a whole round ball, even when it looks like a sliver.');
    }));
    r.appendChild(App.ui.btn('🎤', 'Check the microphone', function () {
      if (!Voice.canListen()) { alert('This browser cannot listen. Safari on iPad works; the app still reads everything out loud without it.'); return; }
      Voice.say('Say the word: salamander.').then(function () {
        return Voice.listen({ ms: 6000 });
      }).then(function (res) {
        alert(res.transcript ? 'Heard: "' + res.transcript + '" — microphone is working.' : 'Nothing heard. Check Settings → Safari → Microphone.');
      });
    }));
    r.appendChild(App.ui.btn('♻️', 'Reset all progress', function () {
      if (confirm('Erase all stars, badges and reports for ' + Progress.data.name + '? This cannot be undone.')) {
        Progress.reset();
        App.go('home');
      }
    }));
    wrap.appendChild(r);

    var note = el('span', null,
      'Everything is stored on this iPad only — no account, no upload, nothing leaves the device unless you tap Share. ' +
      'Curriculum: ' + Curriculum.count + ' mission days across 3 units.');
    wrap.appendChild(note);
    return wrap;
  }

  return { render: render };
})();


/* ===== js/studio.js ===== */
/* ============================================================
   studio.js — the recording booth

   Where a grown-up records the app's lines in their own voice.
   Designed around one honest fact: there are thousands of lines in
   60 days, and nobody is recording all of them in one sitting. So:

   - Lines are grouped by how often they are actually heard. The
     coach lines come first because they repeat on every single day
     across the whole course. Twenty minutes there changes the
     entire feel of the app.
   - The main flow is one line at a time, big text, tap to record,
     tap to stop, auto-advance. No forms, no fiddling.
   - Anything unrecorded still plays in the synthesized voice, so
     you can stop whenever and nothing breaks.
   ============================================================ */

window.Studio = (function () {

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  var state = { group: null, index: 0, lastBlob: null };

  /* --------------------------- overview --------------------------- */
  function render(body) {
    body.innerHTML = '';
    state.group = null;

    if (!Recordings.canRecord()) {
      body.appendChild(note('This browser cannot record audio. On an iPad use Safari (iOS 14.3 or newer). ' +
        'You can still record on another device and bring the file over with Import.'));
    }

    var s = Recordings.stats();
    var stats = el('div', 'stat-row');
    [[s.count, 'lines recorded'], [s.mb + ' MB', 'stored on device']].forEach(function (x) {
      var n = el('div', 'stat');
      n.appendChild(el('b', null, String(x[0])));
      n.appendChild(el('i', null, x[1]));
      stats.appendChild(n);
    });
    body.appendChild(stats);

    body.appendChild(note(
      'Record any line in your own voice and it replaces the computer voice everywhere that line is spoken. ' +
      'Anything you do not record keeps using the computer voice, so you can stop any time. ' +
      'Start with the Coach lines — he hears those on every single day.'
    ));

    var groups = Recordings.inventory();

    // the two high-value groups get big cards; the 60 days get a list
    groups.filter(function (g) { return !g.day; }).forEach(function (g) {
      body.appendChild(groupCard(body, g, true));
    });

    body.appendChild(el('div', 'week-title', 'LESSON LINES, DAY BY DAY'));
    body.appendChild(note('About 45 lines per day — roughly 4 or 5 minutes of reading each. ' +
      'Recording a week ahead on a Sunday keeps you in front of him.'));

    var list = el('div', 'day-row');
    groups.filter(function (g) { return g.day; }).forEach(function (g) {
      var p = Recordings.groupProgress(g);
      var chip = el('button', 'day-chip' + (p.done === p.total ? ' done' : (p.done ? ' today' : '')));
      chip.appendChild(el('span', 'em', g.em));
      chip.appendChild(el('span', 'n', g.name.split(':')[0]));
      chip.appendChild(el('span', 't', p.done + '/' + p.total));
      chip.addEventListener('click', function () { openGroup(body, g); });
      list.appendChild(chip);
    });
    body.appendChild(list);

    /* ------------------------ backup / move ---------------------- */
    body.appendChild(el('div', 'week-title', 'BACKUP & MOVE TO ANOTHER DEVICE'));
    var io = el('div', 'report-item');
    io.appendChild(el('b', null, 'Your recordings live on this device only'));
    io.appendChild(el('span', null,
      'Export writes every clip to one file. Keep it somewhere safe, or open the app on another iPad and Import it there.'));
    var r = el('div', 'row');
    r.appendChild(App.ui.btn('📤', 'Export all', function () { doExport(); }));
    r.appendChild(App.ui.btn('📥', 'Import a file', function () { doImport(body); }));
    r.appendChild(App.ui.btn('🗑️', 'Delete all recordings', function () {
      if (confirm('Delete every recording? The computer voice comes back. This cannot be undone.')) {
        Recordings.clearAll().then(function () { render(body); });
      }
    }));
    io.appendChild(r);
    body.appendChild(io);
  }

  function groupCard(body, g, big) {
    var p = Recordings.groupProgress(g);
    var card = el('div', 'report-item ' + (p.done === p.total ? 'good' : ''));
    card.appendChild(el('b', null, g.em + '  ' + g.name + ' — ' + p.done + ' of ' + p.total + ' recorded'));
    if (g.blurb) card.appendChild(el('span', null, g.blurb));
    var bar = el('div', 'bar');
    bar.style.cssText = 'height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0;';
    var fill = el('span');
    fill.style.cssText = 'display:block;height:100%;width:' + p.pct + '%;background:linear-gradient(90deg,var(--leaf),var(--sun));';
    bar.appendChild(fill);
    card.appendChild(bar);
    var r = el('div', 'row');
    r.appendChild(App.ui.btn('🎙️', p.done ? 'Continue recording' : 'Start recording', function () { openGroup(body, g); }));
    card.appendChild(r);
    return card;
  }

  /* ------------------------ the booth itself ---------------------- */
  function openGroup(body, g) {
    state.group = g;
    // resume at the first line that has no recording yet
    state.index = 0;
    for (var i = 0; i < g.lines.length; i++) {
      if (!Recordings.has(g.lines[i].text, g.lines[i].kind)) { state.index = i; break; }
    }
    booth(body);
  }

  function booth(body) {
    var g = state.group;
    if (!g) return render(body);
    if (state.index >= g.lines.length) return finished(body);

    var line = g.lines[state.index];
    var recorded = Recordings.has(line.text, line.kind);
    body.innerHTML = '';

    var head = el('div', 'bar-top');
    var back = el('button', 'icon-btn', '⬅️');
    back.addEventListener('click', function () { Recordings.cancelRecording(); render(body); });
    head.appendChild(back);
    var h = el('h2', null, g.em + ' ' + g.name);
    head.appendChild(h);
    body.appendChild(head);

    var p = Recordings.groupProgress(g);
    body.appendChild(note('Line ' + (state.index + 1) + ' of ' + g.lines.length +
      ' · ' + p.done + ' recorded so far' + (line.note ? ' · ' + line.note : '')));

    // the line, big enough to read off the screen at arm's length
    var card = el('div', 'card');
    var script = el('div', 'qtext', line.kind === 'sound'
      ? 'Say this sound: “' + line.text + '”'
      : line.text);
    script.style.fontSize = 'clamp(20px, 5.2vw, 30px)';
    card.appendChild(script);
    if (line.kind === 'sound') {
      card.appendChild(note('Stretch it out the way you would for him — “sss”, not “ess”.'));
    }
    var status = el('div', 'heard', recorded ? '✅ Already recorded in your voice.' : 'Not recorded yet — the computer voice reads this one.');
    card.appendChild(status);
    body.appendChild(card);

    var recBtn = el('button', 'mic-btn', '⏺');
    recBtn.setAttribute('aria-label', 'Record this line');
    var micRow = el('div', 'mic-row');

    var hearBtn = el('button', 'icon-btn', '🔊');
    hearBtn.setAttribute('aria-label', 'Hear the current version');
    hearBtn.addEventListener('click', function () {
      Voice.stop();
      if (line.kind === 'sound') Voice.sayPhoneme(line.text);
      else Voice.say(line.text);
    });

    var skipBtn = el('button', 'icon-btn', '⏭️');
    skipBtn.setAttribute('aria-label', 'Skip this line');
    skipBtn.addEventListener('click', function () { state.index++; booth(body); });

    micRow.appendChild(hearBtn);
    micRow.appendChild(recBtn);
    micRow.appendChild(skipBtn);
    body.appendChild(micRow);

    var busy = false;
    recBtn.addEventListener('click', function () {
      if (busy) return;
      if (!Recordings.isRecording()) {
        Voice.stop();
        busy = true;
        Recordings.startRecording().then(function () {
          busy = false;
          recBtn.textContent = '⏹';
          recBtn.classList.add('live');
          status.textContent = '🔴 Recording… tap the square when you finish.';
        }).catch(function (e) {
          busy = false;
          status.textContent = 'Could not start the microphone. ' +
            'Check Settings → Safari → Microphone, then try again.';
        });
      } else {
        busy = true;
        Recordings.stopRecording().then(function (blob) {
          recBtn.textContent = '⏺';
          recBtn.classList.remove('live');
          state.lastBlob = blob;
          return Recordings.save(line.text, line.kind, blob);
        }).then(function () {
          busy = false;
          status.textContent = '✅ Saved. Playing it back…';
          return Recordings.play(line.text, line.kind);
        }).then(function () {
          // straight on to the next line — that rhythm is what makes
          // recording forty lines bearable
          state.index++;
          booth(body);
        }).catch(function () {
          busy = false;
          status.textContent = 'That recording did not save. Try once more.';
        });
      }
    });

    var actions = [];
    if (recorded) {
      actions.push({
        label: 'Re-record', em: '🔁', cls: 'ghost', fn: function () {
          Recordings.remove(line.text, line.kind).then(function () { booth(body); });
        }
      });
    }
    actions.push({ label: 'Next line', em: '➡️', cls: 'sun', fn: function () { state.index++; booth(body); } });
    App.setActions(actions);
  }

  function finished(body) {
    var g = state.group;
    App.setActions([]);
    body.innerHTML = '';
    var card = el('div', 'card');
    card.appendChild(el('div', 'big-em', '🎙️'));
    card.appendChild(el('h3', null, 'Finished ' + g.name));
    var p = Recordings.groupProgress(g);
    card.appendChild(note(p.done + ' of ' + p.total + ' lines are now in your voice.'));
    var r = el('div', 'row');
    r.appendChild(App.ui.btn('⬅️', 'Back to the list', function () { render(body); }));
    card.appendChild(r);
    body.appendChild(card);
  }

  /* -------------------------- export / import --------------------- */
  function doExport() {
    var s = Recordings.stats();
    if (!s.count) { alert('Nothing recorded yet.'); return; }
    Recordings.exportAll().then(function (data) {
      var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'chance-academy-voice.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
  }

  function doImport(body) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var json;
        try { json = JSON.parse(String(r.result)); }
        catch (e) { alert('That file could not be read.'); return; }
        Recordings.importAll(json).then(function (n) {
          alert('Imported ' + n + ' recordings.');
          render(body);
        }).catch(function (e) { alert(e.message); });
      };
      r.readAsText(f);
    });
    input.click();
  }

  function note(t) {
    var n = el('p', null, t);
    n.style.cssText = 'font-size:15px;color:var(--ink-soft);margin:8px 0;';
    return n;
  }

  return { render: render };
})();


/* ===== js/app.js ===== */
/* ============================================================
   app.js — the shell: icons, routing, rewards, sharing

   The home screen is icon-first on purpose. A 7-year-old should
   never have to read a menu to get started: one big picture for
   today's mission, six picture tiles for everything else, and a
   small grown-up door in the corner.
   ============================================================ */

window.App = (function () {

  var screens = {}, replayFn = null, actionsBar = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  /* ---------------------------- routing --------------------------- */
  var currentScreen = null;

  function go(name, arg) {
    currentScreen = name;
    Voice.stop();
    hideCoach();
    setActions([]);
    Object.keys(screens).forEach(function (k) { screens[k].hidden = k !== name; });
    window.scrollTo(0, 0);
    if (name === 'home') renderHome();
    if (name === 'map') renderMap();
    if (name === 'rewards') renderRewards();
    if (name === 'wordwall') renderWordWall();
    if (name === 'grownup') Grownup.render($('grownupBody'));
    if (name === 'studio') Studio.render($('studioBody'));
    if (name === 'mission' && arg) Stations.run(arg.day, arg.station);
  }

  /* -------------------------- action bar --------------------------

     Inside a mission, Stop and Home ride along on EVERY action bar —
     before a question, while he is answering it, and after. They are
     added here rather than at each call site so a station can never
     forget them and leave him stuck with only "Next".

       ⏹ Stop  hushes the narration instantly and stays put
       🏠 Home  leaves the lesson for the picture menu

     Both are deliberately small next to the wide primary button, so
     the thing to do next is still the obvious one.
     ---------------------------------------------------------------- */
  function setActions(list, opts) {
    if (!actionsBar) {
      actionsBar = el('div', 'actions');
      document.body.appendChild(actionsBar);
    }
    actionsBar.innerHTML = '';

    var items = (list || []).slice();
    if (currentScreen === 'mission' && !(opts && opts.bare)) {
      items = missionExits().concat(items);
    }
    if (!items.length) { actionsBar.style.display = 'none'; return; }

    actionsBar.style.display = 'flex';
    items.forEach(function (a) {
      var b = el('button', 'btn-big ' + (a.cls || ''));
      if (a.em) b.appendChild(el('span', null, a.em));
      b.appendChild(el('span', null, a.label));
      b.addEventListener('click', function () { a.fn(b); });
      actionsBar.appendChild(b);
    });
  }

  function missionExits() {
    return [
      {
        /* 🔇 rather than ⏹ — the crossed-out speaker reads as "no more
           talking" to a 7-year-old, and it mirrors the 🔊 read-it-again
           button in the top bar. ⏹ renders as a tiny grey square. */
        label: 'Stop', em: '🔇', cls: 'ghost compact', fn: function (btn) {
          Voice.stop();
          hideCoach();
          // silent by itself, so show that the tap landed
          btn.classList.add('hushed');
          setTimeout(function () { btn.classList.remove('hushed'); }, 900);
        }
      },
      {
        label: 'Home', em: '🏠', cls: 'ghost compact', fn: function () { confirmHome(); }
      }
    ];
  }

  /* Leaving mid-station means that station's star is not earned yet,
     and a 7-year-old's thumb finds buttons by accident. One picture-
     clear tap to confirm, no reading required. */
  function confirmHome() {
    Voice.stop();
    var day = Stations.current() && Stations.current().day;
    sheet([
      big('🏠'),
      h3('Stop for now?'),
      p(day ? 'Your stars are saved. You can pick up Day ' + day.n + ' again any time.'
            : 'Your stars are saved.'),
      row([
        btn('▶️', 'Keep going', function () { closeSheet(); }),
        btn('🏠', 'Yes, go home', function () { closeSheet(); go('home'); })
      ])
    ]);
  }

  /* ---------------------------- the owl --------------------------- */
  var coachTimer = null;
  function showCoach(text, tone) {
    var c = $('coach');
    $('coachText').textContent = text;
    $('coachFace').textContent = tone === 'good' ? '🦉' : (tone === 'slow-down' ? '🐢' : (tone === 'pattern' ? '🔁' : '🦉'));
    c.hidden = false;
    clearTimeout(coachTimer);
    if (tone === 'good') coachTimer = setTimeout(hideCoach, 6000);
    $('coachSpeak').onclick = function () { Voice.stop(); Voice.say(text); };
  }
  function hideCoach() { $('coach').hidden = true; }

  /* ------------------------ progress feedback --------------------- */
  function setThinkMeter(focus) {
    var f = $('thinkFill');
    f.style.width = Math.max(8, focus) + '%';
    f.className = focus >= 70 ? '' : (focus >= 45 ? 'warn' : 'slow');
  }
  function setPips(done, total) {
    var box = $('missionPips');
    box.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var p = el('i');
      if (i < done) p.className = 'on';
      else if (i === done) p.className = 'now';
      box.appendChild(p);
    }
  }
  function setReplay(fn) { replayFn = fn; }

  function burst(n) {
    var box = $('confetti');
    var ems = ['⭐', '✨', '🌟', '💫', '🎉'];
    for (var i = 0; i < (n || 8); i++) {
      var s = el('i', null, ems[Math.floor(Math.random() * ems.length)]);
      s.style.left = Math.random() * 96 + 'vw';
      s.style.top = '-40px';
      s.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      box.appendChild(s);
      setTimeout(function (node) { return function () { node.remove(); }; }(s), 3200);
    }
  }

  /* ------------------------------ HOME --------------------------- */
  function renderHome() {
    var day = Progress.nextDay();
    if (!day) return;
    var done = Progress.dayStationsDone(day.id);
    $('todayIcon').textContent = day.icon;
    $('todayNumber').textContent = 'Day ' + day.n;
    $('todayTitle').textContent = day.title;
    $('todaySub').textContent = day.unitName + ' · ' + day.weekTitle;
    var dots = $('todayDots');
    dots.innerHTML = '';
    ['discover', 'numbers', 'reading'].forEach(function (s) {
      var i = el('i');
      if (done.indexOf(s) !== -1) i.className = 'on';
      dots.appendChild(i);
    });
    $('homeAvatar').textContent = day.unit === 1 ? '🚀' : (day.unit === 2 ? '🦎' : '⚙️');
    $('tileStarCount').textContent = Progress.data.totals.stars;

    var streak = Progress.data.streak.count;
    $('homeGreeting').textContent = streak > 1
      ? 'Hi ' + Progress.data.name + '! ' + streak + ' days in a row. 🔥'
      : 'Hi ' + Progress.data.name + '! Tap a picture to start.';

    var wp = Progress.weekProgress(), mp = Progress.monthProgress();
    $('goalWeekText').textContent = wp.done + ' of ' + wp.goal + ' days' + (wp.met ? ' ✅' : '');
    $('goalWeekBar').style.width = wp.pct + '%';
    $('goalMonthText').textContent = mp.done + ' of ' + mp.goal + ' days' + (mp.met ? ' ✅' : '');
    $('goalMonthBar').style.width = mp.pct + '%';
  }

  function startMission(day) {
    var done = Progress.dayStationsDone(day.id);
    var next = ['discover', 'numbers', 'reading'].filter(function (s) { return done.indexOf(s) === -1; })[0];
    if (!next) next = 'discover';   // replaying a finished day is allowed
    go('mission', { day: day, station: next });
  }

  /* --------------------- end of a station / day ------------------- */
  function stationFinished(day, station, res, done, summary) {
    setActions([], { bare: true });   // the reward sheet carries its own buttons
    var all = done.length >= 3;
    var names = { discover: 'Science', numbers: 'Numbers', reading: 'Read & Say' };

    if (!all) {
      burst(10);
      Voice.say(Phrases.stationDone);
      var remaining = ['discover', 'numbers', 'reading'].filter(function (s) { return done.indexOf(s) === -1; });
      sheet([
        big('⭐'),
        h3(names[station] + ' done!'),
        p('That is ' + Progress.data.totals.stars + (Progress.data.totals.stars === 1 ? ' star' : ' stars') +
          '. ' + remaining.length + ' stop' + (remaining.length > 1 ? 's' : '') + ' left in today\'s mission.'),
        row([
          btn('➡️', 'Keep going', function () {
            closeSheet();
            go('mission', { day: day, station: remaining[0] });
          }),
          btn('🏠', 'Home', function () { closeSheet(); go('home'); })
        ])
      ]);
      return;
    }

    // whole day finished
    var out = Progress.completeDay(day.id, summary);
    burst(26);
    Voice.say(Phrases.missionDone);
    var stats = [
      { label: 'stars', value: Progress.data.totals.stars },
      { label: 'first try', value: (summary ? summary.firstTryPct : 0) + '%' },
      { label: 'streak', value: Progress.data.streak.count }
    ];
    var badge = {
      id: 'day-' + day.id, em: day.icon,
      name: 'Day ' + day.n + ': ' + day.title,
      blurb: day.unitName + ' · ' + day.weekTitle,
      date: Progress.today(), who: Progress.data.name
    };
    var nodes = [
      big(out.gem ? '💎' : '🏆'),
      h3('Mission Complete!'),
      p(out.gem
        ? 'Every answer right on the first try. That is a Clear Thinker gem.'
        : (summary ? summary.firstTryPct + '% right on the first try.' : 'Great work today.'))
    ];
    if (out.badges && out.badges.length) {
      var bl = el('div', 'badge-grid');
      out.badges.forEach(function (b) {
        var n = el('div', 'badge');
        n.appendChild(el('span', 'em', b.em));
        n.appendChild(el('div', 'nm', b.name));
        n.appendChild(el('div', 'dt', 'NEW!'));
        bl.appendChild(n);
      });
      nodes.push(el('p', null, out.badges.length > 1 ? 'New badges earned!' : 'New badge earned!'));
      nodes.push(bl);
      Voice.say('You earned a new badge: ' + out.badges[0].name + '!');
    }
    nodes.push(row([
      btn('📤', 'Share it', function () { closeSheet(); shareSheet(out.badges && out.badges[0] ? Object.assign({ who: Progress.data.name }, out.badges[0]) : badge, stats); }),
      btn('🏆', 'My rewards', function () { closeSheet(); go('rewards'); }),
      btn('🏠', 'Home', function () { closeSheet(); go('home'); })
    ]));
    sheet(nodes);
  }

  /* ------------------------------ MAP ---------------------------- */
  function renderMap() {
    var body = $('mapBody');
    body.innerHTML = '';
    var next = Progress.nextDay();
    Curriculum.units().forEach(function (u) {
      var uh = el('div', 'week-title');
      uh.appendChild(el('span', 'em', u.em));
      uh.appendChild(el('span', null, 'UNIT ' + u.n + ' · ' + u.name.toUpperCase() + ' — ' + u.blurb));
      body.appendChild(uh);
      u.weeks.forEach(function (w) {
        var block = el('div', 'week-block');
        var wt = el('div', 'week-title');
        wt.appendChild(el('span', 'em', w.em));
        wt.appendChild(el('span', null, 'Week ' + w.n + ' · ' + w.title + ' · badge: ' + w.badge));
        block.appendChild(wt);
        var row2 = el('div', 'day-row');
        Curriculum.daysInWeek(w.n).forEach(function (d) {
          var chip = el('button', 'day-chip');
          if (Progress.isDayDone(d.id)) chip.classList.add('done');
          if (next && next.id === d.id) chip.classList.add('today');
          chip.appendChild(el('span', 'em', Progress.isDayDone(d.id) ? '⭐' : d.icon));
          chip.appendChild(el('span', 'n', 'Day ' + d.n));
          chip.appendChild(el('span', 't', d.title));
          chip.addEventListener('click', function () { startMission(d); });
          row2.appendChild(chip);
        });
        block.appendChild(row2);
        body.appendChild(block);
      });
    });
  }

  /* ---------------------------- REWARDS -------------------------- */
  function renderRewards() {
    var body = $('rewardsBody');
    body.innerHTML = '';
    var t = Progress.data.totals, wp = Progress.weekProgress(), mp = Progress.monthProgress();

    var stats = el('div', 'stat-row');
    [[t.stars, 'stars'], [t.gems, 'gems 💎'], [Progress.data.streak.count, 'day streak'],
     [Progress.countDone(), 'missions done'], [t.wordsSpoken, 'words said']].forEach(function (s) {
      var n = el('div', 'stat');
      n.appendChild(el('b', null, String(s[0])));
      n.appendChild(el('i', null, s[1]));
      stats.appendChild(n);
    });
    body.appendChild(stats);

    var goals = el('div', 'goal-strip');
    [['📅', 'Weekly goal', wp, '5 mission days in one week'],
     ['🎖️', 'Monthly goal', mp, '20 mission days in one month']].forEach(function (g) {
      var n = el('div', 'goal');
      n.appendChild(el('span', 'goal-icon', g[0]));
      var d = el('div');
      d.appendChild(el('b', null, g[1] + (g[2].met ? ' ✅' : '')));
      d.appendChild(el('i', null, g[2].done + ' of ' + g[2].goal + ' — ' + g[3]));
      n.appendChild(d);
      var bar = el('div', 'bar');
      var sp = el('span');
      sp.style.width = g[2].pct + '%';
      bar.appendChild(sp);
      n.appendChild(bar);
      goals.appendChild(n);
    });
    body.appendChild(goals);

    body.appendChild(el('div', 'week-title', 'BADGES EARNED — tap one to send it to family'));
    var earned = Progress.badgeList();
    var grid = el('div', 'badge-grid');
    if (!earned.length) {
      grid.appendChild(el('p', null, 'No badges yet. Finish today\'s mission to earn your first one!'));
    }
    earned.forEach(function (b) {
      var n = el('div', 'badge');
      n.appendChild(el('span', 'em', b.em));
      n.appendChild(el('div', 'nm', b.name));
      n.appendChild(el('div', 'dt', b.date));
      n.addEventListener('click', function () {
        shareSheet(Object.assign({ who: Progress.data.name }, b), [
          { label: 'stars', value: t.stars },
          { label: 'missions', value: Progress.countDone() },
          { label: 'streak', value: Progress.data.streak.count }
        ]);
      });
      grid.appendChild(n);
    });
    body.appendChild(grid);

    var locked = Progress.lockedMilestones();
    if (locked.length) {
      body.appendChild(el('div', 'week-title', 'STILL TO EARN'));
      var lg = el('div', 'badge-grid');
      locked.forEach(function (m) {
        var n = el('div', 'badge locked');
        n.appendChild(el('span', 'em', m.em));
        n.appendChild(el('div', 'nm', m.name));
        n.appendChild(el('div', 'dt', m.blurb));
        lg.appendChild(n);
      });
      body.appendChild(lg);
    }
  }

  /* --------------------------- WORD WALL ------------------------- */
  function renderWordWall() {
    var body = $('wordwallBody');
    body.innerHTML = '';
    body.appendChild(el('p', null, 'Every word from every mission. Tap a word to hear it sounded out.'));
    var byWeek = {};
    Curriculum.wordWall().forEach(function (w) {
      (byWeek[w.week] = byWeek[w.week] || []).push(w);
    });
    Object.keys(byWeek).sort(function (a, b) { return a - b; }).forEach(function (wk) {
      var meta = Curriculum.weekMeta(+wk);
      var t = el('div', 'week-title');
      t.appendChild(el('span', 'em', meta ? meta.em : '📖'));
      t.appendChild(el('span', null, 'Week ' + wk + ' · ' + (meta ? meta.phonics : '')));
      body.appendChild(t);
      var grid = el('div', 'badge-grid');
      byWeek[wk].forEach(function (w) {
        var n = el('div', 'badge');
        n.appendChild(el('span', 'nm', w.w));
        n.appendChild(el('span', 'dt', w.parts.join(' · ')));
        n.addEventListener('click', function () {
          Voice.stop();
          Voice.soundOut(w.w, w.parts);
        });
        grid.appendChild(n);
      });
      body.appendChild(grid);
    });
  }

  /* ---------------------------- SHEETS --------------------------- */
  function sheet(nodes) {
    var s = $('sheet');
    s.innerHTML = '';
    nodes.forEach(function (n) { s.appendChild(n); });
    $('overlay').hidden = false;
  }
  function closeSheet() { $('overlay').hidden = true; }
  function big(em) { return el('div', 'big-em', em); }
  function h3(t) { return el('h3', null, t); }
  function p(t) { return el('p', null, t); }
  function row(btns) {
    var r = el('div', 'row');
    btns.forEach(function (b) { r.appendChild(b); });
    return r;
  }
  function btn(em, label, fn) {
    var b = el('button', 'share-btn');
    b.appendChild(el('span', 'em', em));
    b.appendChild(el('span', null, label));
    b.addEventListener('click', fn);
    return b;
  }

  /* ------------------------- SHARE A REWARD ---------------------- */
  /* Draws the badge as a real PNG, then offers the iOS share sheet
     (Messages / Mail / AirDrop / Photos all attach the picture),
     plus plain text and email fallbacks. */
  function shareSheet(badge, stats) {
    var canvas = Rewards.drawCard(badge, stats);
    var status = el('p', null, 'Send this to Grandpa, Mom, or anybody you want.');
    var nodes = [
      h3('Share your reward'),
      canvas,
      status,
      row([
        btn('📤', 'Share / AirDrop', function () {
          status.textContent = 'Opening share sheet…';
          Rewards.share(badge, canvas, Progress.data.name).then(function (r) {
            status.textContent = r === 'shared' || r === 'shared-text' ? 'Sent! 🎉'
              : (r === 'cancelled' ? 'No problem — try another way.' : 'Sharing is not available here. Try Save or Text.');
          });
        }),
        btn('💬', 'Text it', function () { Rewards.textIt(badge, Progress.data.name); }),
        btn('✉️', 'Email it', function () { Rewards.emailIt(badge, Progress.data.name); })
      ]),
      row([
        btn('💾', 'Save picture', function () {
          Rewards.download(badge, canvas).then(function () { status.textContent = 'Saved to your device. 📥'; });
        }),
        btn('📋', 'Copy text', function () {
          Rewards.copyIt(badge, Progress.data.name).then(function (ok) {
            status.textContent = ok ? 'Copied — paste it anywhere.' : 'Could not copy here.';
          });
        }),
        btn('✖️', 'Close', function () { closeSheet(); go('home'); })
      ])
    ];
    sheet(nodes);
  }

  /* ------------------------------ BOOT --------------------------- */
  function boot() {
    ['home', 'mission', 'map', 'rewards', 'wordwall', 'grownup', 'studio'].forEach(function (k) {
      screens[k] = $('screen-' + k);
    });

    // Any first tap unlocks iOS speech.
    var unlock = function () {
      Voice.unlock();
      if (window.Recordings) Recordings.unlock();
      document.removeEventListener('touchstart', unlock);
      document.removeEventListener('click', unlock);
    };
    document.addEventListener('touchstart', unlock, { once: true });
    document.addEventListener('click', unlock, { once: true });

    document.body.addEventListener('click', function (e) {
      var t = e.target.closest('[data-go]');
      if (!t) return;
      var v = t.getAttribute('data-go');
      if (v.indexOf('station:') === 0) {
        var day = Progress.nextDay();
        go('mission', { day: day, station: v.split(':')[1] });
      } else if (v === 'home' && currentScreen === 'mission') {
        confirmHome();          // same check as the bottom Home button
      } else {
        go(v);
      }
    });

    $('todayCard').addEventListener('click', function () { startMission(Progress.nextDay()); });
    $('todayCard').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') startMission(Progress.nextDay());
    });
    $('btnGrownups').addEventListener('click', function () { go('grownup'); });
    $('btnReplay').addEventListener('click', function () { if (replayFn) replayFn(); });
    $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeSheet(); });

    go('home');
  }

  // If the scripts are inlined at the end of the document (single-file
  // builds), DOMContentLoaded may already have fired by now.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    go: go, setActions: setActions, showCoach: showCoach, hideCoach: hideCoach,
    setThinkMeter: setThinkMeter, setPips: setPips, setReplay: setReplay, burst: burst,
    stationFinished: stationFinished, startMission: startMission,
    sheet: sheet, closeSheet: closeSheet, shareSheet: shareSheet,
    ui: { el: el, big: big, h3: h3, p: p, row: row, btn: btn }
  };
})();

</script>
